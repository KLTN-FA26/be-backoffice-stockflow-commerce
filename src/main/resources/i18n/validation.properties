# Bean Validation message overrides.
#
# Referenced from an annotation as message = "{jakarta.validation.constraints.NotBlank.message}",
# or left to the default, which Hibernate Validator resolves through this bundle first.
#
# Only the constraints actually used in this codebase are listed. Adding an unused override is how
# a bundle drifts out of date without anybody noticing.

jakarta.validation.constraints.NotNull.message=is required
jakarta.validation.constraints.NotBlank.message=must not be blank
jakarta.validation.constraints.NotEmpty.message=must not be empty
jakarta.validation.constraints.Min.message=must be at least {value}
jakarta.validation.constraints.Max.message=must be at most {value}
jakarta.validation.constraints.Size.message=must be between {min} and {max} characters
jakarta.validation.constraints.Pattern.message=has an invalid format
jakarta.validation.constraints.DecimalMin.message=must be at least {value}
jakarta.validation.constraints.Email.message=must be a valid email address

com.stockflow.common.validation.ValidSku.message=must be a valid SKU
com.stockflow.common.validation.VietnamPhone.message=must be a valid Vietnamese phone number
com.stockflow.common.validation.NotBlankTrimmed.message=must not be blank
procurement.deliveryContact=must provide a valid contact for the selected communication channel
procurement.phoneDigits=must contain between 8 and 15 digits
procurement.rejectionReason=must provide a reason for rejection
