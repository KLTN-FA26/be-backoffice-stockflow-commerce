# =============================================================================
# Shared DEV SERVER on one small VPS (2 vCPU / 4 GB): the backend the frontend team builds against.
#
# Lives at /opt/stockflow/docker-compose.yml on the server (CI rsyncs this directory there) and is
# driven by scripts/deploy.sh - not by hand, so the image tag that is running is always recorded.
#
# Runs the application with the `dev` profile (application-dev.yml): security ON, full trace
# sampling, SQL statement logging, admin-only loggers/threaddump. NOT a production setup - see
# "Before this becomes production" in README.md for what changes.
#
# Differences from the development compose file at the repository root, all deliberate:
#   - ONLY nginx publishes PUBLIC ports. Docker writes its own iptables rules ahead of ufw, so a
#     port published on 0.0.0.0 is reachable from the internet with the firewall "on". The one
#     exception is Postgres, published on 127.0.0.1 only, so an SSH tunnel has a stable target
#     (localhost:5432) instead of a container IP that changes on every recreate. Any new `ports:`
#     entry must carry the 127.0.0.1 prefix, and needs Docker >= 28: older releases let hosts on
#     the same L2 segment reach loopback-published ports.
#   - Every service has a memory limit, and they add up to ~2.8 GB. Without limits the JVM sizes its
#     heap from the HOST's 4 GB and the kernel's OOM killer picks a victim - usually Postgres.
#   - ClamAV (~1.2 GB, a third of the machine) only with the `scan` profile. By default upload
#     scanning is switched OFF instead, which the application logs as a warning at startup.
#     Acceptable while only the team uploads files; on a machine with the memory for it, set
#     COMPOSE_PROFILES=scan and UPLOAD_INSPECTION_ENABLED=true in .env (README, "Upload scanning").
#   - No Elasticsearch: no Java code uses it.
#   - No MinIO and no Mailpit (removed 2026-11-18). Files live in an AWS S3 bucket, published product
#     images are served by CloudFront (README, "Object storage on AWS S3"), and e-mail goes out
#     through Resend (README, "E-mail"). Both stay in the root compose file for local development.
#   - The application runs a pre-built image from GHCR; this file never builds.
# =============================================================================

name: stockflow

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  # The json-file driver keeps every line forever by default. The dev profile logs every SQL
  # statement, so without rotation the disk fills in days, not weeks.
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:

  nginx:
    image: nginx:1.27-alpine
    <<: [*restart, *logging]
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Substituted into templates/*.template at container start by the official image's
      # entrypoint. Only variables that are actually set are replaced, so nginx's own $host,
      # $remote_addr etc. pass through untouched.
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      # Shared with the back-office BFF (Vercel server env, same name). A request carrying it may
      # set the login rate-limit identity (X-Stockflow-Client-IP). `:?` rejects unset AND empty,
      # so the trust path can never open on an empty match. Hex only: openssl rand -hex 32.
      BFF_ORIGIN_SECRET: ${BFF_ORIGIN_SECRET:?BFF_ORIGIN_SECRET is required - openssl rand -hex 32}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs:/etc/nginx/certs:ro
      - ./auth:/etc/nginx/auth:ro
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    # IMAGE_TAG is written into .env by scripts/deploy.sh, so a plain `docker compose up -d` (after
    # editing .env, say) recreates the application from the image that is actually deployed. No
    # default: a fallback tag would silently run a different build, or one the server cannot pull.
    image: ${APP_IMAGE:?APP_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is unset - run scripts/deploy.sh <tag> once}
    <<: [*restart, *logging]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Listed one by one rather than `env_file: .env`, which would also hand the application values it
    # has no use for (the nginx-only BFF_ORIGIN_SECRET, the deploy script's ROLLBACK_TAG).
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Container names: inside the compose network each service resolves by name.
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # The application validates its own tokens against the keys it publishes itself.
      JWT_JWK_SET_URI: http://localhost:8080/oauth2/jwks
      # The signing key lives on the host (./jwt, mounted below), so tokens survive a deploy or a restart. The first
      # start writes a new key there; scripts/deploy.sh gives the directory to the container user beforehand.
      JWT_PRIVATE_KEY_PATH: /var/lib/stockflow/jwt/signing-key.pem
      # Files on AWS S3 (README, "Object storage on AWS S3"): the bucket, the keys of an IAM user holding only
      # infra/aws's ApplicationMediaPolicyArn (never root keys), and the bucket's own region - no default, because a
      # wrong region fails every call and every presigned link with a redirect.
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required - the AWS bucket}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required - the IAM user's access key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required - the IAM user's secret key}
      AWS_REGION: ${AWS_REGION:?AWS_REGION is required - the bucket's region, e.g. ap-southeast-2}
      # Empty talks to AWS itself. Only an S3-compatible service elsewhere sets it, with S3_PATH_STYLE=true.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
      # The CloudFront origin that serves product-images/ (infra/aws/media-cloudfront.yaml, output
      # ProductMediaBaseUrl). Blank keeps private files and uploads working; only the public gallery answers 503.
      PRODUCT_MEDIA_CDN_BASE_URL: ${PRODUCT_MEDIA_CDN_BASE_URL:-}
      STOCKFLOW_STORAGE_OBJECT_LOCK_ENABLED: ${S3_OBJECT_LOCK_ENABLED:-false}
      # With the lock on, an issued e-invoice's files are locked in COMPLIANCE for ten years from the end of the year:
      # nobody can delete them, the bucket included. GOVERNANCE only on a bucket holding test invoices.
      S3_OBJECT_LOCK_EINVOICE_MODE: ${S3_OBJECT_LOCK_EINVOICE_MODE:-COMPLIANCE}
      # Optional demo data (db/demo) - see .env.example for why it is off. Switching it either way
      # needs a database reset: Flyway refuses to start when migrations appear (or vanish) out of
      # order, and the demo versions interleave with the real ones.
      SPRING_FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration}
      # Off by default for the reason in application.yml: the request carries its own unit price.
      STOCKFLOW_CHECKOUT_GUEST_ENABLED: ${GUEST_CHECKOUT_ENABLED:-false}
      STOCKFLOW_UPLOAD_INSPECTION_ENABLED: ${UPLOAD_INSPECTION_ENABLED:-false}
      STOCKFLOW_UPLOAD_INSPECTION_HOST: ${UPLOAD_INSPECTION_HOST:-clamav}
      # Connections allowed to set the client address through X-Forwarded-For (SCRUM-483): a regex over the
      # peer address. nginx reaches the application over the compose network (private range); the
      # application publishes no port. Same value as the default in application-prod.yml / -dev.yml. A
      # request from anywhere else keeps its own address whatever the header says.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|127\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|0:0:0:0:0:0:0:1|::1}
      STOCKFLOW_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*}
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      # E-mail (SCRUM-352) goes out through Resend: RESEND_API_KEY and RESEND_FROM (an address on a domain verified in
      # Resend) in .env. Without either the APPLICATION refuses to start, saying which - not compose: a ':?' here
      # would break every compose command, a rollback included, until the server's .env is edited.
      # This stack has no SMTP server, so the provider is not configurable here, and Spring Boot's mail health
      # check (on by default in the dev profile) is switched off: it would probe a relay that does not exist and
      # report the whole /actuator/health as DOWN.
      EMAIL_PROVIDER: resend
      MAIL_HEALTH_ENABLED: "false"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      # Seals carriers' API keys and webhook secrets in the database (openssl rand -base64 32). Blank: they cannot be
      # saved until it is set. Keep it with the database backups: without it the sealed secrets cannot be read.
      STOCKFLOW_SECRETS_KEY: ${STOCKFLOW_SECRETS_KEY:-}
      # Links a producer opens without signing in (4A-3: its production order slip and print files). Every link
      # starts with the public base URL; blank makes none and the mail says the coordinator sends the files. With a
      # base URL the APPLICATION refuses to start without the HMAC key (openssl rand -base64 32) - not compose: a
      # ':?' here would break every compose command, a rollback included, until the server's .env is edited.
      # Changing the key breaks every link already mailed (staff re-send them from the production order).
      STOCKFLOW_PUBLIC_BASE_URL: ${STOCKFLOW_PUBLIC_BASE_URL-https://api.${DOMAIN}}
      STOCKFLOW_LINKS_KEY: ${STOCKFLOW_LINKS_KEY:-}
      # The PDF/X output intent stamped into an approved print file (FE request 2026-11-18 BE-3). Unset or blank: the
      # ICC profile bundled in the image, ISO Coated v2 (ECI) under FOGRA39 - the one the storefront embeds. A printer's
      # own profile is a path inside the container (mount it) with its condition identifier, which is then required.
      DESIGN_PRINT_ICC_PROFILE: ${DESIGN_PRINT_ICC_PROFILE:-classpath:print/icc/ISOcoated_v2_eci.icc}
      DESIGN_PRINT_OUTPUT_CONDITION: ${DESIGN_PRINT_OUTPUT_CONDITION:-}
      DESIGN_PRINT_OUTPUT_INFO: ${DESIGN_PRINT_OUTPUT_INFO:-}
      # Off until the customer mail phase of the business documents: no customer order mail, staff and producer
      # mail and the portal invitation unchanged. Never true on a server holding copies of real customers.
      CUSTOMER_EMAIL_ENABLED: ${CUSTOMER_EMAIL_ENABLED:-false}
      # E-invoice mail to the buyer: on, since an issued invoice must reach the buyer (NĐ 254 Điều 12 khoản 3). It is
      # delivered for real, so set it false on a server holding copies of real customers.
      EINVOICE_EMAIL_ENABLED: ${EINVOICE_EMAIL_ENABLED:-true}
      # SePay eInvoice's key (deploy/.env.example). Blank: SePay cannot be switched on; the sandbox keeps issuing.
      EINVOICE_SEPAY_ENVIRONMENT: ${EINVOICE_SEPAY_ENVIRONMENT:-SANDBOX}
      EINVOICE_SEPAY_CLIENT_ID: ${EINVOICE_SEPAY_CLIENT_ID:-}
      EINVOICE_SEPAY_CLIENT_SECRET: ${EINVOICE_SEPAY_CLIENT_SECRET:-}
      EINVOICE_SEPAY_PROVIDER_ACCOUNT_ID: ${EINVOICE_SEPAY_PROVIDER_ACCOUNT_ID:-}
      # Bank feed, SePay (part C; .env.example). Off unless BANK_FEED_ENABLED=true; a blank account follows
      # COMPANY_BANK_ACCOUNT_NUMBER.
      BANK_FEED_ENABLED: ${BANK_FEED_ENABLED:-false}
      BANK_FEED_WEBHOOK_HMAC_SECRET: ${BANK_FEED_WEBHOOK_HMAC_SECRET:-}
      BANK_FEED_WEBHOOK_API_KEY: ${BANK_FEED_WEBHOOK_API_KEY:-}
      BANK_FEED_ACCOUNT_NUMBER: ${BANK_FEED_ACCOUNT_NUMBER:-${COMPANY_BANK_ACCOUNT_NUMBER:-}}
      BANK_FEED_API_TOKEN: ${BANK_FEED_API_TOKEN:-}
      BANK_FEED_API_BASE_URL: ${BANK_FEED_API_BASE_URL:-https://userapi.sepay.vn/v2}
      TRACE_SAMPLING: ${TRACE_SAMPLING:-1.0}
      # B2B onboarding (SCRUM-429): the portal page an invitation links to. Without it Sales cannot create a customer
      # (503 PORTAL_INVITATION_UNAVAILABLE) and, with self-registration gone, nobody can. Required, never guessed.
      PORTAL_ACTIVATION_URL: ${PORTAL_ACTIVATION_URL:?PORTAL_ACTIVATION_URL is required}
      # Bank transfer instructions (SCRUM-193). Not required: blank only turns GET /orders/me/{id}/transfer-instructions
      # into 503 TRANSFER_INSTRUCTIONS_UNAVAILABLE, so a customer is never shown a made-up account.
      COMPANY_BANK_NAME: ${COMPANY_BANK_NAME:-}
      COMPANY_BANK_ACCOUNT_NUMBER: ${COMPANY_BANK_ACCOUNT_NUMBER:-}
      COMPANY_BANK_ACCOUNT_NAME: ${COMPANY_BANK_ACCOUNT_NAME:-}
      COMPANY_BANK_BIN: ${COMPANY_BANK_BIN:-}
      # The seller on sales contracts and e-invoices (4B-4, WF-05 E1): the company's name, tax code and registered
      # address, its legal representative and their title, as on its business registration. This compose runs the dev
      # profile, so an unset or blank value falls back to a placeholder company and the server keeps working (the
      # fallback is spelled out here because a blank passed through would override the profile's own default). The name
      # has no "demo" wording: it is printed on the production order slip a capstone shows (owner, 2026-11-19).
      # A deployment in the prod profile sets all five: there the application refuses to start without them.
      SELLER_NAME: ${SELLER_NAME:-CÔNG TY TNHH SẢN XUẤT BAO BÌ AN PHÁT}
      SELLER_TAX_CODE: ${SELLER_TAX_CODE:-0312345678}
      SELLER_ADDRESS: ${SELLER_ADDRESS:-Số 268 Đường số 7, Phường Tân Tạo, Thành phố Hồ Chí Minh}
      SELLER_REPRESENTATIVE: ${SELLER_REPRESENTATIVE:-Trần Quốc An}
      SELLER_REPRESENTATIVE_TITLE: ${SELLER_REPRESENTATIVE_TITLE:-Giám đốc}
      # The seller's letterhead on quotations and contracts: the same fictional company. The account follows
      # COMPANY_BANK_* when those are set, so a contract and the transfer instructions name one account.
      SELLER_PHONE: ${SELLER_PHONE:-(028) 3765 0000}
      SELLER_EMAIL: ${SELLER_EMAIL:-kinhdoanh@baobianphat.example}
      SELLER_WEBSITE: ${SELLER_WEBSITE:-www.baobianphat.example}
      SELLER_BANK_ACCOUNT_NUMBER: ${SELLER_BANK_ACCOUNT_NUMBER:-${COMPANY_BANK_ACCOUNT_NUMBER:-0071001234567}}
      SELLER_BANK_NAME: ${SELLER_BANK_NAME:-${COMPANY_BANK_NAME:-Ngân hàng TMCP Ngoại thương Việt Nam (Vietcombank)}}
      SELLER_BANK_BRANCH: ${SELLER_BANK_BRANCH:-Chi nhánh Bình Tây}
      SELLER_CITY: ${SELLER_CITY:-Thành phố Hồ Chí Minh}
      SELLER_LOGO: ${SELLER_LOGO:-classpath:branding/seller-logo.png}
      CACHE_VERSION: ${CACHE_VERSION:-v1}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      AUDIT_ROUTINE_RETENTION: ${AUDIT_ROUTINE_RETENTION:-P180D}
      AUDIT_SECURITY_RETENTION: ${AUDIT_SECURITY_RETENTION:-P730D}
      # Replaces the Dockerfile's JAVA_OPTS, so its flags are repeated. The heap is held to 60% of
      # the limit rather than the image's 75%: at 1.4 GB the remaining 25% is too little for
      # metaspace (Hibernate, Modulith and the AWS SDK load a lot of classes), the code cache and
      # thread stacks, and the container would be OOM-killed with the heap itself only half full.
      # Flight Recorder runs all the time (about 1-2% CPU, a few tens of MB of native memory): the last 6 hours, at
      # most 200 MB, so the next hang names the frame that blocked (jdk.VirtualThreadPinned, thread dumps, locks).
      # Kept in /tmp, which the image's unprivileged user can always write: a path the JVM cannot write makes it
      # refuse to start, and a rollback would inherit the same JAVA_OPTS. /tmp lives as long as the container, so
      # read it before the container is recreated - deploy/README.md, "When the application hangs".
      JAVA_OPTS: >-
        -XX:MaxRAMPercentage=60.0
        -XX:MaxMetaspaceSize=256m
        -XX:ReservedCodeCacheSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:StartFlightRecording=name=continuous,settings=default,disk=true,maxage=6h,maxsize=200m,dumponexit=true,filename=/tmp/stockflow.jfr
        -Djava.security.egd=file:/dev/./urandom
        -Duser.timezone=UTC
    volumes:
      # Read-write: the key is created here on the first start. Owner-only (700 / 600), owned by the image's
      # `stockflow` user; never rsynced (.github/workflows/build.yml excludes jwt/) and never in a backup dump.
      - ./jwt:/var/lib/stockflow/jwt
    mem_limit: 1400m
    # Graceful shutdown needs time to finish in-flight requests before Docker sends SIGKILL.
    stop_grace_period: 40s
    # Overrides the Dockerfile's 60 s start period. On 2 vCPUs the first start - JVM warm-up plus
    # every Flyway migration - takes well over a minute, and an instance marked unhealthy during it
    # makes deploy.sh roll back a release that was merely slow.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 240s
      retries: 3

  postgres:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # Same guard rails as development (see the root docker-compose.yml for the reasoning), with
    # memory sized to the 768 MB limit: shared_buffers at a third, work_mem small because a dev
    # server has a handful of connections, not a reporting workload.
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - statement_timeout=10000
      - -c
      - lock_timeout=5000
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - log_min_duration_statement=500
    # Loopback only - reachable through `ssh -L`, never from the internet. Without the 127.0.0.1
    # prefix Docker binds 0.0.0.0 and bypasses ufw (see the header).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # shared_buffers lives in /dev/shm; Docker's default 64 MB would make Postgres fail to start.
    shm_size: 320m
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    # Cache, rate limiting and ad-hoc locks - never the source of truth, so no persistence and LRU
    # eviction. A password even on the internal network: one compromised container should not be
    # able to read or poison every cache entry.
    command: >-
      redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Upload scanning, only with the `scan` profile (COMPOSE_PROFILES=scan in .env) and with
  # UPLOAD_INSPECTION_ENABLED=true, which points the application at this host. ~1.2 GB: not on the
  # 4 GB machine. INSTREAM is capped by StreamMaxLength, but a stream over MaxFileSize is silently
  # NOT scanned and reported OK unless AlertExceedsMax is on; design renders may be 50 MiB, so the
  # three limits are raised together and exceeding them is a detection (fail closed). Same settings
  # as docker-compose.media.yml at the repository root.
  clamav:
    image: clamav/clamav:stable
    <<: [*restart, *logging]
    profiles: ["scan"]
    volumes:
      - clamav-signatures:/var/lib/clamav
    environment:
      CLAMD_CONF_StreamMaxLength: 52M
      CLAMD_CONF_MaxFileSize: 52M
      CLAMD_CONF_MaxScanSize: 104M
      CLAMD_CONF_AlertExceedsMax: "yes"
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # Traces from the dev profile's 100% sampling. In-memory storage, capped, so it cannot grow past
  # its limit; traces are lost on restart, which is fine for "why was that request slow just now".
  # The UI is served at jaeger.<domain> behind basic auth (it has no authentication of its own).
  jaeger:
    image: jaegertracing/all-in-one:1.60
    <<: [*restart, *logging]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "5000"
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:14269/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Live container logs in the browser, so reading the application's log no longer needs SSH and
  # `docker compose logs`. Reads the json-file logs through the Docker socket and stores nothing
  # itself, so it shows exactly what the rotation above keeps (5 x 20 MB per container).
  #
  # The socket is root on the host: `:ro` only stops the socket FILE being replaced, not API calls.
  # What keeps this read-only is that container actions and shell stay at Dozzle's default (off) -
  # never set DOZZLE_ENABLE_ACTIONS or DOZZLE_ENABLE_SHELL here. The UI is served at logs.<domain>
  # behind the same basic auth as Jaeger: the dev profile logs SQL text, user ids and emails.
  dozzle:
    image: amir20/dozzle:v11.3.1
    <<: [*restart, *logging]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # This stack only. The VPS runs other compose projects (Sales Radar) whose logs are not ours
      # to read.
      DOZZLE_FILTER: label=com.docker.compose.project=stockflow
      DOZZLE_NO_ANALYTICS: "true"
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres-data:
  clamav-signatures:
