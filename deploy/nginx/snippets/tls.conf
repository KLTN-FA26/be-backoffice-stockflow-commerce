# Cloudflare Origin Certificate (SSL/TLS -> Origin Server in the Cloudflare dashboard), issued for
# "<domain>, *.<domain>". It is trusted by Cloudflare only - which is fine, because with the
# zone in "Full (strict)" mode Cloudflare is the only client that ever sees it.
ssl_certificate     /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin.key;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
