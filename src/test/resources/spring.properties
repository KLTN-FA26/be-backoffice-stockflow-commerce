# Read by Spring's TestContext framework (SpringProperties), so it applies under Maven and in the IDE alike.
#
# The default is 32 cached contexts, kept open until the JVM exits - each a whole application with its
# own connection pool and database. Capping the cache closes the least recently used context instead,
# which drops its database on the shared test Postgres (support/SharedPostgres) and frees its heap.
# The shared contexts are used by dozens of classes and stay at the recent end; what gets evicted is
# mostly a one-class context that would never be asked for again.
spring.test.context.cache.maxSize=8
