contract.pdf.clause.goods.price=Đơn giá nêu trên là giá cho một đơn vị hàng hóa, đã gồm chi phí in và đóng gói tiêu chuẩn, chưa gồm thuế giá trị gia tăng. Thuế suất thuế giá trị gia tăng áp dụng theo quy định của pháp luật tại thời điểm lập hóa đơn; nếu thuế suất thay đổi thì tiền thuế được tính lại tương ứng, đơn giá chưa thuế không thay đổi, và phần chênh lệch tiền thuế được thanh toán thêm hoặc hoàn lại theo hóa đơn.
contract.pdf.clause.quality=CHẤT LƯỢNG, QUY CÁCH VÀ MẪU IN
contract.pdf.clause.quality.sample=Hàng hóa được sản xuất theo thiết kế do Bên B cung cấp và theo mẫu in đã được Bên B duyệt. Bên A chỉ sản xuất hàng loạt sau khi Bên B duyệt mẫu in; mẫu in đã duyệt là căn cứ nghiệm thu chất lượng và là phần không thể tách rời của Hợp đồng này.
contract.pdf.clause.quality.rounds=Bên A in mẫu miễn phí %d lần cho mỗi mặt hàng. Từ lần in mẫu tiếp theo do Bên B thay đổi thiết kế, hai Bên thỏa thuận chi phí trước khi thực hiện.
contract.pdf.clause.quality.tolerance=Do đặc thù của sản xuất in, số lượng thực giao của mỗi mặt hàng được phép chênh lệch trong phạm vi ±%d%% so với số lượng đặt. Bên B thanh toán theo số lượng thực giao ghi trên biên bản giao nhận.
contract.pdf.clause.quality.colour=Màu sắc in theo mẫu in đã duyệt. Chênh lệch nhẹ về màu sắc giữa các lô in hoặc giữa bản in và hình hiển thị trên màn hình là đặc tính kỹ thuật của công nghệ in và không được coi là hàng không phù hợp với Hợp đồng.
contract.pdf.clause.quality.design=Bên B chịu trách nhiệm về nội dung, hình ảnh, nhãn hiệu và quyền sở hữu trí tuệ đối với thiết kế giao cho Bên A in.
contract.pdf.clause.packing=BAO BÌ, ĐÓNG GÓI
contract.pdf.clause.packing.cartons=Hàng hóa được đóng trong thùng carton theo quy cách đóng gói ghi tại Điều 1, bảo đảm an toàn trong quá trình bốc xếp và vận chuyển thông thường.
contract.pdf.clause.packing.labels=Mỗi thùng có nhãn ghi mã hàng, tên hàng, số lượng và mã thùng để hai Bên kiểm đếm khi giao nhận.
contract.pdf.clause.delivery=GIAO NHẬN HÀNG HÓA
contract.pdf.clause.delivery.place=Địa điểm giao hàng: %s. Người nhận hàng: %s, điện thoại %s.
contract.pdf.clause.delivery.schedule=Hàng hóa được giao thành %d đợt theo lịch sau:
contract.pdf.clause.delivery.record=Mỗi đợt giao hàng, hai Bên lập Biên bản giao nhận hàng hóa ghi rõ chủng loại, số lượng thực giao và tình trạng hàng, có chữ ký của người giao và người nhận. Biên bản giao nhận là căn cứ để lập hóa đơn và thanh toán.
contract.pdf.clause.delivery.check=Khi nhận hàng, Bên B có trách nhiệm kiểm tra số lượng và quy cách hàng hóa tại chỗ. Nếu phát hiện hàng thiếu hoặc không đúng quy cách thì hai Bên ghi nhận ngay trên Biên bản giao nhận.
contract.pdf.clause.delivery.risk=Quyền sở hữu và rủi ro đối với hàng hóa chuyển từ Bên A sang Bên B kể từ thời điểm hai Bên ký Biên bản giao nhận của đợt giao đó.
contract.pdf.clause.payment=THANH TOÁN
contract.pdf.clause.payment.plan=Bên B thanh toán giá trị Hợp đồng cho Bên A thành %d đợt như sau:
contract.pdf.clause.payment.account=Hình thức thanh toán: chuyển khoản vào tài khoản số %s tại %s, chủ tài khoản: %s.
contract.pdf.clause.payment.transfer=Hình thức thanh toán: chuyển khoản vào tài khoản do Bên A thông báo bằng văn bản.
contract.pdf.clause.payment.currency=Đồng tiền thanh toán theo Hợp đồng này là Việt Nam Đồng. Phí chuyển tiền do Bên B chịu.
contract.pdf.clause.payment.cancel=Các khoản Bên B thanh toán trước khi nhận hàng là khoản thanh toán trước, không phải tiền đặt cọc, kể cả khi đợt thanh toán được ghi tên là đặt cọc. Trước khi hàng hóa của Hợp đồng được đưa vào in hàng loạt, Bên B có quyền huỷ Hợp đồng và Bên A hoàn lại toàn bộ số tiền đã nhận, không tính phí. Sau thời điểm đó, Hợp đồng chỉ được huỷ khi Bên A đồng ý; hai Bên thỏa thuận chấm dứt Hợp đồng kèm một khoản phí huỷ tính theo tỷ lệ phần trăm số tiền Bên A đã nhận hoặc một số tiền cụ thể, không vượt quá giá trị Hợp đồng. Phí huỷ được trừ vào số tiền Bên B đã thanh toán; phần còn thừa Bên A hoàn lại cho Bên B.
contract.pdf.clause.payment.credit=Phần thanh toán sau giao hàng có hiệu lực khi Bên A xác nhận hạn mức công nợ của Bên B. Nếu Bên A không xác nhận thì Hợp đồng bị huỷ bỏ và Bên A hoàn lại toàn bộ số tiền đã nhận.
contract.pdf.clause.invoice=HÓA ĐƠN
contract.pdf.clause.invoice.each=Bên A lập hóa đơn điện tử giá trị gia tăng cho từng đợt giao hàng, theo số lượng thực giao, và gửi cho Bên B theo quy định của pháp luật về hóa đơn, chứng từ (Nghị định số 254/2026/NĐ-CP và Thông tư số 91/2026/TT-BTC).
contract.pdf.clause.invoice.details=Thông tin xuất hóa đơn của Bên B là thông tin ghi tại phần đầu Hợp đồng này. Bên B thông báo cho Bên A bằng văn bản khi có thay đổi.
contract.pdf.clause.claims=KHIẾU NẠI, ĐỔI TRẢ VÀ BẢO HÀNH
contract.pdf.clause.claims.window=Bên B có quyền khiếu nại về số lượng, chất lượng hàng hóa của mỗi đợt giao trong thời hạn %d ngày kể từ ngày giao đợt đó. Quá thời hạn này, hàng hóa được coi là đã được Bên B chấp nhận.
contract.pdf.clause.claims.faulty=Đối với hàng hóa bị lỗi do in ấn hoặc sản xuất, Bên A có trách nhiệm đổi hàng hoặc nhận lại hàng và hoàn lại số tiền tương ứng theo lựa chọn của Bên B. Việc trả hàng được lập thành Biên bản trả lại hàng hóa, làm căn cứ điều chỉnh hóa đơn và công nợ.
contract.pdf.clause.claims.warranty=Bên A bảo hành chất lượng in (không bong tróc, không lem mực trong điều kiện sử dụng thông thường) trong thời hạn %d tháng kể từ ngày giao hàng, với điều kiện hàng hóa được bảo quản nơi khô ráo, tránh ánh nắng trực tiếp. Bảo hành không áp dụng cho hư hỏng do bảo quản hoặc sử dụng không đúng cách.
contract.pdf.clause.duties=QUYỀN VÀ NGHĨA VỤ CỦA CÁC BÊN
contract.pdf.clause.duties.seller=Bên A có nghĩa vụ giao hàng đúng chủng loại, số lượng, chất lượng và thời hạn đã thỏa thuận, cung cấp đầy đủ hóa đơn, chứng từ; có quyền nhận thanh toán đúng hạn và tạm ngừng giao hàng khi Bên B chậm thanh toán khoản đã đến hạn.
contract.pdf.clause.duties.buyer=Bên B có nghĩa vụ cung cấp thiết kế, duyệt mẫu in đúng hạn, nhận hàng và thanh toán đầy đủ, đúng hạn; có quyền yêu cầu Bên A giao hàng đúng thỏa thuận và khắc phục hàng hóa không phù hợp với Hợp đồng.
contract.pdf.clause.breach=PHẠT VI PHẠM VÀ BỒI THƯỜNG THIỆT HẠI
contract.pdf.clause.breach.penalty=Bên vi phạm nghĩa vụ theo Hợp đồng này phải chịu phạt %d%% giá trị phần nghĩa vụ hợp đồng bị vi phạm, phù hợp với Điều 301 Luật Thương mại.
contract.pdf.clause.breach.damages=Ngoài tiền phạt, bên vi phạm phải bồi thường cho bên bị vi phạm các thiệt hại thực tế, trực tiếp do hành vi vi phạm gây ra.
contract.pdf.clause.breach.interest=Trường hợp Bên B chậm thanh toán, Bên A có quyền yêu cầu trả tiền lãi trên số tiền chậm trả theo lãi suất nợ quá hạn trung bình trên thị trường tại thời điểm thanh toán, tương ứng với thời gian chậm trả, theo Điều 306 Luật Thương mại.
contract.pdf.clause.forceMajeure=BẤT KHẢ KHÁNG
contract.pdf.clause.forceMajeure.events=Sự kiện bất khả kháng là sự kiện xảy ra một cách khách quan, không thể lường trước được và không thể khắc phục được dù đã áp dụng mọi biện pháp cần thiết, như thiên tai, hỏa hoạn, dịch bệnh, chiến tranh hoặc quyết định của cơ quan nhà nước có thẩm quyền. Bên không thực hiện được nghĩa vụ do sự kiện bất khả kháng không phải chịu trách nhiệm trong thời gian sự kiện đó diễn ra.
contract.pdf.clause.forceMajeure.notice=Bên gặp sự kiện bất khả kháng phải thông báo bằng văn bản cho bên kia trong thời hạn 07 ngày kể từ ngày sự kiện xảy ra và áp dụng các biện pháp hợp lý để hạn chế thiệt hại.
contract.pdf.clause.disputes=GIẢI QUYẾT TRANH CHẤP
contract.pdf.clause.disputes.talks=Mọi tranh chấp phát sinh từ Hợp đồng này trước hết được hai Bên giải quyết bằng thương lượng, trên tinh thần hợp tác và tôn trọng lợi ích của nhau.
contract.pdf.clause.disputes.court=Trường hợp thương lượng không thành trong thời hạn 30 ngày kể từ ngày một Bên thông báo bằng văn bản về tranh chấp, tranh chấp được đưa ra Tòa án nhân dân có thẩm quyền để giải quyết theo quy định của pháp luật Việt Nam.
contract.pdf.clause.validity=HIỆU LỰC HỢP ĐỒNG
contract.pdf.clause.validity.from=Hợp đồng này có hiệu lực kể từ ngày hai Bên ký.
contract.pdf.clause.validity.changes=Mọi sửa đổi, bổ sung Hợp đồng phải được lập thành Phụ lục có chữ ký của đại diện hai Bên; Phụ lục là phần không thể tách rời của Hợp đồng.
contract.pdf.clause.validity.liquidation=Hợp đồng chấm dứt khi hai Bên đã hoàn thành các nghĩa vụ theo Hợp đồng. Khi thanh lý Hợp đồng, hai Bên đối chiếu số lượng hàng đã giao và số tiền đã thanh toán.
contract.pdf.clause.validity.copies=Hợp đồng được lập thành 02 bản có giá trị pháp lý như nhau, mỗi Bên giữ 01 bản.

# Báo giá dạng PDF (QuoteDocument, kltn-docs 14 §4.1).
quote.pdf.title=BẢNG BÁO GIÁ
quote.pdf.subject=(V/v cung cấp sản phẩm in theo thiết kế của khách hàng)
quote.pdf.revision=(lần sửa %d)
quote.pdf.status.DRAFT=BẢN NHÁP
quote.pdf.status.CANCELLED=ĐÃ HỦY
quote.pdf.status.EXPIRED=HẾT HIỆU LỰC
quote.pdf.to=Kính gửi
quote.pdf.opening=%s xin trân trọng gửi đến Quý Công ty bảng báo giá với chi tiết như sau:
quote.pdf.unpriced=Bản nháp: các dòng chưa có đơn giá sẽ được bổ sung trước khi phát hành. Báo giá chỉ có giá trị khi đã được gửi chính thức đến khách hàng.
quote.pdf.acceptedAt=Khách hàng đã chấp nhận báo giá lúc %s.
quote.pdf.tiers=Bậc giá: %s
quote.pdf.tier.CARTON=từ %s thùng: %s đ/cái
quote.pdf.tier.UNIT=từ %s cái: %s đ/cái
quote.pdf.subtotal=Cộng tiền hàng
quote.pdf.fees=Các khoản phí
quote.pdf.total=Tổng cộng thanh toán
quote.pdf.terms=ĐIỀU KHOẢN THƯƠNG MẠI
quote.pdf.term.price=Giá: đơn giá tính theo cái, chưa gồm thuế GTGT; thuế suất của từng dòng ghi trong bảng trên. Hàng đặt theo thùng nguyên, từ số lượng tối thiểu của bậc giá thấp nhất trở lên.
quote.pdf.term.validity=Hiệu lực báo giá: đến %s.
quote.pdf.term.payment=Thanh toán: chuyển khoản theo tiến độ ghi trong hợp đồng mua bán.
quote.pdf.term.paymentAccount=Thanh toán: chuyển khoản theo tiến độ ghi trong hợp đồng mua bán, vào tài khoản số %s tại %s, chủ tài khoản: %s.
quote.pdf.term.delivery=Giao hàng: lịch giao từng đợt và địa điểm giao ghi trong hợp đồng mua bán.
quote.pdf.term.deliveryOn=Giao hàng: dự kiến ngày %s theo yêu cầu của Quý Công ty; lịch giao từng đợt và địa điểm giao ghi trong hợp đồng mua bán.
quote.pdf.term.tolerance=Dung sai số lượng: ±%d%% so với số lượng đặt do đặc thù sản xuất in; thanh toán theo số lượng thực giao.
quote.pdf.term.colour=Màu sắc: theo mẫu in được Quý Công ty duyệt trước khi sản xuất hàng loạt; chênh lệch nhẹ về màu giữa các lô in được chấp nhận.
quote.pdf.term.warranty=Bảo hành: %d tháng kể từ ngày giao hàng đối với lỗi in, trong điều kiện bảo quản khô ráo, tránh ánh nắng trực tiếp.
quote.pdf.term.design=Thiết kế: Quý Công ty chịu trách nhiệm về nội dung, nhãn hiệu và quyền sở hữu trí tuệ đối với thiết kế giao cho chúng tôi in.
quote.pdf.term.notContract=Báo giá không phải hợp đồng; hợp đồng chỉ giao kết khi hai Bên ký Hợp đồng mua bán.
quote.pdf.term.other=Điều khoản khác:
quote.pdf.closing=Rất mong nhận được sự hợp tác của Quý Công ty. Trân trọng kính chào!
quote.pdf.sign.buyer=XÁC NHẬN CỦA KHÁCH HÀNG
quote.pdf.sign.seller=ĐẠI DIỆN BÊN BÁN

# Biên bản giao nhận theo shipment (DeliveryNoteDocument, kltn-docs 09 §4.2).
delivery-note.pdf.title=BIÊN BẢN GIAO NHẬN HÀNG HÓA
delivery-note.pdf.batch=(Giao hàng đợt %d)
delivery-note.pdf.basis.contract=Căn cứ Hợp đồng mua bán hàng hóa số %s;
delivery-note.pdf.basis.order=Căn cứ Đơn đặt hàng số %s.
delivery-note.pdf.redelivery=Giao lại hàng đã hoàn về kho.
delivery-note.pdf.todayBlank=Hôm nay, ngày ...... tháng ...... năm ............, tại địa điểm giao hàng, chúng tôi gồm:
delivery-note.pdf.sender=BÊN GIAO (BÊN A)
delivery-note.pdf.receiver=BÊN NHẬN (BÊN B)
delivery-note.pdf.warehouse=Kho xuất hàng
delivery-note.pdf.deliveryAddress=Địa chỉ giao hàng
delivery-note.pdf.recipient=Người nhận hàng
delivery-note.pdf.agreed=Hai bên cùng nhau thống nhất số lượng hàng giao nhận như sau:
delivery-note.pdf.lpns=Mã thùng (LPN): %s
delivery-note.pdf.lpnRun=%s đến %s
delivery-note.pdf.total=Tổng cộng
delivery-note.pdf.col.cartons=Số thùng
delivery-note.pdf.col.note=Ghi chú
delivery-note.pdf.carriage=Thông tin vận chuyển:
delivery-note.pdf.vehicle=Chuyến %s - %s: biển số %s; tài xế %s; điện thoại %s; mã vận đơn %s
delivery-note.pdf.noVehicle=Xe: biển số %s; tài xế %s; điện thoại %s; mã vận đơn %s
delivery-note.pdf.handedOverAt=Thời điểm bàn giao: %s
delivery-note.pdf.condition=Tình trạng hàng hóa khi nhận:
delivery-note.pdf.condition.good=Đủ số lượng, đúng quy cách, bao bì nguyên vẹn.
delivery-note.pdf.condition.differs=Có sai khác: %s
delivery-note.pdf.confirm=Bên B xác nhận Bên A đã giao cho Bên B đúng chủng loại và đủ số lượng hàng như trên, trừ các sai khác (nếu có) đã ghi tại Biên bản này.
delivery-note.pdf.copies=Hai bên đồng ý, thống nhất ký tên. Biên bản được lập thành 02 bản, mỗi bên giữ 01 bản có giá trị pháp lý như nhau.
delivery-note.pdf.sign.sender=ĐẠI DIỆN BÊN GIAO
delivery-note.pdf.sign.driver=NGƯỜI VẬN CHUYỂN
delivery-note.pdf.sign.receiver=ĐẠI DIỆN BÊN NHẬN
delivery-note.pdf.pod=Ký xong, chụp hoặc scan biên bản và tải lên mục biên bản giao nhận (POD) của lô giao.
