# Used by integration tests. Testcontainers supplies the datasource URL at runtime, so nothing
# here points at a real database - a test run can never touch a developer's local data.
spring:
  datasource:
    hikari:
      # Every cached test context keeps a pool open on the one shared test Postgres. Five idle
      # connections each, times the cached contexts, was most of the server's memory and connection
      # slots for nothing; no test runs more than four threads against the database at once.
      minimum-idle: 1
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    # The demo seed is included: the integration tests place real orders and need stock to reserve.
    # Testcontainers gives each run a fresh database, so seeding it is safe here in a way it would
    # never be against a shared environment.
    locations: classpath:db/migration,classpath:db/demo
    clean-disabled: false
  modulith:
    events:
      republish-outstanding-events-on-restart: false   # deterministic tests
  # Virtual threads must be OFF here. With them on, Boot replaces the application task executor
  # with an unbounded SimpleAsyncTaskExecutor and every spring.task.execution.pool.* setting below
  # is ignored - which would quietly undo the single-threaded async execution the tests rely on.
  threads:
    virtual:
      enabled: false
  task:
    execution:
      pool:
        core-size: 1     # Async listeners run on one thread so assertions are not racing them.
        max-size: 1

stockflow:
  payment:
    # Obviously not a real account (SCRUM-193): demo values so the transfer instructions render here.
    company-bank:
      bank-name: ${COMPANY_BANK_NAME:DEMO BANK (not a real bank)}
      account-number: ${COMPANY_BANK_ACCOUNT_NUMBER:0000000000}
      account-name: ${COMPANY_BANK_ACCOUNT_NAME:DEMO STOCKFLOW CO LTD}
  # Obviously not a real company (4B-4, WF-05 E1): demo values so a contract and an invoice can be drawn up here.
  seller:
    name: ${SELLER_NAME:DEMO STOCKFLOW CO LTD}
    tax-code: ${SELLER_TAX_CODE:0000000000}
    address: ${SELLER_ADDRESS:1 Demo Street, Ho Chi Minh City}
    representative: ${SELLER_REPRESENTATIVE:Demo Director}
    representative-title: ${SELLER_REPRESENTATIVE_TITLE:Director}
  invoicing:
    # The tests drive reconciliation, automatic issuing and the deadline sweep by hand: a job firing in the middle of
    # a test would answer for the provider before the test asked. The sandbox answers at once.
    reconcile-interval: PT24H
    deadline-sweep-interval: PT24H
    sandbox:
      processing-delay: PT0S
  reporting:
    # The tests rebuild by hand against the orders they place; a backfill racing the first test would only add noise.
    backfill-on-startup: false
  notification:
    email:
      # Nothing leaves a test: every message is kept in memory (RecordingEmailTransport) for the test to read. A test
      # of a real transport selects it itself (smtp with a mocked sender, resend against a local stub server).
      provider: recording
      customer:
        # On here although it ships off: the tests exercise the customer mail so it still works the day it is
        # switched on. A test of the switched-off path sets it false itself.
        enabled: true
        # Driven by the tests that need it, never by the clock behind their back.
        retry-interval: PT24H
  storage:
    # No MinIO container in tests; the filesystem implementation exercises the same port.
    provider: local
    local-directory: ${java.io.tmpdir}/stockflow-test-storage
  idempotency:
    # Off by default in tests so a repeated fixture request is not answered from a stored response.
    # The idempotency tests switch it back on with @TestPropertySource.
    enabled: false
  security:
    # Off: the integration tests exercise the service layer directly, not HTTP, so the filter chain
    # would add a JWT setup step without testing anything these tests are about.
    enabled: false
    links:
      # A fixed key and address for tests only, so a link made in one call verifies in the next.
      key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      base-url: http://localhost:8080
    secrets:
      # A fixed key for tests only (32 zero-to-31 bytes), so sealed carrier secrets open across a test's requests.
      key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=

logging:
  level:
    com.stockflow: DEBUG
    org.springframework.transaction: DEBUG
