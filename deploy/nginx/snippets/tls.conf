# Let's Encrypt wildcard for "<domain>, *.<domain>", issued and renewed on the VPS by certbot's
# DNS-01 challenge (README section 2a) into certs/letsencrypt/, which CI's rsync leaves alone.
#
# Not the Cloudflare Origin Certificate any more: api, s3 and media are DNS-only, so browsers see
# this certificate directly and it has to be publicly trusted. The hosts still proxied accept it
# too - "Full (strict)" asks only for a valid certificate, and a public one is valid.
ssl_certificate     /etc/nginx/certs/letsencrypt/live/wildcard/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/letsencrypt/live/wildcard/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
