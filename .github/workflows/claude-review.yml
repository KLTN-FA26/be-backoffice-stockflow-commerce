# =============================================================================
# Claude review. Runs Anthropic's code-review plugin (the same /code-review used locally) when a
# pull request opens or leaves draft, and posts the result as a comment on the pull request.
#
# The plugin reads every CLAUDE.md on the changed paths, runs several review agents in parallel
# (CLAUDE.md compliance, bugs in the diff, git history) and posts only findings that survive its
# confidence filter. It skips closed, draft and trivial pull requests, and one Claude has already
# reviewed - which is why there is no synchronize trigger: a second run on the same pull request
# would stop at that check anyway, after spending quota to find out.
#
# Each run spends the subscription quota of whoever owns CLAUDE_CODE_OAUTH_TOKEN, and the plugin
# uses several agents, so it is not cheap. Ask about a later commit with "@claude" (claude.yml).
#
# Advisory only. It is not a required check, and the fitness functions in build.yml stay the gate.
# =============================================================================

name: claude-review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # The action exchanges an OIDC token for the Claude GitHub App's installation token, which
      # is what actually writes the comments.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The plugin's history agent runs git blame over the changed lines.
          fetch-depth: 0

      # Pinned to a commit: a tag can be moved to different code, and this step holds the token.
      # Bump both workflows together, on develop and main, or every run fails validation.
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          # The command declares these in its own frontmatter; listing them here as well keeps a
          # headless run from stopping at a permission prompt nobody can answer.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
