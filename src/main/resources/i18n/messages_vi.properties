error.IDEMPOTENCY_KEY_REUSED=Mã yêu cầu này đã được dùng cho một yêu cầu khác

error.RATE_LIMITED=Bạn thao tác quá nhanh. Vui lòng chờ một chút.

error.INTERNAL_ERROR=Đã có lỗi xảy ra phía hệ thống
