inbox.einvoice.delivery-failed-awaiting.body=Lần giao mà hoá đơn %s của đơn %s ghi nhận đã được sửa thành giao thất bại khi hoá đơn còn ở nhà cung cấp (gửi lúc %s). Không cần làm gì lúc này: khi nhà cung cấp trả kết quả, hệ thống tự lập điều chỉnh giảm toàn bộ nếu hoá đơn đã phát hành, hoặc huỷ nháp nếu bị từ chối. Không phát hành lại hoá đơn này bằng tay.
inbox.einvoice.signature-invalid.title=Hoá đơn %s đã phát hành nhưng chữ ký số không hợp lệ
inbox.einvoice.signature-invalid.body=Hoá đơn %s của đơn %s đã được nhà cung cấp phát hành (gửi lúc %s), nhưng chữ ký số của bên bán trên file XML không hợp lệ: nội dung đã bị thay đổi, chữ ký không khớp chứng thư, hoặc không có chữ ký. Hoá đơn chưa được gửi cho khách. Kiểm tra trên cổng của nhà cung cấp và lập hoá đơn thay thế.
inbox.einvoice.duplicate-risk.title=Hoá đơn %s có thể đã phát hành hai lần
inbox.einvoice.duplicate-risk.body=Hoá đơn %s của đơn %s đã được rút khỏi nhà cung cấp (gửi lúc %s), nhưng nay nhà cung cấp báo đã phát hành; hệ thống đã ghi nhận hoá đơn đó. Kiểm tra lần giao này có bị xuất hai hoá đơn không; nếu có, điều chỉnh giảm một trong hai về 0 (hạn của hoá đơn gốc: %s).
inbox.einvoice.provider-result-overdue.title=Hoá đơn %s chờ kết quả của nhà cung cấp quá lâu
inbox.einvoice.provider-result-overdue.body=Hoá đơn %s của đơn %s đã gửi nhà cung cấp lúc %s mà vẫn chưa có kết quả cuối cùng. Tra trên cổng của nhà cung cấp rồi ghi lại kết quả vào hệ thống: đã phát hành (kèm số và tệp) hoặc bị cơ quan thuế từ chối. Hạn phát hành: %s.
inbox.einvoice.reduce-on-portal.title=Giảm hoá đơn %s trên cổng nhà cung cấp
inbox.einvoice.reduce-on-portal.body=Bản giảm hoá đơn %s của đơn %s do giao không thành công không gửi được qua nhà cung cấp và đã được huỷ (gửi lúc %s). Lập điều chỉnh giảm trên cổng của nhà cung cấp đó, rồi ghi lại vào hệ thống số, ký hiệu, ngày và tệp hoá đơn, trước %s.
inbox.einvoice.delivery-failed-not-reversed.title=Hoá đơn %s của lần giao thất bại chưa được giảm
inbox.einvoice.delivery-failed-not-reversed.body=Lần giao của hoá đơn %s thuộc đơn %s hiện không còn là đã giao, nhưng hoá đơn chưa được giảm (gửi lúc %s). Dùng thao tác "Giảm do giao thất bại" trên hoá đơn để giảm phần còn lại về 0. Hạn: %s.
inbox.einvoice.series-mismatch.title=Hoá đơn %s được nhà cung cấp phát hành theo ký hiệu khác
inbox.einvoice.series-mismatch.body=Nhà cung cấp báo hoá đơn %s của đơn %s (gửi lúc %s) mang mẫu số hoặc ký hiệu khác với ký hiệu đã gửi, nên hệ thống chưa ghi nhận là đã phát hành. Đối chiếu trên cổng của nhà cung cấp và kiểm tra cấu hình dãy hoá đơn. Hạn: %s.
inbox.einvoice.issued-late.title=Hoá đơn %s lập trễ
inbox.einvoice.issued-late.body=Hoá đơn %s của đơn %s phát hành ngày %s cho hàng giao ngày %s, muộn hơn ngày giao. Hoá đơn được gắn nhãn "Lập trễ".
inbox.einvoice.replacement-not-reducible.title=Hoá đơn thay thế %s không giảm được qua nhà cung cấp
inbox.einvoice.replacement-not-reducible.body=Lần giao của hoá đơn thay thế %s thuộc đơn %s không thành công, mà nhà cung cấp không cho điều chỉnh hoá đơn thay thế (gửi lúc %s). Hệ thống không lập bản giảm: lập điều chỉnh giảm trên cổng của nhà cung cấp rồi ghi lại vào hệ thống, trước %s.
inbox.einvoice.auto-issue-held.title=Hoá đơn %s không tự phát hành được
inbox.einvoice.auto-issue-held.body=Hoá đơn nháp %s của đơn %s không tự phát hành được (lý do: %s). Kiểm tra và phát hành trong ngày, trước %s; phát hành sau hạn thì hoá đơn mang ngày phát hành và bị gắn nhãn "Lập trễ".
# Audit r3 EINV-6: mỗi mã lý do của nháp bị giữ, viết thành lời (EInvoiceAttentionNotificationListener).
inbox.einvoice.reason.BUYER_PROFILE_INCOMPLETE=hồ sơ bên mua thiếu tên, mã số thuế hoặc địa chỉ
inbox.einvoice.reason.BUYER_EMAIL_MISSING=bên mua chưa có e-mail nhận hoá đơn
inbox.einvoice.reason.TAX_RATE_DIFFERS_FROM_CONTRACT=thuế suất khác thuế suất đã chốt trên hợp đồng
inbox.einvoice.reason.TAX_RATE_NOT_ON_CONTRACT=có dòng chưa chốt thuế suất trên hợp đồng
inbox.einvoice.reason.TAX_CLASS_UNKNOWN=có sản phẩm chưa xác định nhóm thuế (tính mức cao nhất 10%)
inbox.einvoice.reason.TAX_RATE_OUT_OF_DATE=thuế suất trên nháp không còn đúng với ngày lập
inbox.einvoice.reason.TAX_EXEMPT_NOT_SUPPORTED=có dòng hàng không chịu thuế (0%), chưa phát hành được
inbox.einvoice.reason.UNKNOWN_TO_PROVIDER=nhà cung cấp không có bản ghi giao dịch
inbox.einvoice.reason.SIGNATURE_INVALID=chữ ký số của bên bán không hợp lệ
inbox.einvoice.reason.ISSUED_LATE=phát hành sau ngày giao (lập trễ)
inbox.einvoice.return-on-replacement.title=Phiếu trả hàng %s nằm trên hoá đơn thay thế
inbox.einvoice.return-on-replacement.body=Khoản hoàn tiền của phiếu trả hàng %s thuộc đơn %s đã được duyệt, nhưng %d sản phẩm hoàn tiền trên %d dòng đơn nằm trên hoá đơn thay thế, loại hoá đơn nhà cung cấp không cho điều chỉnh. Không dùng "Thay thế" cho trả hàng: lập điều chỉnh giảm trên cổng của nhà cung cấp rồi ghi lại vào hệ thống, ghi rõ phiếu trả hàng.
inbox.einvoice.buyer-email-missing.title=Hoá đơn của đơn %s đã phát hành nhưng chưa gửi được thư
inbox.einvoice.buyer-email-missing.body=Hoá đơn %s của đơn %s đã phát hành, nhưng khách hàng chưa có email nhận hoá đơn. Bổ sung email vào hồ sơ khách hàng rồi gửi lại hoá đơn.
inbox.return.awaiting-proposal.title=Hàng của phiếu trả %s đã về: đề xuất hoàn tiền
inbox.return.awaiting-proposal.body=Hàng của phiếu trả hàng %s thuộc đơn %s đã về kho đủ. Đề xuất số tiền hoàn - hoặc 0 đồng kèm lý do - để Kế toán duyệt.
inbox.return.receipt-discrepancy.title=Hàng của phiếu trả %s về khác số đã duyệt
inbox.return.receipt-discrepancy.body=Hàng của phiếu trả hàng %s thuộc đơn %s trên phiếu nhập %s khác với số đã duyệt: thừa, thiếu, hoặc có hàng không thuộc yêu cầu. Liên hệ khách hàng và ghi lại thoả thuận.
inbox.return.rto-missing-cartons.title=Thùng hàng của đơn %s chưa về đủ
inbox.return.rto-missing-cartons.body=Phiếu nhập hàng hoàn %s của chuyến thuộc đơn %s do hãng chở về đã xác nhận nhưng còn thiếu %d thùng. Liên hệ hãng vận chuyển.
inbox.quarantine.digest.title=%d thùng hàng hoàn đang chờ ở khu cách ly
inbox.quarantine.digest.body=%d thùng hàng trả về kho %s đang nằm ở khu cách ly chờ quyết định: gỡ cách ly, ghi giảm, hoặc trả lại khách.
inbox.einvoice.account.quota-low.title=Gói hoá đơn điện tử ở %s sắp hết lượt
inbox.einvoice.account.quota-low.body=Gói hoá đơn điện tử ở %s còn %d lượt phát hành, dưới ngưỡng cảnh báo %d. Mua thêm lượt trên cổng của nhà cung cấp trước khi hoá đơn bị từ chối.
inbox.einvoice.account.quota-exhausted.title=Gói hoá đơn điện tử ở %s đã hết lượt
inbox.einvoice.account.quota-exhausted.body=%s đã hết lượt hoá đơn trong gói (mã %s). Hệ thống tạm dừng phát hành: các nháp giữ nguyên, và tự phát hành tiếp sau khi mua thêm lượt trên cổng của nhà cung cấp. Hoá đơn nào đã bị từ chối vì hết lượt thì mở lại và phát hành lại.
inbox.einvoice.account.billing-unpaid.title=Gói hoá đơn điện tử ở %s chưa được thanh toán
inbox.einvoice.account.billing-unpaid.body=%s từ chối phát hành hoá đơn vì gói chưa được thanh toán (mã %s). Thanh toán trên cổng của nhà cung cấp, rồi mở lại các hoá đơn bị từ chối và phát hành lại.
inbox.einvoice.account.account-not-ready.title=Tài khoản hoá đơn điện tử ở %s chưa sẵn sàng
inbox.einvoice.account.account-not-ready.body=%s từ chối phát hành hoá đơn vì đăng ký tài khoản chưa hoàn tất, chưa được cơ quan thuế duyệt, hoặc không đúng tài khoản đã cấu hình (mã %s). Hoàn tất trên cổng của nhà cung cấp, rồi mở lại các hoá đơn bị từ chối và phát hành lại.
inbox.einvoice.buyer-incomplete.title=Khách hàng của đơn %s cần bổ sung thông tin xuất hoá đơn
inbox.einvoice.buyer-incomplete.body=Hoá đơn %s của đơn %s chưa phát hành được: hồ sơ khách hàng còn thiếu %s. Bổ sung vào hồ sơ khách hàng, rồi Kế toán làm mới thông tin bên mua trên hoá đơn.
inbox.einvoice.buyer-incomplete.missing.NAME=tên công ty
inbox.einvoice.buyer-incomplete.missing.TAX_CODE=mã số thuế
inbox.einvoice.buyer-incomplete.missing.ADDRESS=địa chỉ xuất hoá đơn
inbox.einvoice.buyer-incomplete.missing.EMAIL=email nhận hoá đơn
inbox.einvoice.delivery-reversal.title=Nháp điều chỉnh %s giảm hoá đơn của một lần giao không thành công
inbox.einvoice.delivery-reversal.body=Một lần giao của đơn %2$s đã được sửa thành giao thất bại sau khi hoá đơn của lần giao đó đã phát hành. Hệ thống đã lập sẵn nháp điều chỉnh %1$s giảm toàn bộ hoá đơn đó, không cần biên bản thoả thuận với bên mua. Kiểm tra và phát hành nháp này trước %4$s. Khi hàng được giao lại, hệ thống lập hoá đơn mới cho lần giao đó.
inbox.einvoice.issued.title=Hoá đơn điện tử của đơn %s đã được phát hành
inbox.einvoice.error-notice.title=Hoá đơn điện tử của đơn %s có sai sót
inbox.einvoice.error-notice.body=Một hoá đơn điện tử của đơn %s ghi sai tên hoặc địa chỉ của Quý công ty. Hoá đơn vẫn có giá trị; thông tin đúng đã được thông báo với cơ quan thuế. Quý khách có thể xem thông báo cùng hoá đơn tại mục Hoá đơn.
inbox.einvoice.issued.body=Hoá đơn điện tử cho lô hàng đã giao của đơn %s đã được phát hành. Quý khách có thể xem và tải bản PDF, XML tại mục Hoá đơn.
inbox.einvoice.due.title=Hoá đơn %s phải phát hành trước %s
inbox.einvoice.due.body=Hoá đơn nháp %s của đơn %s lập ngày %s, phải ký số và gửi cấp mã cơ quan thuế trước %s. Kiểm tra thông tin bên mua rồi phát hành.
inbox.einvoice.overdue.title=Hoá đơn %s đã quá hạn phát hành (hạn %s)
inbox.einvoice.overdue.body=Hoá đơn %s của đơn %s lập ngày %s vẫn chưa được phát hành dù đã quá hạn (%s). Hãy phát hành ngay, hoặc tra lại kết quả nếu hoá đơn đang chờ nhà cung cấp; hệ thống nhắc lại mỗi ngày cho tới khi hoá đơn được phát hành.
inbox.einvoice.draft-failed.title=Chưa lập được hoá đơn cho một lần giao của đơn %s
inbox.einvoice.draft-failed.body=Một lần giao của đơn %s đã giao thành công nhưng chưa lập được hoá đơn nháp (%s). Mỗi lần giao đều phải có hoá đơn: xử lý nguyên nhân rồi lập hoá đơn từ lần giao đó.
inbox.einvoice.draft-failed.fee-rest.title=Chưa lập được hoá đơn cho phần phí vận chuyển còn lại của đơn %s
inbox.einvoice.draft-failed.fee-rest.body=Phần chưa giao của đơn %s đã được đóng, nhưng chưa lập được hoá đơn cho phần phí vận chuyển mà hoá đơn các lần giao chưa ghi (%s). Xử lý nguyên nhân rồi lập hoá đơn từ đơn hàng.
inbox.sales.follow-up.contract-unsigned.title=Hợp đồng %s chưa được ký sau %d ngày
inbox.sales.follow-up.contract-unsigned.body=Hợp đồng %s của đơn %s đã gửi ngày %s nhưng khách chưa ký. Liên hệ khách, hoặc huỷ hợp đồng kèm lý do.
inbox.sales.follow-up.order-unpaid.title=Đơn %s chưa thanh toán sau %d ngày ký hợp đồng
inbox.sales.follow-up.order-unpaid.body=Đơn %s (hợp đồng %s) ký ngày %s nhưng đợt thanh toán khi ký chưa được trả. Nhắc khách; quá lâu thì huỷ đơn (PAYMENT_NOT_RECEIVED).
inbox.sales.follow-up.credit-hold.title=Đơn %s chờ duyệt công nợ
inbox.sales.follow-up.credit-hold.body=Đơn %s bị treo ngày %s vì hợp đồng vượt hạn mức công nợ của khách. Duyệt hoặc từ chối ở trang Đơn chờ duyệt tín dụng.
inbox.sales.follow-up.credit-approved.title=Đơn %s đã được duyệt công nợ
inbox.sales.follow-up.credit-approved.body=Kế toán đã duyệt công nợ cho đơn %s; đơn tiếp tục theo hợp đồng. Lý do ghi trên trang đơn.
inbox.sales.follow-up.credit-refused.title=Đơn %s bị từ chối công nợ
inbox.sales.follow-up.credit-refused.body=Kế toán đã từ chối công nợ cho đơn %s và đơn đã bị huỷ (CREDIT_REJECTED). Lý do ghi trên trang đơn; báo lại cho khách.
inbox.sales.follow-up.confirmed.title=Đơn %s đã xác nhận: cần chọn kho xuất
inbox.sales.follow-up.confirmed.body=Đơn %s đã xác nhận nhưng chưa chọn kho xuất. Chọn kho xuất hàng để giữ hàng cho đơn.
inbox.sales.follow-up.payment-hold.title=Đơn %s bị treo vì thiếu tiền đợt khi ký
inbox.sales.follow-up.payment-hold.body=Một phiếu thu của đơn %s đã bị huỷ và đơn bị treo ngày %s vì đợt thanh toán khi ký không còn đủ. Liên hệ khách; khi tiền đủ lại thì gỡ treo đơn.
inbox.sales.follow-up.payment-restored.title=Đơn %s đã đủ lại tiền đợt khi ký
inbox.sales.follow-up.payment-restored.body=Đơn %s đang treo từ ngày %s vì thiếu tiền nay đã đủ đợt thanh toán khi ký. Kiểm tra rồi gỡ treo đơn; hệ thống không tự gỡ.
inbox.sales.follow-up.takeover=Sale phụ trách không còn hoạt động: một người trong nhóm tiếp nhận việc này.

# ---- WF-02 refusals people read (BusinessException#messageKey) and the status labels they name. MessageFormat:
# {0}, {1}... are arguments; no apostrophes (one would vanish).
refusal.quote.termsTooLong=Điều khoản báo giá dài tối đa {0} ký tự.
refusal.quote.noLine=Báo giá cần ít nhất một dòng hàng.
refusal.quote.lineTwice=Dòng {0} bị lặp lại.
refusal.quote.legacyDesignTwice=Cùng một thiết kế trên phôi {0} được báo giá hai lần.
refusal.quote.skuTwice=SKU {0} xuất hiện hai lần trong báo giá: mỗi SKU chỉ một dòng.
refusal.quote.oneShippingFee=Báo giá chỉ có tối đa một dòng phí vận chuyển.
refusal.quote.plateFeeNotOnQuote=Phí khuôn / bản in chỉ dành cho SKU có trên báo giá, không phải {0}.
refusal.quote.onePlateFee=SKU {0} chỉ có tối đa một dòng phí khuôn / bản in.
refusal.quote.belowMoq=Dòng {0} ({1}): {2} thùng thấp hơn số lượng đặt tối thiểu (MOQ) là {3} thùng.
refusal.quote.lineNotPriced=Báo giá {0}, dòng {1} chưa có giá: nhập bậc giá trước khi gửi.
refusal.quote.feeNotPriced=Báo giá {0}: {1} của {2} chưa có số tiền: nhập số tiền trước khi gửi.
refusal.quote.lineTaxClassMissing=Báo giá {0}, dòng {1}: sản phẩm của {2} chưa có nhóm thuế; khai báo nhóm thuế trước khi gửi.
refusal.quote.feeTaxClassMissing=Báo giá {0}: sản phẩm của {1} chưa có nhóm thuế nên phí khuôn / bản in chưa có thuế suất; khai báo nhóm thuế trước khi gửi.
refusal.quote.sentExpired=Báo giá {0} có hiệu lực đến {1}, đã qua: đặt hạn hiệu lực mới trước khi gửi.
refusal.quote.lineNotOnQuote=Có dòng không thuộc báo giá {0}.
refusal.quote.atLeastOneCarton=Dòng {0} cần ít nhất 1 thùng.
refusal.quote.feedbackRequired=Hãy ghi rõ cần sửa gì (tối đa {0} ký tự).
refusal.quote.cancellationReasonRequired=Huỷ báo giá cần ghi lý do (tối đa {0} ký tự).
