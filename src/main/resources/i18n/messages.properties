inbox.einvoice.rejected.title=E-invoice %s was rejected
inbox.einvoice.rejected.body=E-invoice %s of order %s was rejected by the provider or the tax authority (error code %s). Reopen it, correct it and issue it again by %s.
inbox.einvoice.stuck.title=E-invoice %s has no result yet
inbox.einvoice.stuck.body=E-invoice %s of order %s was sent to the provider at %s and has no result yet. The system keeps asking; check the connection to the provider - the invoice is due by %s.
inbox.einvoice.return-unadjusted.title=Return %s needs an adjustment e-invoice drawn up by hand
inbox.einvoice.return-unadjusted.body=The refund of return %s of order %s was approved, but %d refunded piece(s) on %d order line(s) are on no issued e-invoice that could be adjusted: the delivery's invoice is not issued yet, it is being replaced, or a piece of the carton is not worth whole dong. Once the invoice is issued, draw the decrease adjustment up from it, naming the return.
inbox.einvoice.return-refused.title=No adjustment e-invoice was drawn up for return %s
inbox.einvoice.return-refused.body=The refund of return %s of order %s was approved, but its decrease adjustment could not be drawn up (%s). Remove the cause, then draw the adjustment up from the invoice, naming the return.
inbox.einvoice.unknown.title=E-invoice %s must be sent again
inbox.einvoice.unknown.body=E-invoice %s of order %s was sent to the provider at %s, and the provider no longer knows that submission. It is not sent again automatically: open it and send it as a new submission, by %s.
inbox.einvoice.delivery-failed.title=E-invoice %s invoices a delivery that failed
inbox.einvoice.delivery-failed.body=The delivery invoiced by e-invoice %s of order %s was corrected to a failure after the invoice was issued (sent to the provider at %s). The system could not reduce it in full itself because it is already being adjusted or replaced: bring it to nothing by hand with a decrease adjustment for what is left of it.
inbox.einvoice.delivery-failed-awaiting.title=E-invoice %s is at the provider for a delivery that failed
inbox.einvoice.delivery-failed-awaiting.body=The delivery invoiced by e-invoice %s of order %s was corrected to a failure while the invoice was at the provider (sent at %s). Nothing to do now: once the provider answers, the system reduces it in full if it was issued, or voids it if it was refused. Do not issue it again by hand.
inbox.einvoice.signature-invalid.title=E-invoice %s is issued with a seller's signature that does not hold
inbox.einvoice.signature-invalid.body=E-invoice %s of order %s was issued by the provider (sent at %s), but the seller's digital signature on its XML does not check: the content changed, the signature is not its certificate's, or there is none. It has not been sent to the customer. Check it on the provider's portal and issue a replacement.
inbox.einvoice.duplicate-risk.title=E-invoice %s may have been issued twice
inbox.einvoice.duplicate-risk.body=E-invoice %s of order %s was withdrawn from the provider (sent at %s), but the provider now shows it issued; the invoice it holds is recorded on it. Check whether the delivery is invoiced twice and, if so, reduce one of the two to nothing (the original was due by %s).
inbox.einvoice.provider-result-overdue.title=E-invoice %s has waited too long for the provider's result
inbox.einvoice.provider-result-overdue.body=E-invoice %s of order %s was sent to the provider at %s and still has no final result. Look it up on the provider's portal and record what you find: issued (with its number and files) or refused by the tax authority. It is due by %s.
inbox.einvoice.reduce-on-portal.title=Reduce e-invoice %s on the provider's portal
inbox.einvoice.reduce-on-portal.body=The reduction of e-invoice %s of order %s for a failed delivery could not be sent through its provider and was voided (sent at %s). Reduce the invoice on that provider's portal, then record the reduction here - its number, symbol, date and files - by %s.
inbox.einvoice.delivery-failed-not-reversed.title=E-invoice %s invoices a failed delivery and is not reduced
inbox.einvoice.delivery-failed-not-reversed.body=The delivery invoiced by e-invoice %s of order %s is not delivered now, and the invoice was not reduced for it (sent at %s). Use "reduce for the failed delivery" on the invoice: what is left of it is reduced to nothing. Due by %s.
inbox.einvoice.series-mismatch.title=E-invoice %s was issued under another series at the provider
inbox.einvoice.series-mismatch.body=The provider reports e-invoice %s of order %s (sent at %s) under a template code or symbol other than the one it was sent with, so it is not recorded as issued. Compare it on the provider's portal and check the series configuration. Due by %s.
inbox.einvoice.issued-late.title=E-invoice %s was issued late
inbox.einvoice.issued-late.body=E-invoice %s of order %s was issued on %s for goods delivered on %s, later than the delivery day. It carries the label "issued late".
inbox.einvoice.replacement-not-reducible.title=E-invoice %s is a replacement the provider cannot reduce
inbox.einvoice.replacement-not-reducible.body=The delivery invoiced by replacement e-invoice %s of order %s failed, and the provider does not adjust a replacement (sent at %s). No reduction was drawn up: reduce it on the provider's portal, then record the reduction here, by %s.
inbox.einvoice.auto-issue-held.title=E-invoice %s could not be issued automatically
inbox.einvoice.auto-issue-held.body=Draft e-invoice %s of order %s could not be issued automatically (reason: %s). Check it and issue it today, by %s; issued later, it carries the day it is issued and the label "issued late".
# Audit r3 EINV-6: each reason code of a held draft, named in words (EInvoiceAttentionNotificationListener).
inbox.einvoice.reason.BUYER_PROFILE_INCOMPLETE=the buyer's name, tax code or address is missing
inbox.einvoice.reason.BUYER_EMAIL_MISSING=the buyer has no e-mail to receive the invoice
inbox.einvoice.reason.TAX_RATE_DIFFERS_FROM_CONTRACT=a VAT rate differs from the one on the contract
inbox.einvoice.reason.TAX_RATE_NOT_ON_CONTRACT=a line has no VAT rate fixed on the contract
inbox.einvoice.reason.TAX_CLASS_UNKNOWN=a product has no tax class (taxed at the highest rate, 10%)
inbox.einvoice.reason.TAX_RATE_OUT_OF_DATE=a VAT rate is no longer the one in force for its day
inbox.einvoice.reason.TAX_EXEMPT_NOT_SUPPORTED=a line is not subject to VAT (0%), which cannot be issued yet
inbox.einvoice.reason.UNKNOWN_TO_PROVIDER=the provider has no record of the transaction
inbox.einvoice.reason.SIGNATURE_INVALID=the seller's digital signature does not hold
inbox.einvoice.reason.ISSUED_LATE=issued after its delivery day
inbox.einvoice.return-on-replacement.title=Return %s is on a replacement e-invoice
inbox.einvoice.return-on-replacement.body=The refund of return %s of order %s was approved, but %d refunded piece(s) on %d order line(s) are on a replacement invoice, which the provider does not adjust. Do not use Replace for a return: reduce the invoice on the provider's portal, then record the reduction here, naming the return.
inbox.einvoice.buyer-email-missing.title=The e-invoice of order %s was issued but not mailed
inbox.einvoice.buyer-email-missing.body=E-invoice %s of order %s is issued, but the customer has no e-mail to receive it. Record the e-mail on the customer, then send the invoice again.
inbox.return.awaiting-proposal.title=Return %s is back: propose its refund
inbox.return.awaiting-proposal.body=The goods of return %s of order %s are all back in the warehouse. Propose the refund - or nothing, with a reason - for the accountant to approve.
inbox.return.receipt-discrepancy.title=Return %s came back different from what was approved
inbox.return.receipt-discrepancy.body=The goods of return %s of order %s on receipt %s differ from what was approved: more or fewer units, or goods the return did not claim. Contact the customer and record what is agreed.
inbox.return.rto-missing-cartons.title=Cartons of order %s did not come back
inbox.return.rto-missing-cartons.body=Return receipt %s of the shipment of order %s the carrier brought back was confirmed with %d carton(s) missing. Ask the carrier for them.
inbox.quarantine.digest.title=%d returned carton(s) wait in quarantine
inbox.quarantine.digest.body=%d carton(s) returned to warehouse %s are in quarantine waiting for a decision: release, write off, or give back to the customer.
inbox.einvoice.account.quota-low.title=The e-invoice plan at %s is running out
inbox.einvoice.account.quota-low.body=The e-invoice plan at %s has %d invoice(s) left, under the warning level of %d. Buy more on the provider's portal before invoices are refused.
inbox.einvoice.account.quota-exhausted.title=The e-invoice plan at %s is used up
inbox.einvoice.account.quota-exhausted.body=%s has no e-invoices left on the plan (code %s). Issuing is paused: drafts stay drafts, and the automatic issue resumes once more invoices are bought on the provider's portal. Reopen any invoice the provider refused for it and issue it again.
inbox.einvoice.account.billing-unpaid.title=The e-invoice plan at %s is not paid
inbox.einvoice.account.billing-unpaid.body=%s refuses e-invoices because the plan is not paid (code %s). Pay it on the provider's portal, then reopen the refused invoices and issue them again.
inbox.einvoice.account.account-not-ready.title=The e-invoice account at %s is not ready
inbox.einvoice.account.account-not-ready.body=%s refuses e-invoices because the account's registration is not complete, not approved by the tax authority, or not the one configured (code %s). Finish it on the provider's portal, then reopen the refused invoices and issue them again.
inbox.einvoice.buyer-incomplete.title=The customer of order %s needs details for its e-invoice
inbox.einvoice.buyer-incomplete.body=E-invoice %s of order %s cannot be issued: the customer's profile lacks %s. Record it on the customer, then the accountant refreshes the buyer on the invoice.
inbox.einvoice.buyer-incomplete.missing.NAME=the company name
inbox.einvoice.buyer-incomplete.missing.TAX_CODE=the tax code
inbox.einvoice.buyer-incomplete.missing.ADDRESS=the invoicing address
inbox.einvoice.buyer-incomplete.missing.EMAIL=the e-mail that receives invoices
inbox.einvoice.delivery-reversal.title=Draft adjustment %s reduces an invoice whose delivery failed
inbox.einvoice.delivery-reversal.body=A delivery of order %2$s was corrected to a failure after its e-invoice was issued. The system drew up the draft adjustment %1$s, which reduces that invoice in full; no agreement with the buyer is needed. Check it and issue it by %4$s. When the goods are delivered again, a new invoice is drawn up for them.
inbox.einvoice.issued.title=The e-invoice of order %s has been issued
inbox.einvoice.error-notice.title=An error was found on an e-invoice of order %s
inbox.einvoice.error-notice.body=An e-invoice of order %s carries your company's name or address wrongly. It stays valid; the tax authority has been notified of the right details. You can read the notice with the invoice under Invoices.
inbox.einvoice.issued.body=The e-invoice for the delivered goods of order %s has been issued. You can read it and download its PDF and XML under Invoices.
inbox.einvoice.due.title=E-invoice %s must be issued by %s
inbox.einvoice.due.body=The draft e-invoice %s of order %s is dated %s and must be signed and sent for the tax authority's code by %s. Check the buyer's details and issue it.
inbox.einvoice.overdue.title=E-invoice %s is overdue: it had to be issued by %s
inbox.einvoice.overdue.body=E-invoice %s of order %s, dated %s, is still not issued and its deadline (%s) has passed. Issue it now, or, if it is waiting for the provider, check it again; you are reminded every day until it is issued.
inbox.einvoice.draft-failed.title=No e-invoice was drawn up for a delivery of order %s
inbox.einvoice.draft-failed.body=A shipment of order %s was delivered, but its draft e-invoice could not be drawn up (%s). Every delivery is invoiced: remove the cause, then draw the invoice up from the shipment.
inbox.einvoice.draft-failed.fee-rest.title=No e-invoice was drawn up for the rest of the delivery fee of order %s
inbox.einvoice.draft-failed.fee-rest.body=The undelivered rest of order %s was closed, and the part of its delivery fee no delivery's invoice carries could not be drawn up (%s). Remove the cause, then draw the invoice up from the order.
inbox.sales.follow-up.contract-unsigned.title=Contract %s is not signed after %d days
inbox.sales.follow-up.contract-unsigned.body=Contract %s of order %s was sent on %s and the customer has not signed it. Ask the customer, or cancel the contract with a reason.
inbox.sales.follow-up.order-unpaid.title=Order %s is not paid %d days after signing
inbox.sales.follow-up.order-unpaid.body=Order %s (contract %s) was signed on %s and the installment due on signing is not paid. Remind the customer; past too long, cancel the order (PAYMENT_NOT_RECEIVED).
inbox.sales.follow-up.credit-hold.title=Order %s waits for a credit decision
inbox.sales.follow-up.credit-hold.body=Order %s was put on hold on %s: its contract is over the credit limit of the customer. Approve or refuse it on the credit holds page.
inbox.sales.follow-up.credit-approved.title=Credit approved for order %s
inbox.sales.follow-up.credit-approved.body=Accounting approved the credit of order %s; it goes on under its contract. The reason is on the order.
inbox.sales.follow-up.credit-refused.title=Credit refused for order %s
inbox.sales.follow-up.credit-refused.body=Accounting refused the credit of order %s and the order is cancelled (CREDIT_REJECTED). The reason is on the order; tell the customer.
inbox.sales.follow-up.contract-credit-review.title=Contract %s waits for a credit decision before it is sent
inbox.sales.follow-up.contract-credit-review.body=Contract %1$s of order %2$s was not sent to the customer: %3$s. Approve it (it is sent at once) or refuse it back to Sales on the credit holds page.
inbox.sales.follow-up.contract-credit-review.reason.OVERDUE=the customer has an installment overdue
inbox.sales.follow-up.contract-credit-review.reason.OVER_LIMIT=what the customer owes after delivery with this contract passes the credit limit
inbox.sales.follow-up.contract-credit-review-waiting.title=Contract %s still waits for a credit decision
inbox.sales.follow-up.contract-credit-review-waiting.body=Contract %1$s of order %2$s has waited for a credit decision since %3$s and is not sent to the customer until it is decided.
inbox.sales.follow-up.contract-credit-approved.title=Credit approved: contract %s sent
inbox.sales.follow-up.contract-credit-approved.body=Accounting approved the credit of contract %1$s (order %2$s); it was sent to the customer in your name. The note is on the contract.
inbox.sales.follow-up.contract-credit-refused.title=Credit refused: contract %s not sent
inbox.sales.follow-up.contract-credit-refused.body=Accounting refused the credit of contract %1$s (order %2$s); it is still a draft. Read the reason on the contract, change the payment plan and send it again.
inbox.sales.follow-up.confirmed.title=Order %s is confirmed: choose its shipping warehouse
inbox.sales.follow-up.confirmed.body=Order %s is confirmed and has no shipping warehouse yet. Choose the warehouse it ships from so its stock can be held.
inbox.sales.follow-up.payment-hold.title=Order %s is on hold: its installment on signing is short
inbox.sales.follow-up.payment-hold.body=A payment receipt of order %s was voided and the order was put on hold on %s: the installment due on signing is no longer paid. Contact the customer; once the money is in again, lift the hold.
inbox.sales.follow-up.payment-restored.title=Order %s has its installment on signing paid again
inbox.sales.follow-up.payment-restored.body=Order %s, on hold since %s for payment, has its installment due on signing paid again. Check it and lift the hold; nothing lifts it automatically.
inbox.sales.follow-up.takeover=Its Sales account is no longer active: one of you takes it on.

# ---- WF-02 refusals people read (BusinessException#messageKey) and the status labels they name. MessageFormat:
# {0}, {1}... are arguments; no apostrophes (one would vanish).
refusal.quote.termsTooLong=The terms are at most {0} characters.
refusal.quote.noLine=A quote needs at least one line.
refusal.quote.lineTwice=Line {0} appears twice.
refusal.quote.legacyDesignTwice=The same design on blank {0} is quoted twice.
refusal.quote.skuTwice=SKU {0} is quoted twice: one line per SKU.
refusal.quote.oneShippingFee=A quote has one shipping fee at most.
refusal.quote.plateFeeNotOnQuote=A plate fee is for a SKU on the quote, not {0}.
refusal.quote.onePlateFee=SKU {0} has one plate fee at most.
refusal.quote.belowMoq=Line {0} ({1}): {2} cartons is below the minimum order quantity of {3} cartons.
refusal.quote.lineNotPriced=Quote {0}, line {1} has no price yet: enter its price tiers before sending.
refusal.quote.feeNotPriced=Quote {0}: the {1} of {2} has no amount yet: enter it before sending.
refusal.quote.lineTaxClassMissing=Quote {0}, line {1}: the product of {2} has no tax class; set it before sending.
refusal.quote.feeTaxClassMissing=Quote {0}: the product of {1} has no tax class, so its plate fee has no VAT rate; set it before sending.
refusal.quote.sentExpired=Quote {0} is valid until {1}, which has passed: set a later validity before sending.
refusal.quote.lineNotOnQuote=A line answered is not on quote {0}.
refusal.quote.atLeastOneCarton=Line {0} needs at least 1 carton.
refusal.quote.feedbackRequired=Say what to change, in at most {0} characters.
refusal.quote.cancellationReasonRequired=A cancellation says why, in at most {0} characters.
refusal.quote.legacy=Quote {0} was drafted on blanks and designs, before the customer SKUs: revise a draft onto the customer SKUs, or draw up a new quote.
refusal.quote.expired=Quote {0} was valid until {1} and has expired.
refusal.quote.transition.edit=Quote {0} is {1}: it cannot be edited now.
refusal.quote.transition.send=Quote {0} is {1}: it cannot be sent now.
refusal.quote.transition.revise=Quote {0} is {1}: it cannot be reopened for a new revision now.
refusal.quote.transition.cancel=Quote {0} is {1}: it cannot be cancelled now.
refusal.quote.transition.convert=Quote {0} is {1}: it cannot be converted into an order now.
refusal.quote.transition.answer=Quote {0} is {1}: it cannot be answered now.
refusal.quote.beingRevised=Quote {0} is being revised by Sales: you can answer it once the new revision is sent.
refusal.quote.quantityOutOfRange=Line {0}: {1} cartons is out of range (at most {2} pieces).
refusal.quote.tierTwice=Line {0} has two price tiers starting at {1} cartons.
refusal.quote.cartonOfOne={0}: a carton holds more than one piece, not {1}.
refusal.quote.printSpecTooLong=A print specification is at most {0} characters.
refusal.quote.linePriceMissing=Line {0} has no price yet.
refusal.quote.feeSku=A plate fee names the SKU it is for; the shipping fee names none.
refusal.quote.shippingFeeAmount=A shipping fee is a positive whole VND amount.
refusal.quote.plateFeeAmount=A plate fee is a whole VND amount, 0 or more.
refusal.quote.unitPrice=A quoted unit price is a positive whole VND amount.
refusal.quote.tierStart=A price tier starts at 1 carton or more.
refusal.quote.acceptedAllActive=Quote {0} is accepted, its customer is active and every SKU on it is still sold: convert it into its order instead.
refusal.quote.convertNotAccepted=Quote {0} is {1}: only an accepted quote becomes an order.
refusal.quote.withdrawn=Quote {0} was withdrawn: {1}
refusal.quote.changed=Quote {0} was changed by someone else meanwhile: reload it and try again.
refusal.quote.customerAnswers=Only the customer accepts or asks to change their quote.
refusal.quote.customerNotActive=The customer is {0}: quotes are for active customers only.
refusal.contract.customerNotActive=The customer is {0}: a new contract is sent to active customers only. A contract already sent can still be signed.
refusal.quote.requestDesignNotApproved=A design of the request is not approved yet: a quote follows its approval.
refusal.quote.skuInactiveLine=SKU {0} on line {1} is no longer sold.
refusal.quote.skuInactive.revise=Quote{0} holds a SKU that is no longer sold ({1}): change it to a SKU still sold and send the quote again.
refusal.quote.skuInactive.cancel=Quote{0} holds a SKU that is no longer sold ({1}): cancel the quote with its reason and send a new one.
refusal.quote.skuInactive.accept=Quote{0} holds a product that is no longer sold ({1}), so it cannot be accepted yet. Ask for changes so Sales can update the quote.
refusal.quote.requestWithdrawn=Quote {0} drawn from this request was cancelled before it was sent, so the request is closed. Draw up a quote by hand, or wait for the customer to ask again.
refusal.quote.validUntilPast=A quote is valid until a moment still ahead.
refusal.quote.requestedDatePast=The requested delivery date cannot be in the past.
refusal.quote.plateFeeMissing=Quote {0}: {1} is produced for the first time without a plate fee: edit the quote to add it.
refusal.quote.feeKind=A fee line is a plate fee or a shipping fee.
refusal.quote.shippingFeeOneWithAmount=One shipping fee at most, with its amount.
refusal.quote.plateFeeSku=A plate fee is for a SKU on the quote.
refusal.quote.plateFeeReorder={0} was produced before: a reorder has no plate fee.
refusal.quote.plateFeeProduced=Quote {0}: {1} was produced before, so its plate exists: edit the quote to remove the plate fee.
refusal.quote.feeLinesInvalid=The fee lines are not valid.
refusal.quote.feeAmount=A whole VND amount, 0 or more.
refusal.quote.notCustomerSku={0} is not a SKU of this customer.
refusal.quote.customerSkuRequired=A quote line is one of the customer own SKUs, not {0}.
refusal.quote.cartonSpecMissing={0} has no single carton unit: set its carton specification.
refusal.quote.noOwnPrice=Neither a price of the customer''s own nor a standard price is set for {0}: enter the price tiers of the line.
refusal.quote.belowOwnPriceMinimum={0} cartons of {1} is below the minimum of {2} cartons of the price: enter the negotiated price tiers.
refusal.quote.priceReviewPending=Quote {0} is waiting for its prices to be approved: withdraw it first to change it.
refusal.quote.priceReviewNotPending=Quote {0} is not waiting for its prices to be approved.
refusal.quote.priceReviewSelf=You sent quote {0} for approval: someone else approves or rejects its prices.
refusal.quote.priceRejectionReasonRequired=Say why the prices are rejected, in at most {0} characters.
refusal.quote.priceReviewNoteTooLong=A note is at most {0} characters.
refusal.contract.schedule.count=1 to {0} delivery batches.
refusal.contract.schedule.batchMissing=A delivery batch is missing.
refusal.contract.schedule.windowBoth=Delivery batch {0}: a window has both its days, or neither yet.
refusal.contract.schedule.windowOrder=Delivery batch {0}: the window does not end before it starts.
refusal.contract.schedule.startOrder=Delivery batch {0} starts no earlier than the batch before it.
refusal.contract.schedule.batchEmpty=Delivery batch {0} has at least one carton.
refusal.contract.schedule.lineUnknown=Delivery batch {0}: a line that is not of order {1}.
refusal.contract.schedule.lineTwice=Delivery batch {0}: each order line once.
refusal.contract.schedule.cartons=Delivery batch {0}: a whole number of cartons, at least 1.
refusal.contract.schedule.cartonsMismatch={0}: {1} cartons over the delivery batches, the order line has {2}.
refusal.contract.schedule.windowMissing=Delivery batch {0}: set its delivery window before the contract is sent.
refusal.contract.schedule.windowPast=Delivery batch {0}: the window is not in the past when the contract is sent.
refusal.contract.plan.count=1 to {0} installments.
refusal.contract.plan.installmentMissing=An installment is missing.
refusal.contract.plan.name=Installment {0}: a name of at most 100 characters.
refusal.contract.plan.milestone=Installment {0}: ON_SIGNING, BEFORE_DELIVERY or AFTER_DELIVERY.
refusal.contract.plan.onSigningNoBatch=Installment {0}: an installment on signing is tied to no delivery batch.
refusal.contract.plan.batchRange=Installment {0}: a delivery batch of the schedule, 1 to {1}.
refusal.contract.plan.beforeDeliveryNoDueDays=Installment {0}: an installment before delivery has no due day; it blocks the handover until paid.
refusal.contract.plan.dueDays=Installment {0}: 0 to 365 days.
refusal.contract.plan.amountOrPercent=Installment {0}: an amount or a share of the total, one of the two.
refusal.contract.plan.amount=Installment {0}: a whole number of dong, more than 0.
refusal.contract.plan.percent=Installment {0}: more than 0, at most 100, two decimals at most.
refusal.contract.plan.lastEmpty=Installment {0}: rounding leaves nothing for the last installment.
refusal.contract.plan.totalMismatch=The installments add up to {0}; the order total with tax is {1}.
refusal.contract.plan.nothingLeftForTied=The installments tied to no delivery batch take {0} of the total {1}: nothing is left for those tied to one.
