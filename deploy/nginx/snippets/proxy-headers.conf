# Headers sent to the application. Spring runs with forward-headers-strategy=framework, whose
# ForwardedHeaderFilter trusts EVERY forwarding header it receives - so each one it understands is
# either set here or explicitly cleared. nginx passes client headers through by default; a header
# left unmentioned is a header the client controls.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
# OVERWRITE, never append ($proxy_add_x_forwarded_for). RateLimitInterceptor takes the leftmost
# entry; appending would leave a client-supplied value in that position and give every forged
# request a fresh rate-limit bucket.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  443;

# Cleared: an empty value removes the header. Each of these is honoured by ForwardedHeaderFilter
# and would let a client rewrite the scheme, host or path of every link the application generates.
proxy_set_header Forwarded          "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Ssl    "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
