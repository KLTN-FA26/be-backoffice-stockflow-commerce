# How long nginx waits on the application, for every location that has no reason to wait longer.
#
# Not part of proxy-headers.conf: a location that must wait longer (the assistant, in
# templates/stockflow.conf.template) sets its own values next to that snippet, and nginx refuses a
# directive given twice in one context ("is duplicate") - an include is the same context, so
# `nginx -t` would fail and the deploy would stop at it.

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
