# =============================================================================
# CI. Runs on every push and pull request.
#
# The point of this file is not "run the tests" - it is to make the two fitness functions
# non-negotiable. ModularityTest and ArchitectureTest are the only thing standing between this
# design and a ball of mud (ADR-0005), and a check that only runs when somebody remembers is not a
# check. Here they run on every commit, and a red build blocks the merge.
# =============================================================================

name: build

on:
  push:
    # infra/deploy deploys too: it is where changes to the deployment itself (deploy/, this file)
    # are tried against the VPS before they reach develop.
    branches: [main, develop, infra/deploy]
  pull_request:

# A new push to the same branch cancels the previous run. Without this a busy branch queues five
# builds of superseded commits and the useful one waits behind them.
#
# Except on the branches that deploy: cancelling there could kill a run in the middle of its deploy
# job, between replacing the container and confirming it is healthy. A newer push waits instead
# (GitHub keeps only the newest pending run, so superseded commits are still skipped).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/infra/deploy' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Integration tests start Postgres through Testcontainers, which needs a Docker socket. The
    # ubuntu runner has one; a container-based runner would not.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The migration check below needs a real merge base, and a depth-1 clone
          # has none - the diff then fails, and with the failure swallowed the check reported
          # green while enforcing nothing at all.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.m2/repository. Do NOT add -Dmaven.repo.local pointing elsewhere: the cache
          # would still be saved and restored, and Maven would ignore it, so every run
          # re-downloads every dependency while the cache step reports success.
          cache: maven

      # ---------------------------------------------------------------------
      # Compile first, on its own. A compile error should fail in thirty seconds with a clear
      # message, not after Testcontainers has spent two minutes pulling a Postgres image.
      # ---------------------------------------------------------------------
      - name: Compile
        run: mvn -B -ntp clean compile

      # ---------------------------------------------------------------------
      # The architecture gates, before anything slow. They need no database and no containers, so
      # they finish in seconds - and a boundary violation is exactly the kind of thing you want to
      # hear about before waiting for the full suite.
      # ---------------------------------------------------------------------
      - name: Module boundaries and architecture
        run: mvn -B -ntp test -Dtest='ModularityTest,ArchitectureTest' -DfailIfNoTests=false

      - name: Unit and integration tests
        run: >-
          mvn -B -ntp verify
          -Dgit.commit=${{ github.sha }}
          -Dgit.branch=${{ github.ref_name }}

      # ---------------------------------------------------------------------
      # Migrations are validated by the integration tests booting against a real Postgres. What is
      # NOT covered there is somebody editing a migration that has already been applied - Flyway
      # detects that by checksum at startup, and this makes the failure loud in CI rather than
      # during a deployment.
      # ---------------------------------------------------------------------
      - name: Check migrations are append-only
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}"
          BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          # Two-dot diff against the real merge base, and no `|| true`: a check that cannot run
          # must fail loudly rather than pass quietly.
          CHANGED=$(git diff --name-only --diff-filter=M "$BASE" HEAD \
            -- src/main/resources/db/migration/)
          if [ -n "$CHANGED" ]; then
            echo "::error::An already-applied migration was MODIFIED:"
            echo "$CHANGED"
            echo "Flyway validates by checksum, so this breaks every environment that ran it."
            echo "Add a new timestamped migration instead."
            exit 1
          fi
          echo "No applied migration was modified."

      # Coverage per module on the run's own page. The artifact below holds the full HTML report,
      # but a number nobody downloads a zip to read is a number nobody reads.
      - name: Coverage summary
        if: always()
        run: python3 tools/ci/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test report
        uses: actions/upload-artifact@v4
        # Uploaded even on failure - a red build is when the report is actually wanted.
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

      # The generated C4 diagrams and module canvases. Written by ModularityTest, so they always
      # match the code that produced them - which is what makes them worth putting in the report.
      - name: Publish generated architecture docs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-docs
          path: target/spring-modulith-docs/
          retention-days: 30

  # -------------------------------------------------------------------------
  # The image is built on every push to a protected branch, not only at release. An image that is
  # only built at release time is one whose Dockerfile breaks silently for weeks.
  #
  # Pushed to GHCR as sha-<7 chars> (what is deployed - immutable, so a rollback is exact) and as
  # the branch name (a moving pointer, for humans).
  # -------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects upper-case repository names, and the organisation is KLTN-FA26. A tag may not
      # contain '/', so the branch infra/deploy is tagged infra-deploy.
      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch }}
          # Links the package to this repository, so it inherits the repository's access and the
          # deploy job's GITHUB_TOKEN can pull it.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # develop and infra/deploy -> the VPS. deploy/README.md describes the server side and the
  # secrets this needs. Both deploy to the SAME server, so whichever pushed last is what runs.
  #
  # The `vps` environment holds the secrets; add required reviewers to it in the repository
  # settings to turn this into a manual approval step without touching this file.
  # -------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/infra/deploy')
    timeout-minutes: 15
    environment:
      name: vps
      url: https://api.${{ vars.DOMAIN }}
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/stockflow' }}
      SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      # Secrets reach the shell through env, never by ${{ }} inside `run:` - interpolated text
      # becomes part of the script, and a value containing a quote would break or inject into it.
      # known_hosts is pinned from a secret rather than learned with ssh-keyscan, which would trust
      # whatever answered on that address the first time.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "${SSH_TARGET#*@}" "${SSH_TARGET%@*}" "$SSH_PORT" > ~/.ssh/config

      # --delete removes files dropped from deploy/ in the repository; excluded paths are
      # server-only state and are neither overwritten nor deleted.
      - name: Sync deploy files
        run: >-
          rsync -az --delete
          --exclude='.env' --exclude='certs/' --exclude='auth/' --exclude='backups/'
          --exclude='.nginx-config-hash'
          deploy/ "vps:$DEPLOY_PATH/"

      # The token is piped over stdin, so it never appears in a process list on the server, and it
      # expires when this job ends - the server holds no long-lived registry credential.
      - name: Log the server in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy ${{ needs.docker.outputs.tag }}
        run: ssh vps "cd '$DEPLOY_PATH' && bash scripts/deploy.sh '${{ needs.docker.outputs.tag }}'"

      - name: Log the server out of GHCR
        if: always()
        run: ssh vps "docker logout ghcr.io" || true
