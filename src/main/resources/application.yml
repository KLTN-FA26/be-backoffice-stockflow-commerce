# =============================================================================
# StockFlowCommerce - modular monolith
#
# One application, one database, fourteen modules. Everything that was a service registry,
# a gateway route table or a Kafka topic in the previous architecture is gone; what is left is
# a datasource, a Flyway path and the settings that make in-process events durable.
# =============================================================================

spring:
  servlet:
    multipart:
      # Category policy still enforces 10 MiB product / 50 MiB design limits.
      max-file-size: 50MB
      max-request-size: 51MB
      # Uploads up to 2 MB stay in memory instead of a temp file (Spring's default threshold is 0): a spoken question
      # (ADR-0019, at most 2 MB) is then never written to disk, not even while the speech model is called.
      file-size-threshold: 2MB
  application:
    name: stockflow-monolith

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
      # JavaMail otherwise derives the Message-ID and the EHLO name from this machine's canonical host
      # name, a reverse DNS lookup that took ~10 s per e-mail on a developer laptop. mail.from covers
      # the Message-ID (the sender header is still set per message); MAIL_SMTP_LOCALHOST names the
      # host in EHLO when the deployment's DNS is slow. Blank keeps JavaMail's own lookup.
      mail.from: ${MAIL_FROM:noreply@stockflow.local}
      mail.smtp.localhost: ${MAIL_SMTP_LOCALHOST:}

  # ---------------------------------------------------------------------------
  # ONE datasource. This single block is what replaced fourteen of them.
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockflow}
    username: ${DB_USER:stockflow}
    password: ${DB_PASSWORD:stockflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Sized for the machine, not the module count. The old deployment ran 14 pools of 10 and
      # opened 140 connections to serve a load one pool of 20 handles - which is why Postgres
      # needed a connection pooler in front of it. Rule of thumb: cores * 2 + effective spindles.
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 5
      connection-timeout: 3000        # fail fast; a request waiting 30s for a connection is dead anyway
      max-lifetime: 1800000           # 30 min, below any proxy or database idle timeout
      pool-name: stockflow-pool
      # MUST stay false while hibernate.connection.provider_disables_autocommit is true below.
      # With that flag set, Hibernate skips its own setAutoCommit(false) on the assumption the pool
      # already did it. If the pool has not, every statement commits on its own and @Transactional
      # rollback becomes a no-op - which would silently destroy the atomicity this whole
      # architecture is built on, with no error anywhere to point at it.
      auto-commit: false
      # Belt and braces with the server-side setting in docker-compose: a statement still running
      # after 10s is not going to finish usefully and is holding a connection every module shares.
      connection-init-sql: SET statement_timeout = 10000
      # MUST stay true while auto-commit is false. Without it Hikari runs the init SQL above and
      # neither commits nor rolls back, so every new connection enters the pool "idle in
      # transaction": Postgres kills it after idle_in_transaction_session_timeout (60s in
      # docker-compose) and the pool logs "Failed to validate connection ... has been closed" on
      # the next borrow. SET is transactional too, so the first rollback on such a connection
      # would also undo the statement_timeout it was opened to set.
      isolate-internal-queries: true
      # Every module shares this pool. That is the monolith's main operational risk: a runaway
      # report query can starve checkout. Mitigated by statement timeouts below, and revisited in
      # docs/adr/0005 if reporting ever needs its own read replica.

  jpa:
    open-in-view: false               # OFF. Leaving it on lets lazy loading happen inside view
                                      # rendering, which hides N+1 queries and holds a connection
                                      # for the whole request. Spring warns about it for a reason.
    hibernate:
      ddl-auto: validate              # NEVER "update". Flyway owns the schema; Hibernate's job is
                                      # to complain loudly when the entities and the tables differ.
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        # Fails the build the moment a query triggers a lazy collection outside a session, rather
        # than letting it become a LazyInitializationException in production.
        enable_lazy_load_no_trans: false
        query:
          fail_on_pagination_over_collection_fetch: true
        connection:
          # Saves a round trip per transaction: Hibernate does not call setAutoCommit(false) because
          # the pool hands over connections that already have it off. Paired with
          # spring.datasource.hikari.auto-commit: false above - the two must agree.
          provider_disables_autocommit: true
    show-sql: false                   # use the p6spy/actuator route in dev; never log SQL in prod

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Every module's migrations live in one path and run in one ordered sequence, because they
    # share one database. File names are timestamped (V20260901000200__...) rather than numbered
    # sequentially: with five people committing migrations in parallel, V3__ collides constantly
    # and a timestamp never does.
    baseline-on-migrate: false
    validate-on-migrate: true
    default-schema: public
    schemas: public                   # the module schemas are created by the first migration

  # ---------------------------------------------------------------------------
  # Modulith event publication registry - the outbox, provided by the framework.
  # ---------------------------------------------------------------------------
  modulith:
    events:
      jdbc:
        schema-initialization:
          # Flyway owns the schema; see V20260901000400. Auto-creation at startup is convenient in
          # development and wrong in production - the deployed schema would differ from what the
          # migration history says is there, and nothing would record the difference.
          #
          # No `schema:` key here on purpose: that property belongs to the JDBC registry, and this
          # application uses the JPA one, whose entity maps to an unqualified table name.
          enabled: false
      # Replays every publication that never completed. This is the guarantee that a crash between
      # "order committed" and "confirmation email sent" costs a delay, not a lost email.
      republish-outstanding-events-on-restart: true
      completion-mode: UPDATE         # keep completed rows for audit rather than deleting them
      externalization:
        enabled: false                # nothing leaves the process today

  # spring-modulith-observability's ModuleObservabilityBeanPostProcessor wraps every bean it
  # considers part of an application module - including the *shared* ones in `common` - in a CGLIB
  # proxy for cross-module tracing spans. It does this with its own hand-rolled
  # BeanPostProcessor.postProcessAfterInitialization, bypassing AbstractAutoProxyCreator entirely,
  # so it does not honour @Order, spring.aop.auto=false, or the AopInfrastructureBean marker the
  # way a normal Spring AOP proxy creator would.
  #
  # That proxy is fatal for CorrelationIdFilter, RequestLoggingFilter, UnsecuredDataScopeFilter and
  # IdempotencyFilter: GenericFilterBean.init() and OncePerRequestFilter.doFilter() are `final`, so
  # CGLIB cannot override them, and Tomcat calling filter.init() on the proxy runs the inherited
  # method body against the PROXY's own (Objenesis-constructed, never-initialised) fields rather
  # than the target's - "Cannot invoke Log.isDebugEnabled() because this.logger is null" - which
  # fails filter startup and takes the whole embedded Tomcat context down with it. Confirmed this
  # is not something this change introduced: it reproduces identically on an unmodified `develop`
  # checkout, so the application has never actually booted successfully with tracing on.
  #
  # Excluding only ModuleObservabilityAutoConfiguration (not management.tracing.enabled) keeps
  # ordinary Micrometer/OTel request tracing working; it removes only Modulith's own additional
  # module-boundary spans, which is the feature that is broken.
  autoconfigure:
    exclude:
      - org.springframework.modulith.observability.autoconfigure.ModuleObservabilityAutoConfiguration
      - org.springframework.modulith.observability.autoconfigure.SpringDataRestModuleObservabilityAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          # The identity module issues and signs the tokens, and this same application validates
          # them. Kept as a URI rather than an inline key so that moving identity out later is a
          # configuration change, not a code change.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/oauth2/jwks}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
    web:
      pageable:
        # Pages.of() enforces the same ceiling, but only where an author remembers to call it.
        # A controller that declares a Pageable parameter directly is resolved by Spring, and
        # Boot's default max-page-size is 2000 - one request could ask for 2000 rows with their
        # associations. A limit enforced in some endpoints and not others is the same as no limit,
        # so it is set here as well, where it applies to every Pageable Spring resolves.
        max-page-size: 200
        default-page-size: 20

  task:
    execution:
      # FORCE: build applicationTaskExecutor even though the STOMP broker (sales chat) brings executors of its own;
      # by default Boot backs off when any Executor bean exists, and @Async would lose its executor (AsyncConfig).
      mode: force
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 500
      thread-name-prefix: stockflow-async-
    scheduling:
      pool:
        size: 4                       # the reservation sweeper and the nightly jobs share this

  threads:
    virtual:
      enabled: true                   # Java 21 virtual threads: request handling is IO-bound, and
                                      # this removes the platform-thread ceiling under load

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful                  # let in-flight orders finish before the process exits
  error:
    include-message: never            # exception text can leak internals; GlobalExceptionHandler
    include-stacktrace: never         # produces the client-safe body instead

# -----------------------------------------------------------------------------
# Observability. One process, so a trace is a stack rather than a distributed puzzle - which was
# one of the concrete wins of collapsing the services.
# -----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,applicationmodules
        # "applicationmodules" is Modulith's: it serves the live module structure and dependencies
        # as JSON, so the architecture diagram in the report can be regenerated from the running
        # application rather than drawn by hand and left to rot.
  endpoint:
    health:
      show-details: when-authorized
      # when-authorized alone means ANY authenticated user - a CUSTOMER - sees every detail,
      # including the storage bucket and endpoint. Boot matches these against the caller's
      # authorities, so a permission works here: whoever holds platform-actuator:READ
      # (ActuatorPermission, granted in the role matrix) - never a role name.
      roles: platform-actuator:READ
      probes:
        # /actuator/health/liveness and /readiness, which is what Kubernetes probes.
        enabled: true
  health:
    # -------------------------------------------------------------------------
    # WHICH DEPENDENCY FAILURES SHOULD TAKE AN INSTANCE OUT OF SERVICE
    #
    # readiness = "can this instance serve traffic". Postgres: yes, nothing works without it.
    # Redis, object storage, Elasticsearch: NO. They degrade a feature; taking every instance out
    # of the load balancer because MinIO is down turns a degraded upload path into a total outage -
    # the classic way a health check causes the incident it was meant to detect.
    #
    # They still appear in /actuator/health, so a dashboard and an alert see them. The difference
    # is that a human decides what to do rather than the orchestrator deciding for everyone.
    # -------------------------------------------------------------------------
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    group:
      readiness:
        include: readinessState, db
        show-details: when-authorized
      liveness:
        # Liveness answers "is this JVM wedged". A dependency being down is not a reason to RESTART
        # the process - the restart cannot fix Redis, and a crash loop makes recovery harder.
        include: livenessState
  info:
    # Populates /actuator/info from build-info.properties (see the spring-boot-maven-plugin
    # execution). env is deliberately OFF: it would print resolved configuration, which includes
    # anything that arrived from an environment variable.
    build:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    env:
      enabled: false
  metrics:
    tags:
      application: stockflow-monolith
    # The assistant's answer, model-call and tool timers publish histogram buckets, so p50 and p95 come out of Prometheus
    # for the evaluation report (docs/assistant-design.md §10.2, §11), not out of a guess.
    distribution:
      percentiles-histogram:
        "[assistant.answer]": true
        "[gen_ai.client.operation]": true
        "[assistant.tool]": true
  otlp:
    tracing:
      # Boot's OTLP exporter reads THIS property. It does not honour OTEL_EXPORTER_OTLP_ENDPOINT -
      # that variable is read only by opentelemetry-spring-boot-starter, which is not a dependency
      # here. Note it is the full endpoint including /v1/traces, not a base URL.
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

  group-configs:
    - group: all
      packages-to-scan: com.stockflow

    - group: inventory
      packages-to-scan: com.stockflow.inventory

    - group: order
      packages-to-scan: com.stockflow.order
    - group: procurement
      packages-to-scan: com.stockflow.procurement

    - group: warehouse
      packages-to-scan: com.stockflow.warehouse

# -----------------------------------------------------------------------------
# Application settings owned by this system rather than by a framework.
# -----------------------------------------------------------------------------
stockflow:
  api:
    # Shown in the generated OpenAPI document. Bump on a breaking API change.
    version: 1.0.0

  # ---------------------------------------------------------------------------
  # Cache. TTLs are NOT here - they live beside the cache name in CacheNames, so a name and its
  # expiry cannot drift apart. Only the key namespace is configurable.
  # ---------------------------------------------------------------------------
  cache:
    # Bump this when a cached type changes shape. Every key is prefixed with it, so a deployment
    # whose DTOs gained a field starts from a clean namespace instead of deserialising yesterday's
    # objects into the new class.
    version: v1

  # ---------------------------------------------------------------------------
  # Reporting (SCRUM-344): the sales rollups behind the dashboard.
  # ---------------------------------------------------------------------------
  reporting:
    # On the first start after deploy, roll up the orders placed before the listeners existed. Does nothing once the
    # history is in. POST /api/v1/reports/rebuild does the same by hand.
    backfill-on-startup: true

  # ---------------------------------------------------------------------------
  # HTTP idempotency. Applies to any unsafe request carrying an Idempotency-Key header.
  # ---------------------------------------------------------------------------
  idempotency:
    enabled: true
    purge-cron: "0 15 * * * *"      # hourly, off the hour so it does not collide with other jobs

  # ---------------------------------------------------------------------------
  # Audit trail (BRD 3.19.3).
  #
  # These durations DESTROY DATA when they elapse. Confirm both against the retention policy the
  # business actually signs before go-live - the defaults are a starting point, not a decision.
  # ---------------------------------------------------------------------------
  audit:
    routine-retention: P180D        # ordinary business actions: six months
    security-retention: P730D       # logins, grants, exports, deletes: two years
    purge-cron: "0 30 3 * * *"      # nightly, off-peak

  # ---------------------------------------------------------------------------
  # Outbound HTTP. Java's HttpClient has NO default read timeout; these are what stop a hung
  # dependency from consuming every thread in the application. See HttpClientProperties.
  # ---------------------------------------------------------------------------
  http:
    connect-timeout: PT3S
    read-timeout: PT10S

  notification:
    # How often messages to producers about their production orders that failed are tried again (4A-3).
    production-order-retry-interval: PT1M
    # -------------------------------------------------------------------------
    # E-mail (SCRUM-352). Every message - producers' production orders, staff notices, the portal invitation,
    # customer order mail -
    # goes through one transport. resend: Resend's HTTP API (the dev and prod profiles' default); smtp: spring.mail
    # above (Mailpit locally); recording: kept in memory, never sent (the test profile). See EmailProperties.
    # -------------------------------------------------------------------------
    email:
      provider: ${EMAIL_PROVIDER:smtp}
      # "StockFlow <no-reply@your-domain>". With Resend the domain must be verified in its dashboard.
      from: ${RESEND_FROM:${MAIL_FROM:noreply@stockflow.local}}
      # Where a customer's reply goes (e.g. Sales' shared mailbox). Blank: customer mail says not to reply.
      reply-to: ${RESEND_REPLY_TO:}
      locale: vi
      sender-name: ${EMAIL_SENDER_NAME:StockFlow}
      customer:
        # Off sends no customer order mail (recorded as skipped) and leaves staff and producer mail alone. Off by
        # default: the business documents put e-mail to customers in a later phase (kltn-docs 00 §6, A10) and keep
        # only the in-app inbox for now, while the order and return mail here still describes flows they dropped
        # (guest orders, free replacement orders). The portal invitation is not customer order mail and still goes.
        enabled: ${CUSTOMER_EMAIL_ENABLED:false}
        # E-invoice mail to the buyer (an invoice issued, with its PDF and XML; an error notice): its own switch, ON by
        # default in every profile. An issued invoice is a legal record the seller must send the buyer in the way they
        # agreed (NĐ 254/2026/NĐ-CP Điều 12 khoản 3) - the e-mail the invoice names, and the portal - so it does not
        # wait for the order mail's later phase. Turn it off only on a server that must never write to real buyers.
        einvoice-enabled: ${EINVOICE_EMAIL_ENABLED:true}
        max-attempts: 10
        first-retry-delay: PT1M
        max-retry-delay: PT6H
        # How often failed customer mail is looked at again (CustomerEmailRetry).
        retry-interval: PT1M
      resend:
        # Never commit a key. Required when provider is resend: without it the application does not start.
        api-key: ${RESEND_API_KEY:}
        base-url: https://api.resend.com
        # Signing secret of the Resend webhook (whsec_...). Blank: POST /api/v1/notifications/webhooks/resend
        # answers 503 and Resend retries until it is set.
        webhook-secret: ${RESEND_WEBHOOK_SECRET:}
        webhook-tolerance: PT5M
        # Resend allows a team 2 requests per second by default; each instance keeps to this.
        requests-per-second: ${RESEND_REQUESTS_PER_SECOND:2}
        max-concurrent-requests: 2
    # In-app inbox: read messages older than this are deleted by the nightly purge (unread ones are kept).
    inbox-retention-days: 90
    inbox-purge-cron: "0 45 3 * * *"
    # Language of system-generated inbox messages (the bundle i18n/messages_<locale>.properties).
    inbox-locale: vi

  # ---------------------------------------------------------------------------
  # File storage. 's3' talks to MinIO locally and to S3 in a deployment - the same code path.
  # 'local' writes to the filesystem and is for development only; it cannot work with more than
  # one instance and its presigned URLs are not real URLs.
  # ---------------------------------------------------------------------------
  storage:
    provider: s3
    bucket: stockflow
    # Made at startup when missing (StorageBucketInitializer): a fresh MinIO has no bucket, and the first stored file
    # (an issued e-invoice's XML) would fail on it. Off where the bucket is infrastructure's (dev and prod: AWS).
    create-missing-bucket: true
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    region: ap-southeast-1
    # MinIO needs path-style addressing; real S3 uses virtual-host style. Wrong value produces a
    # DNS failure that looks nothing like a configuration problem.
    path-style: true
    # Static keys for MinIO, or for real S3 from a machine with no AWS role (the VPS: an IAM user with
    # only infra/aws's application policy). Blank on AWS compute so the default provider chain picks
    # up the instance role. Never committed for a real account: long-lived keys leak from files.
    access-key: ${MINIO_ACCESS_KEY:stockflow}
    secret-key: ${MINIO_SECRET_KEY:stockflow123}
    presigned-url-ttl: PT10M        # a signed URL is a credential with no revocation; keep it short
    # S3 Object Lock on business records (ObjectLockProperties): a confirmed design's files, a sales
    # contract and an issued e-invoice's XML and PDF cannot be deleted or overwritten for these periods. Needs a
    # bucket with Object Lock (infra/aws); MinIO in development has none, so it is off unless the deployment turns it
    # on - and while it is off, nothing below is used. The design and contract periods are placeholders until the
    # business confirms them against the law that applies.
    object-lock:
      enabled: false
      # The mode of design and contract locks.
      mode: GOVERNANCE
      confirmed-design: P1095D
      sales-contract: P3650D    # a sales contract as sent and as signed (4B-4)
      # An issued e-invoice's XML and PDF: locked until the end of the tenth year after the year of issue, plus a
      # day - accounting records are kept ten years from the end of the accounting year (Luat Ke toan 2015 Dieu 41;
      # ND 174/2016 Dieu 12), not from the day of issue. A Period, counted from 1 January after the year of issue.
      einvoice: P10Y
      # COMPLIANCE whatever `mode` says: nobody, not even the account root, can lift it. GOVERNANCE only on a test
      # bucket, whose invoices are not records and must stay deletable.
      einvoice-mode: ${S3_OBJECT_LOCK_EINVOICE_MODE:COMPLIANCE}
    # Browser uploads straight to the object store (StagedUploads, docs/direct-uploads-fe-contract.md).
    staged-upload:
      url-ttl: PT15M            # the signed PUT; S3 checks it when the upload starts, not when it ends
      session-ttl: PT1H         # how long an upload may wait to be attached; incoming/ expires after a day
      per-user-per-hour: 120    # slots one user may take in an hour
    # Files no record names any more (OrphanedFileSweeper): nightly, report-only until delete is turned on.
    # Published product images, exports and the quarantine prefix are never swept.
    orphan-sweep:
      cron: "0 30 3 * * *"
      delete: false
      grace: P7D                # older than any transaction; a file still being attached is never touched
      batch: 500

  # ClamAV (docker-compose.media.yml). Off only in the local profile and on the VPS (deploy/), whose
  # 4 GB cannot hold it; an upload is refused when the scanner is on and unreachable.
  upload-inspection:
    # Scans in flight per instance. One over waits for a slot up to acquire-timeout, then gets 429.
    max-concurrent: 4
    acquire-timeout: PT15S

  # The PDF/X output intent stamped into an approved print file (PrintOutputIntentProperties). By default the bundled
  # ISO Coated v2 (ECI) profile, FOGRA39 - the one the storefront embeds (print/icc/README.md), so a laptop and the VPS
  # need nothing installed. A printer's own profile: a classpath:/file: location or a plain path, with its condition
  # identifier (required then). A blank profile falls back to the interim sRGB intent.
  design:
    print:
      output-intent:
        profile: ${DESIGN_PRINT_ICC_PROFILE:classpath:print/icc/ISOcoated_v2_eci.icc}
        output-condition-identifier: ${DESIGN_PRINT_OUTPUT_CONDITION:}
        info: ${DESIGN_PRINT_OUTPUT_INFO:}

  catalog:
    availability:
      # At or under this many cartons a customer's own SKU shows "low stock" (kltn-docs 13 §4.4 step 4,
      # open-questions D28: 5 cartons). 0 never warns.
      low-stock-threshold: ${CATALOG_LOW_STOCK_THRESHOLD:5}
      # SKUs one availability call may ask about: a page's worth, not the whole catalogue.
      max-skus-per-request: 50
    search:
      # Ranking weights (SCRUM-182): score = text-rank*w1 + title-similarity*w2 + exact-SKU*w3.
      # Text rank and similarity are 0..1, so an exact SKU always wins. Blanks are never stocked: no stock weight.
      text-rank-weight: 1.0
      similarity-weight: 1.0
      exact-sku-weight: 10.0
      # Typo fallback when nothing matches exactly: minimum trigram similarity with the title.
      fallback-similarity: 0.2
      # Best matches that are ranked and pageable.
      ranking-window: 500

  product-media:
    # Public CloudFront/custom-domain origin. Blank keeps private upload working but public gallery returns 503.
    cloud-front-base-url: ${PRODUCT_MEDIA_CDN_BASE_URL:}

  web:
    request-log:
      enabled: true
    # Per-route caps on a request body (RequestBodyLimitFilter), enforced before the idempotency filter or Jackson
    # reads it. A customer's design document is at most 1,000,000 bytes once canonical (kltn-docs 12; the service and
    # design.design_document check that exactly); the body also carries the version and the envelope around it, and
    # whitespace a client may send, so the cap leaves 64 KiB over.
    body-limits:
      - method: PUT
        pattern: /api/v1/designs/{id}/document
        max-bytes: 1065536
      # A clone carries a whole layout too (FE request 2026-11-13 E-3), plus the target's SKU.
      - method: POST
        pattern: /api/v1/designs/{id}/clones
        max-bytes: 1065536

  inventory:
    # Most lines one planned cycle count may hold (SCRUM-146); a wider scope is refused so the count stays countable.
    cycle-count-max-lines: 500

  chat:
    # Sales chat (kltn-docs 16), the owner's decisions of 2026-11-13 - ChatProperties holds the same defaults.
    # Business hours the chat's clocks count in (16 §4.1 step 3): 08:00-17:30, Monday to Saturday, Vietnam time.
    business-zone: ${CHAT_BUSINESS_ZONE:Asia/Ho_Chi_Minh}
    business-days: ${CHAT_BUSINESS_DAYS:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY}
    business-opens: ${CHAT_BUSINESS_OPENS:08:00}
    business-closes: ${CHAT_BUSINESS_CLOSES:17:30}
    # BR-09: the first answer is due this long after the customer asks, in business time.
    first-response-target: ${CHAT_FIRST_RESPONSE_TARGET:PT15M}
    # BR-09: a conversation is to be resolved this many working days (of the hours above) after the customer asks -
    # or reopens it; past that the chat supervisors are told once. Days only (P2D or 2d).
    resolution-target: ${CHAT_RESOLUTION_TARGET:P2D}
    # 16 §5: a conversation waiting on a silent customer this long is auto-closed; a resolved or auto-closed one
    # reopens on the customer's word for this long, then is closed for good.
    auto-close-after: ${CHAT_AUTO_CLOSE_AFTER:P7D}
    reopen-window: ${CHAT_REOPEN_WINDOW:P14D}
    # Its author may edit or delete a message this long after sending it.
    edit-window: ${CHAT_EDIT_WINDOW:PT5M}
    # An offline customer is told of Sales' replies at most once per conversation per period.
    customer-notice-period: ${CHAT_CUSTOMER_NOTICE_PERIOD:PT1H}
    # How often the SLA, auto-close and close jobs run.
    sla-job-interval: ${CHAT_SLA_JOB_INTERVAL:PT1M}
    # 16 BR-13: a salesperson who claims a conversation of a customer with no Sales owner becomes the owner. Off, only a
    # Sales Manager assigns owners and a claim takes the conversation alone.
    claim-makes-owner: ${CHAT_CLAIM_MAKES_OWNER:true}

  # The back-office AI assistant (ADR-0014, docs/assistant-design.md §11). Off by default; with no key it still starts
  # and answers 503 ASSISTANT_DISABLED. The key comes from the environment only, never from this file.
  assistant:
    enabled: ${ASSISTANT_ENABLED:false}
    # anthropic (ADR-0014), gemini, or openai: any server speaking OpenAI's chat-completions API, such as Ollama on
    # this machine (openai-compatible below). The key is the chosen provider's.
    provider: ${ASSISTANT_PROVIDER:anthropic}
    # ASSISTANT_API_KEY, or else the chosen provider's own variable below - never another vendor's: one vendor's key
    # sent to another is a credential disclosed to a third party. A key shaped like another vendor's is not used.
    api-key: ${ASSISTANT_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    # The openai provider's server and its optional key. Ollama: http://localhost:11434/v1, no key; give it a context of
    # 16k or more (OLLAMA_CONTEXT_LENGTH), since the instructions and tool definitions alone are several thousand tokens.
    openai-compatible:
      base-url: ${OPENAI_COMPATIBLE_BASE_URL:http://localhost:11434/v1}
      api-key: ${OPENAI_COMPATIBLE_API_KEY:}
      # The most an answer may take there (max_tokens is the smaller of this and max-output-tokens): a local model's
      # context holds the prompt and the answer together.
      max-output-tokens: ${OPENAI_COMPATIBLE_MAX_OUTPUT_TOKENS:4096}
    # CLOUD_ALLOWED, or LOCAL_ONLY: no model, embedding server or speech model outside the company's network is ever
    # built (loopback, private addresses, single-label and .local/.internal names). The technical half of AQ-01.
    data-policy: ${ASSISTANT_DATA_POLICY:CLOUD_ALLOWED}
    # What the business approved the assistant's data to reach, beside the policy (design §5.5): provider ids
    # (anthropic, gemini, openai) and hosts outside the company's network, comma-separated; empty for any. A model,
    # embedding server or speech model outside them is refused when the application starts, and the log says why.
    allowed-providers: ${ASSISTANT_ALLOWED_PROVIDERS:}
    allowed-hosts: ${ASSISTANT_ALLOWED_HOSTS:}
    # Customers go to the model provider as KH#1, KH#2 instead of their names; the panel shows the names (ADR-0018).
    pseudonymise-customers: ${ASSISTANT_PSEUDONYMISE_CUSTOMERS:true}
    model: ${ASSISTANT_MODEL:claude-opus-5-5}
    daily-message-limit: ${ASSISTANT_DAILY_LIMIT:50}
    # Model routing (docs/assistant-design.md §11). Unset, `model` alone answers, as before. Otherwise a question
    # starts on the first of `models` (cheapest first) whose quota is not spent. A model may name its vendor,
    # provider/model (openai/qwen3:8b, gemini/gemini-3.5-flash); a bare name is the assistant's own provider's, and so
    # is a name equal to `model`. A gateway's id that starts with a vendor (anthropic/claude-sonnet on OpenRouter) is
    # written openai/anthropic/claude-sonnet: alone it names Anthropic itself. Each
    # vendor's model gets that vendor's own key variable only, never ASSISTANT_API_KEY, and a model without one is left
    # out with a warning. A first call refused for a spent quota or an unreachable provider goes to the next model; once
    # a model has replied, the question stays on it. A question a model could not answer is asked once more on the next
    # model (escalate-on-failure). Moving on needs answer-lease to still hold two of the longest calls. A spent model is
    # skipped for quota-cooldown, an ISO-8601 duration; blank: until its vendor's quota day ends (midnight Pacific time
    # for Gemini, UTC otherwise).
    routing:
      models: ${ASSISTANT_MODELS:}
      escalate-on-failure: ${ASSISTANT_ESCALATE_ON_FAILURE:true}
      quota-cooldown: ${ASSISTANT_QUOTA_COOLDOWN:}
    # low | medium | high | xhigh | max. Low suits chat-style questions; raise it only if the golden set says so.
    effort: low
    max-tool-rounds: 6
    max-output-tokens: 16000
    retention-days: 90
    # One attempt; the SDK retries a failed call twice, each attempt with this timeout again.
    request-timeout: PT90S
    # How long a question holds its conversation. The loop starts no model call that could outlast it, so it must hold
    # at least two of the longest calls: request-timeout x 3 attempts x 2, checked at start-up.
    answer-lease: PT15M
    refusal-fallback: true
    # Idle conversations older than retention-days are deleted daily (business time).
    retention-cron: "0 30 3 * * *"
    # Searching the rules by meaning beside their words (design §6.4): the rules are in English, the questions in
    # Vietnamese. provider gemini serves a Gemini assistant only (the key is api-key below, or else the assistant's
    # own; never an Anthropic key). provider openai is the openai-compatible server above, such as Ollama with bge-m3
    # (model bge-m3, dimensions 1024): inside the company's network it serves any assistant, Claude included.
    # Otherwise the search stays keyword-only.
    embeddings:
      enabled: ${ASSISTANT_EMBEDDINGS_ENABLED:true}
      provider: ${ASSISTANT_EMBEDDINGS_PROVIDER:gemini}
      api-key: ${ASSISTANT_EMBEDDINGS_API_KEY:}
      model: ${ASSISTANT_EMBEDDINGS_MODEL:gemini-embedding-001}
      # 128-3072. A new model or length re-embeds every passage on the next start, in the background.
      dimensions: ${ASSISTANT_EMBEDDINGS_DIMENSIONS:768}
    # How the knowledge search ranks (design §6.4). Each value changes only on what RetrievalEval measures (§10.2).
    knowledge:
      # Robust deviations above the corpus's median similarity a passage must stand to count as near a question.
      standout: ${ASSISTANT_KNOWLEDGE_STANDOUT:3.0}
      fusion-depth: ${ASSISTANT_KNOWLEDGE_FUSION_DEPTH:10}
      # Embed the user's question too, beside the model's search terms; the tool then asks the model for it.
      multi-query: ${ASSISTANT_KNOWLEDGE_MULTI_QUERY:false}
      # text-embeddings-inference serving bge-reranker-v2-m3, inside the company's network only; blank for none.
      reranker:
        base-url: ${ASSISTANT_RERANKER_BASE_URL:}
        timeout: ${ASSISTANT_RERANKER_TIMEOUT:PT5S}
        depth: ${ASSISTANT_RERANKER_DEPTH:20}
      # Each kltn-docs chapter's step-by-step flow (§4), beside its rules, statuses and edge cases. On since the corpus
      # is kltn-docs (16/11): some answers live only there (the 7-day return window, 17 §4.6), and RetrievalEval's
      # keyword-only recall@5 is 0.625 on, 0.450 off, with the same noise (design §6.1, §6.4). Off, their passages go.
      flows: ${ASSISTANT_KNOWLEDGE_FLOWS:true}
      # How many of a search's words a passage must hold to be found by its words (a rule it names, or a title close
      # to it, is found regardless). Chosen on RetrievalEval's numbers; see design §6.
      min-matched-words: ${ASSISTANT_KNOWLEDGE_MIN_MATCHED_WORDS:2}
    # POST /api/v1/assistant/mcp (design §7): the tools for another AI client, whose answers go to whichever model
    # provider that client uses. Off unless asked for until the business decides AQ-17; the local profile turns it on.
    mcp:
      enabled: ${ASSISTANT_MCP_ENABLED:false}
    # POST /api/v1/assistant/transcriptions (ADR-0019): a spoken question, written down for the speaker to correct and
    # send. The recording goes to the speech model and is kept nowhere. Off unless asked for, as MCP is.
    voice:
      enabled: ${ASSISTANT_VOICE_ENABLED:false}
      # Blank: the chat's model, which only Gemini's can be. Otherwise a model named as in routing.models, e.g.
      # openai/whisper-small for a Whisper server inside the company (the one choice data-policy LOCAL_ONLY leaves).
      model: ${ASSISTANT_VOICE_MODEL:}
      # Recordings one user may have written down a day, beside the 10 a minute questions share.
      daily-limit: ${ASSISTANT_VOICE_DAILY_LIMIT:100}
    # The work queue's morning digest (FE contract 3.1): one inbox message per staff user with the counts of their
    # sections, read as that user (RunAs). Off unless asked for; never with security off.
    digest:
      enabled: ${ASSISTANT_DIGEST_ENABLED:false}
      cron: ${ASSISTANT_DIGEST_CRON:0 30 7 * * MON-SAT}
    # The watch (design §9.1, ADR-0016): every few minutes it reads, AS EACH back-office USER (their roles, scope and
    # warehouses now), the lists below that are theirs to act on, and posts what is new to their inbox. Off unless asked
    # for; never with security off. post: lists whose news is posted (heldOrders, the one list since the rescope,
    # ADR-0010). roles: per list, the roles it is posted to (a business decision, design §13; Sales handle holds,
    # kltn-docs 17 §5); a list not named goes to whoever may read it. analyse: lists whose news the assistant also
    # answers a question about in a conversation of the user's; each is a model call, so none by default. models: where those answers go, named as
    # in routing.models; blank for the questions' own. run-budget: no answer starts that could end later in a run.
    watch:
      enabled: ${ASSISTANT_WATCH_ENABLED:false}
      cron: ${ASSISTANT_WATCH_CRON:0 */15 7-19 * * MON-SAT}
      post: ${ASSISTANT_WATCH_POST:heldOrders}
      roles:
        heldOrders: ${ASSISTANT_WATCH_HELD_ORDERS_ROLES:SALES_STAFF}
      analyse: ${ASSISTANT_WATCH_ANALYSE:}
      daily-analyses: ${ASSISTANT_WATCH_DAILY_ANALYSES:3}
      analyses-per-run: ${ASSISTANT_WATCH_ANALYSES_PER_RUN:5}
      run-budget: ${ASSISTANT_WATCH_RUN_BUDGET:PT30M}
      rebaseline-after: ${ASSISTANT_WATCH_REBASELINE_AFTER:P4D}
      models: ${ASSISTANT_WATCH_MODELS:}

  payment:
    # The company's bank account a customer transfers to (SCRUM-193, kltn-docs 15 §4.1 step 1). Blank here on purpose and
    # in prod: GET /orders/me/{id}/transfer-instructions answers 503 TRANSFER_INSTRUCTIONS_UNAVAILABLE until all three
    # are set per deployment, so a customer is never shown a made-up account. local, dev and test carry a demo one.
    company-bank:
      bank-name: ${COMPANY_BANK_NAME:}
      account-number: ${COMPANY_BANK_ACCOUNT_NUMBER:}
      account-name: ${COMPANY_BANK_ACCOUNT_NAME:}
      # The bank's six-digit NAPAS BIN: the chat's transfer card (kltn-docs 16 BR-06) draws a VietQR code with it. Without
      # it the card shows the account, with no QR code.
      bank-bin: ${COMPANY_BANK_BIN:}
    # What the review of a credit request warns the accountant about (QĐ-A, owner decision 2026-11-26): warnings only,
    # nothing is refused. Fewer settled contracts than min-settled-contracts: too little history. The suggested limit is
    # suggested-months months of what the customer paid a month on average over the last twelve.
    credit:
      min-settled-contracts: ${CREDIT_MIN_SETTLED_CONTRACTS:2}
      suggested-months: ${CREDIT_SUGGESTED_MONTHS:1}
    # The bank feed (credit plan 2026-11-26 part C; kltn-docs 15 BR-02): SePay reads the company account and calls
    # POST /api/v1/bank-transactions/webhooks/sepay for each incoming transfer; a transfer whose content names one
    # installment becomes a receipt by itself, anything else waits in the Accountant's queue. Off unless
    # BANK_FEED_ENABLED=true; then the webhook needs one credential, as configured on my.sepay.vn: the HMAC secret
    # (recommended) or the API key. docs/bank-feed-sepay.md says how to set it up and demo it.
    bank-feed:
      enabled: ${BANK_FEED_ENABLED:false}
      # The account customers pay into; a transfer into another account waits for the Accountant. Blank: any account.
      account-number: ${BANK_FEED_ACCOUNT_NUMBER:${stockflow.payment.company-bank.account-number:}}
      webhook:
        hmac-secret: ${BANK_FEED_WEBHOOK_HMAC_SECRET:}
        api-key: ${BANK_FEED_WEBHOOK_API_KEY:}
        max-skew: ${BANK_FEED_WEBHOOK_MAX_SKEW:PT5M}
      # SePay's API v2, read every night for transfers the webhook missed. A Test-mode token works only on
      # https://userapi-sandbox.sepay.vn/v2. No token: the catch-up only retries transfers a failure left unhandled.
      api:
        base-url: ${BANK_FEED_API_BASE_URL:https://userapi.sepay.vn/v2}
        token: ${BANK_FEED_API_TOKEN:}
        lookback: ${BANK_FEED_API_LOOKBACK:P3D}
      catch-up-cron: ${BANK_FEED_CATCH_UP_CRON:0 40 1 * * *}

  # The seller a sales contract names (4B-4, kltn-docs 14 §4.3 step 11) and an e-invoice is issued by (WF-05 E1/E2).
  # Blank here on purpose: local, dev and test carry a demo one, and in the prod profile the application refuses
  # to start until the five legal fields are set (SellerProfileRequirement), so no contract or invoice names a made-up company.
  seller:
    name: ${SELLER_NAME:}
    tax-code: ${SELLER_TAX_CODE:}
    address: ${SELLER_ADDRESS:}
    representative: ${SELLER_REPRESENTATIVE:}
    representative-title: ${SELLER_REPRESENTATIVE_TITLE:}
    # The letterhead of business documents (quotation, contract): optional, each left out of the paper when blank. The
    # account is the one customers pay into, so it follows payment.company-bank unless set apart. logo is a Spring
    # resource location of a PNG (classpath:..., file:/...); the application refuses to start on one it cannot read.
    phone: ${SELLER_PHONE:}
    email: ${SELLER_EMAIL:}
    website: ${SELLER_WEBSITE:}
    bank-account-number: ${SELLER_BANK_ACCOUNT_NUMBER:${COMPANY_BANK_ACCOUNT_NUMBER:}}
    bank-name: ${SELLER_BANK_NAME:${COMPANY_BANK_NAME:}}
    bank-branch: ${SELLER_BANK_BRANCH:}
    city: ${SELLER_CITY:}
    logo: ${SELLER_LOGO:}
  invoicing:
    # E-invoices (WF-05 E2). Which provider issues and whether complete drafts are issued automatically are data
    # (invoicing.einvoice_provider_config), changed at runtime by the administrator - not here.
    # How often invoices waiting for the provider's answer are asked about, and complete drafts issued when automatic
    # issuing is on.
    reconcile-interval: ${EINVOICE_RECONCILE_INTERVAL:PT30S}
    # How often drafts close to their deadline are looked for, and how long before it the accountants are told. An
    # invoice is issued by the end of its date (ND 254/2026 Dieu 9 khoan 1; WF-05 Q-1: the next working day of Phu luc
    # diem 7 is for night sales without automatic issuing, not this system), so the warning comes within the day: four
    # hours ahead.
    deadline-sweep-interval: ${EINVOICE_DEADLINE_SWEEP_INTERVAL:PT15M}
    due-warning-lead: ${EINVOICE_DUE_WARNING_LEAD:PT4H}
    # How long an invoice may wait for the provider's answer before the accountants are told it is stuck (the same
    # sweep). The reconciliation keeps asking either way.
    stuck-after: ${EINVOICE_STUCK_AFTER:PT30M}
    # How long after it was last sent an invoice the provider has no record of may be taken back from it by the
    # accountant (POST /api/v1/einvoices/{id}/withdrawal). Longer than two hours: SePay retries a request it took in for
    # up to two hours, and the application refuses to start with less.
    withdraw-after: ${EINVOICE_WITHDRAW_AFTER:PT3H}
    # How long after an invoice was submitted the reconciliation may still send it again by itself while the provider
    # has no record of it. Past it the invoice is only asked about, so its last send ages and the accountant can take
    # it back withdraw-after later: sent again every quiet period for ever, it never could (HD-1).
    auto-resend-for: ${EINVOICE_AUTO_RESEND_FOR:PT1H}
    # How long after its last send an invoice the provider still "cannot say" anything about may be taken back by the
    # accountant, after checking with the provider (HD-1). At least withdraw-after; without it such an invoice, and
    # every later-dated one of its series, would wait for good.
    withdraw-unknown-after: ${EINVOICE_WITHDRAW_UNKNOWN_AFTER:P1D}
    # The provider's remaining invoices under which the accountants are warned, once a day (kltn-docs 21 BR-09). Only a
    # provider that tells its quota (SePay: GET /v1/usage) is asked; 0 turns the warning off.
    quota-warning-below: ${EINVOICE_QUOTA_WARNING_BELOW:50}
    sandbox:
      # How long the sandbox provider takes to "sign and get the tax authority's code" before a result is there.
      processing-delay: ${EINVOICE_SANDBOX_PROCESSING_DELAY:PT5S}
      # Buyer tax codes the sandbox refuses as wrong, to rehearse a rejection.
      rejected-tax-codes: ${EINVOICE_SANDBOX_REJECTED_TAX_CODES:0000000001}
    viettel:
      # Viettel SInvoice (WF-05 E3). Not in use until an administrator stores its account and switches to it
      # (PUT /api/v1/einvoice-settings/providers/VIETTEL_SINVOICE/account, then .../activation); the account's password
      # is sealed with STOCKFLOW_SECRETS_KEY and is not configuration. Viettel's public description names one API host;
      # a test account is used against it, so the sandbox address differs only if Viettel gives another.
      production-url: ${EINVOICE_VIETTEL_PRODUCTION_URL:https://api-vinvoice.viettel.vn}
      sandbox-url: ${EINVOICE_VIETTEL_SANDBOX_URL:https://api-vinvoice.viettel.vn}
      # Viettel asks for at least 90 seconds before a transaction is sent again, and does not stop two submissions of
      # one transaction that overlap: the answer is waited for longer than that, and a transaction a look-up does not
      # find is not submitted again inside the quiet period since it was last sent, nor after Viettel has forgotten its
      # id (three days after it was first sent). One call is up to four round trips (log-in and request, both again on
      # a 401): 4 x (connect-timeout + read-timeout) must stay below the quiet period and the 15-minute provider lease,
      # or the application does not start.
      read-timeout: ${EINVOICE_VIETTEL_READ_TIMEOUT:PT95S}
      resubmit-quiet-period: ${EINVOICE_VIETTEL_RESUBMIT_QUIET_PERIOD:PT7M}
      resubmit-window: ${EINVOICE_VIETTEL_RESUBMIT_WINDOW:P3D}
      file-pause: ${EINVOICE_VIETTEL_FILE_PAUSE:PT2S}
      payment-status-paid: ${EINVOICE_VIETTEL_PAYMENT_STATUS_PAID:true}
    sepay:
      # SePay eInvoice. Its key is configuration, unlike Viettel's account: a client id and secret from SePay's portal
      # ("API xuat hoa don dien tu"), issued per environment - a SANDBOX key signs in only to the sandbox host. Not in
      # use until an administrator switches to it (POST /api/v1/einvoice-settings/providers/SEPAY_EINVOICE/activation),
      # which is refused while either value is blank.
      environment: ${EINVOICE_SEPAY_ENVIRONMENT:SANDBOX}
      client-id: ${EINVOICE_SEPAY_CLIENT_ID:}
      client-secret: ${EINVOICE_SEPAY_CLIENT_SECRET:}
      # Which of the account's invoicing registrations (GET /v1/provider-accounts) issues; blank takes the first active.
      provider-account-id: ${EINVOICE_SEPAY_PROVIDER_ACCOUNT_ID:}
      sandbox-url: ${EINVOICE_SEPAY_SANDBOX_URL:https://einvoice-api-sandbox.sepay.vn}
      production-url: ${EINVOICE_SEPAY_PRODUCTION_URL:https://einvoice-api.sepay.vn}
      read-timeout: ${EINVOICE_SEPAY_READ_TIMEOUT:PT30S}
      # A transaction a look-up does not find is sent again only this long after it was last sent. 4 x (connect-timeout
      # + read-timeout) must stay below it and the 15-minute provider lease, or the application does not start.
      resubmit-quiet-period: ${EINVOICE_SEPAY_RESUBMIT_QUIET_PERIOD:PT10M}
    corrections:
      # Whether a 04/SS-HDDT notice may also be recorded for an invoice that was adjusted or replaced. TT 91/2026
      # Dieu 10 khoan 1 diem b does not ask for one and it is not verified whether a provider sends it by itself
      # (E0 row 2): off until the provider or the tax authority says otherwise. A wrong buyer name or address
      # (diem a) is always notified, whatever this says.
      error-notice-with-correction: ${EINVOICE_ERROR_NOTICE_WITH_CORRECTION:false}
  order:
    quote:
      # How long a quote drawn up from a customer's quote request - on the chat's card or in the request inbox - is
      # valid until Sales change it.
      draft-from-request-validity: ${QUOTE_DRAFT_FROM_REQUEST_VALIDITY:P14D}
      # kltn-docs 14 BR-10 (2026-11-26, replacing decision D-1's alert after the send): a quote with a price break more
      # than this percent below its reference - the customer's own price, else the variant's standard price - or with no
      # reference, waits for the Sales Manager (sales-quote-price-approvals:APPROVE) to approve it before it is sent.
      price-approval-percent: ${QUOTE_PRICE_APPROVAL_PERCENT:10}
    contract:
      # Print-sample rounds a new contract offers without charge (14 BR-18, decided 2026-11-05); Sales may change it.
      free-sample-rounds: ${CONTRACT_FREE_SAMPLE_ROUNDS:2}
      # Standing terms printed on a quotation and a contract. The tolerance of a printed run's quantity, either way
      # (0 prints no clause, at most 10); the warranty of the print after delivery, in months (0 prints none); the
      # penalty for a breach, which Luat Thuong mai 2005 Dieu 301 caps at 8% - more is refused at startup.
      quantity-tolerance-percent: ${CONTRACT_QUANTITY_TOLERANCE_PERCENT:5}
      warranty-months: ${CONTRACT_WARRANTY_MONTHS:6}
      penalty-percent: ${CONTRACT_PENALTY_PERCENT:8}
      # Days from sending a contract to the day the customer should have signed by (1 to 60); Sales may move the day while
      # the contract is sent. Past it the contract shows "overdue to sign" and Sales is told once; nothing is cancelled.
      sign-days: ${CONTRACT_SIGN_DAYS:7}
      # When the nightly check of contracts past their signing deadline runs (Saigon time).
      sign-deadline-cron: ${CONTRACT_SIGN_DEADLINE_CRON:0 15 1 * * *}
    contract-signing:
      # How the company signs a contract (ContractSigner). The certificate is a TEST one nobody vouches for: either a
      # PKCS#12 you supply (base64, one line) with its password, or - with none - an RSA 3072 key generated at the first
      # signing and kept in the database, sealed with the secret below. Never commit any of these.
      keystore: ${CONTRACT_SIGNING_KEYSTORE:}
      keystore-password: ${CONTRACT_SIGNING_KEYSTORE_PASSWORD:}
      # Seals the generated key and hashes customers' one-time codes. Required in the prod profile (the application
      # refuses to start without it); elsewhere a development default is used with a warning. Changing it makes the
      # stored key unreadable (the signer then fails) and ends the codes in flight. Any long random string.
      secret: ${CONTRACT_SIGNING_SECRET:}
      # The storefront's origin: the QR code on a contract's certificate page points at
      # <this>/xac-minh-hop-dong/<code>. Blank prints the code and no QR code.
      verification-base-url: ${CONTRACT_VERIFICATION_BASE_URL:}
      # A customer's one-time code: how long it works, how soon another may be asked for, and how many an hour.
      otp-lifetime: ${CONTRACT_OTP_LIFETIME:PT10M}
      otp-resend-after: ${CONTRACT_OTP_RESEND_AFTER:PT1M}
      otp-per-hour: ${CONTRACT_OTP_PER_HOUR:5}
    production-order:
      # How long the links e-mailed to a producer - its production order slip and print files - work (4A-3). Every use
      # is checked again (the production order still open, the file still the approved one) and gets a presigned URL
      # of minutes, so this may cover a production run; a later message (the approved sample) carries fresh links.
      file-links-valid-for: ${PRODUCTION_ORDER_FILE_LINKS_VALID_FOR:P30D}
    follow-up:
      # When the salesperson who sent a contract is told, once, in the inbox (14 §6): the customer has not signed it, or
      # has signed and not paid the installment due on signing. Nothing is cancelled for them; Sales decides.
      unsigned-contract-after: ${SALES_FOLLOW_UP_UNSIGNED_CONTRACT_AFTER:P3D}
      unpaid-order-after: ${SALES_FOLLOW_UP_UNPAID_ORDER_AFTER:P3D}
      interval: ${SALES_FOLLOW_UP_INTERVAL:PT1H}

  customer:
    # Where the portal invitation e-mail sends the customer's contact (SCRUM-450); the token is
    # appended as a URL fragment, which browsers never send to a server. Blank switches invitations
    # off (503 PORTAL_INVITATION_UNAVAILABLE) rather than failing startup. Set it per deployment.
    portal-activation-url: ${PORTAL_ACTIVATION_URL:}

  identity:
    portal-invitation:
      # How long an invitation link works, and how soon Sales may replace an open one.
      lifetime: ${PORTAL_INVITATION_LIFETIME:PT72H}
      resend-cooldown: ${PORTAL_INVITATION_RESEND_COOLDOWN:PT1M}

  fulfillment:
    load-planning:
      # How much search one load-plan calculation gets (decision LP2-10), counted in work, not wall time, so the plan is
      # the same on a slow or a fast machine; the planner returns the best plan found so far when it runs out
      # (LoadPlanRequest.budget). On the benchmark (100, 300 and 500 cartons with
      # sets, LoadPlannerBenchmarkTest) 3 s already matched the 30 s reference on a laptop; 5 s keeps a margin for a
      # smaller server, where the same search runs slower. Read by the load-estimate service (PR EST) and the
      # load-plan service (SCRUM-287 PR D).
      solver-budget: PT5S
      # Real time cap of one calculation, apart from the budget (owner decision SOLVER-CAP, 02/11): a slow or busy
      # machine cannot hang a request; when it passes, the planner returns the best plan found so far, flagged
      # budgetExhausted (LoadPlanRequest.wallLimit).
      solver-wall-limit: PT12S
    ahamove:
      # live: Ahamove's real API. fake: an in-memory Ahamove that makes no network call, for demos (FakeAhamoveGateway);
      # it needs no STOCKFLOW_SECRETS_KEY, adds a remote control under /api/v1/fulfillment/dev/fake-ahamove, and the
      # application refuses to start with it under the prod profile. Only the local profile sets it, never a server.
      mode: ${AHAMOVE_MODE:live}
      # Ahamove's partner API v3 (3-4). Which one a carrier calls is its own setting (STAGING / PRODUCTION), as are its
      # account and key (sealed on the carrier).
      staging-url: ${AHAMOVE_STAGING_URL:https://partner-apistg.ahamove.com}
      production-url: ${AHAMOVE_PRODUCTION_URL:https://partner-api.ahamove.com}
      # The reason sent when an order is cancelled. Ahamove accepts only reasons from its own list of user reasons.
      cancel-comment: ${AHAMOVE_CANCEL_COMMENT:Khách hàng muốn hủy đơn}
      # Ahamove does not sign its callbacks: a fixed header value is all that tells it from anyone who learnt the
      # value. So (WF-05 fix plan item 6):
      webhook:
        # A final outcome (a drop-off delivered or failed, the order cancelled, completed or returned) is applied only
        # once GET /v3/orders/{id} gives the same; otherwise the event is UNVERIFIED, on the manager's error list.
        verify-outcomes: ${AHAMOVE_WEBHOOK_VERIFY_OUTCOMES:true}
        # A report the carrier dates longer ago than this is logged STALE and not applied.
        max-age: ${AHAMOVE_WEBHOOK_MAX_AGE:PT24H}
        # A report dated later than now by more than this goes to the error list: applied, it would make every true
        # report after it look outdated.
        max-future: ${AHAMOVE_WEBHOOK_MAX_FUTURE:PT5M}
        # Optional: the addresses and CIDR blocks callbacks may come from, comma-separated; empty allows any. Behind a
        # reverse proxy the address seen is the proxy's unless forwarded headers are trusted (server.forward-headers-
        # strategy), so set this only together with that.
        allowed-ips: ${AHAMOVE_WEBHOOK_ALLOWED_IPS:}

  security:
    # Turns on the resource-server filter chain AND RequiresPermissionAspect. Both are behind the
    # same switch on purpose: a state where the chain is on but the aspect is off means every
    # @RequiresPermission is silently unenforced, which is worse than either being off.
    # Default is ON. Switch it off per profile, never here.
    enabled: true
    # How long a sign-in lasts (ISO-8601, at most 24h). Each token has a server-side session that
    # logout, "sign out other devices", a password change and a role change end immediately, so this
    # only bounds how long an abandoned or stolen device keeps working. Changing it affects tokens
    # issued from then on; existing ones keep the lifetime they were signed with.
    token-ttl: PT8H
    jwt:
      # The RSA key tokens are signed with (JwtSigningKey). key-path: a PKCS#8 PEM file, generated and written there
      # (owner-only) on the first start if missing, read on every start after - so tokens survive a restart or a
      # deploy. private-key: the PEM content itself, for platforms that inject secrets as variables; wins over
      # key-path. Neither: a key generated per process, as local development and tests want. A configured key that
      # cannot be read or parsed stops the application at startup.
      key-path: ${JWT_PRIVATE_KEY_PATH:}
      private-key: ${JWT_PRIVATE_KEY:}
    links:
      # Links a partner opens without signing in, for a limited time (SignedLinks; 4A-3: a producer's links to its
      # production order slip and print files). key: the HMAC key, base64 of at least 32 bytes (openssl rand -base64 32);
      # required once base-url is set (the application refuses to start without it, unless process-key-allowed, which
      # only the local profile sets). base-url: where the application is reached from outside, every link starts with
      # it; blank makes no link and the mail says the coordinator sends the files.
      key: ${STOCKFLOW_LINKS_KEY:}
      base-url: ${STOCKFLOW_PUBLIC_BASE_URL:}
    secrets:
      # The AES-256 key stored secrets are sealed with (SecretCipher): a carrier's API key, webhook secret and webhook
      # header credential (kltn-docs 09 §4.1). Base64 of exactly 32 bytes: openssl rand -base64 32. Blank: the
      # application starts, and saving such a secret answers 503 SECRETS_UNAVAILABLE. A malformed key stops the
      # application at startup. Changing it makes every secret sealed with the old key unreadable - enter them again.
      key: ${STOCKFLOW_SECRETS_KEY:}
    cors:
      # Browser origins that may call the API (CorsProperties). Patterns: a port or a subdomain may
      # be '*', the host itself may not. A deployment overrides this with
      # STOCKFLOW_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS, comma-separated.
      allowed-origin-patterns: http://localhost:*,https://*.stockflow.vn

logging:
  level:
    com.stockflow: ${LOG_LEVEL:INFO}
    org.springframework.modulith: INFO
  # No `pattern:` here on purpose. logback-spring.xml defines the appenders directly, so
  # logging.pattern.console would be read by nothing - and a dead setting that disagrees with the
  # live one is worse than no setting at all.
