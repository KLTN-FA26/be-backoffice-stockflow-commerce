# =============================================================================
# nginx main configuration. Site definitions are in templates/stockflow.conf.template, rendered
# into conf.d/ by the official image's entrypoint (envsubst of DOMAIN and S3_BUCKET).
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # -------------------------------------------------------------------------
    # The client's real address.
    #
    # A request to a proxied host arrives from a Cloudflare edge, so $remote_addr is Cloudflare's
    # address until the realip module replaces it with CF-Connecting-IP - and it does so ONLY for
    # connections from the listed ranges. A request to a DNS-only host (api, s3, media) comes from
    # the client itself, so $remote_addr is already right and realip leaves it alone; the same
    # rule is why such a client cannot spoof its address by sending the header itself.
    #
    # This is what RateLimitInterceptor ends up keying on: proxy-headers.conf OVERWRITES
    # X-Forwarded-For with this value, and the interceptor reads the leftmost entry.
    # -------------------------------------------------------------------------
    include /etc/nginx/snippets/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;

    # $realip_remote_addr is the connecting address BEFORE realip replaced it, i.e. the Cloudflare
    # edge (or a direct caller). cloudflare-only.conf drops anything that did not come through
    # Cloudflare, on the hosts that include it. This has to live in nginx rather than ufw: Docker's
    # published ports bypass ufw.
    geo $realip_remote_addr $from_cloudflare {
        default 0;
        include /etc/nginx/snippets/cloudflare-geo.conf;
    }

    # The DNS-only hosts have no Cloudflare edge in front of them, so this is their only flood
    # guard: per client address, coarse, well above what a person clicking through the UI sends.
    # The application's own @RateLimit (login, search) stays the fine-grained layer. Generous on
    # purpose: requests the frontend proxies through its Vercel function all share a few Vercel
    # addresses, so here "one client" can be the whole team.
    limit_req_zone  $binary_remote_addr zone=edge_req:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=edge_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Docker's embedded DNS. Upstreams are resolved per request (see the `set $upstream` lines in
    # the template) instead of once at startup: a redeploy recreates the app container with a new
    # IP, and an nginx that resolved `app` at startup would keep sending to the old one - 502 until
    # someone restarts nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format main '$remote_addr - [$time_local] "$host" "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time '
                    'cid=$upstream_http_x_correlation_id "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/problem+json text/plain text/css application/javascript;

    include /etc/nginx/conf.d/stockflow.conf;
    include /etc/nginx/conf.d/salesradar.conf;
}
