# =============================================================================
# Default (English) messages for every ErrorCode.
#
# The key is always error.<ERROR_CODE_NAME>. If a code has no key here, Messages.forCode falls back
# to ErrorCode.defaultMessage() - readable English rather than "???error.FOO???".
#
# These are the GENERIC message for a code. The specific detail a domain exception builds
# ("Insufficient stock for SKU SOFA-3S-GREY: requested 6, available 5") is not translated; see
# the Messages javadoc for why.
# =============================================================================

error.VALIDATION_FAILED=The submitted data is not valid
error.MALFORMED_REQUEST=The request could not be read
error.UNSUPPORTED_PARAMETER=Unsupported parameter value
error.UNKNOWN_PERMISSION=One or more permissions do not exist

error.UNAUTHORIZED=You are not signed in
error.FORBIDDEN=You do not have permission to do this
error.OUT_OF_DATA_SCOPE=You do not have access to this data

error.NOT_FOUND=Not found
error.ROLE_NOT_FOUND=Role not found
error.USER_NOT_FOUND=User not found
error.SUPPLIER_NOT_FOUND=Supplier not found
error.PURCHASE_ORDER_NOT_FOUND=Purchase order not found
error.PRODUCT_NOT_FOUND=Product not found
error.CATEGORY_NOT_FOUND=Category not found
error.CUSTOMER_NOT_FOUND=Customer not found
error.ADDRESS_NOT_FOUND=Address not found
error.WAREHOUSE_NOT_FOUND=Warehouse not found
error.ZONE_NOT_FOUND=Zone not found
error.SHELF_NOT_FOUND=Shelf not found
error.SHELF_LEVEL_NOT_FOUND=Shelf level not found
error.BIN_NOT_FOUND=Bin not found
error.AREA_NOT_FOUND=Area not found
error.BOUNDARY_NOT_FOUND=Boundary not found
error.LOCATION_NOT_FOUND=Storage location not found
error.ACCOUNT_NOT_ACTIVE=This account cannot sign in right now
error.INVALID_CURRENT_PASSWORD=The current password is incorrect
error.PASSWORD_UNCHANGED=The new password must differ from the current one

error.CONFLICT=This conflicts with the current state
error.PRODUCT_CODE_ALREADY_EXISTS=A product with this code already exists
error.INVALID_PRODUCT_STATUS_TRANSITION=This product cannot move to that status right now
error.SELF_APPROVAL_NOT_ALLOWED=A product cannot be approved by the person who submitted it
error.SHIPPING_ADDRESS_REQUIRED=Add a shipping address before placing an order
error.GUEST_CHECKOUT_DISABLED=Guest checkout is not available
error.CUSTOMER_EMAIL_ALREADY_EXISTS=A customer account with this email already exists
error.INSUFFICIENT_STOCK=Not enough stock available
error.OPTIMISTIC_LOCK=Someone else changed this record. Please reload and try again.
error.LOCK_TIMEOUT=This record is busy. Please try again in a moment.
error.DUPLICATE_KEY=A record with these values already exists
error.IDEMPOTENT_REQUEST_IN_PROGRESS=An identical request is still being processed
error.SUPPLIER_INACTIVE=This supplier cannot receive new purchase orders
error.INVALID_PURCHASE_ORDER_TRANSITION=This purchase order cannot move to that status right now
error.SHELF_CAPACITY_EXCEEDED=This shelf cannot hold that many levels or bins
error.SHELF_LEVEL_HAS_BINS=Bins can only be generated on levels that have none yet
error.WAREHOUSE_PREFIX_ALREADY_EXISTS=A warehouse with this prefix already exists
