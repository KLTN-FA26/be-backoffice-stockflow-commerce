# Local development. Activate with: --spring.profiles.active=local
spring:
  flyway:
    # Adds the demo seed on top of the production migrations. Deliberately a separate location,
    # so demo stock can never reach an environment that did not ask for it.
    locations: classpath:db/migration,classpath:db/demo
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  modulith:
    events:
      republish-outstanding-events-on-restart: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.stockflow: DEBUG
    # Uncomment to see every statement with its bound parameters when chasing an N+1:
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE

stockflow:
  payment:
    # Obviously not a real account (SCRUM-193): demo values so the transfer instructions render on a laptop.
    company-bank:
      bank-name: ${COMPANY_BANK_NAME:DEMO BANK (not a real bank)}
      account-number: ${COMPANY_BANK_ACCOUNT_NUMBER:0000000000}
      account-name: ${COMPANY_BANK_ACCOUNT_NAME:DEMO STOCKFLOW CO LTD}
      bank-bin: ${COMPANY_BANK_BIN:970000}   # not a bank's BIN: the demo VietQR code names no real bank
  # Obviously not a real company (4B-4, WF-05 E1): demo values so a contract and an invoice can be drawn up here.
  seller:
    name: ${SELLER_NAME:DEMO STOCKFLOW CO LTD}
    tax-code: ${SELLER_TAX_CODE:0000000000}
    address: ${SELLER_ADDRESS:1 Demo Street, Ho Chi Minh City}
    representative: ${SELLER_REPRESENTATIVE:Demo Director}
    representative-title: ${SELLER_REPRESENTATIVE_TITLE:Director}
  customer:
    # The Next.js customer portal on its default dev port (SCRUM-451); mail goes to Mailpit.
    portal-activation-url: ${PORTAL_ACTIVATION_URL:http://localhost:3000/portal/activate}
  notification:
    email:
      # Every message into Mailpit (http://localhost:8025), whatever its recipient. EMAIL_PROVIDER=resend with a
      # RESEND_API_KEY tries the real thing from a laptop.
      provider: ${EMAIL_PROVIDER:smtp}
  upload-inspection:
    # No ClamAV container needed on a laptop. Everywhere else the default (true) applies and a
    # missing scanner fails the upload closed. To scan locally: docker-compose.media.yml.
    enabled: false
  storage:
    # Keep MinIO for local work: it exercises the same S3 code path the deployment uses.
    # Switch to 'local' only to run without Docker; see LocalFileStorage for what it cannot do.
    provider: s3
  security:
    # Off locally so the endpoints can be exercised with curl and Swagger UI without minting a JWT.
    # Note what this costs: @RequiresPermission is NOT enforced under this profile, so a permission
    # mistake will not show up here. Run with the default profile before believing the matrix works.
    enabled: false
    links:
      base-url: ${STOCKFLOW_PUBLIC_BASE_URL:http://localhost:8080}
      # A laptop may sign with a key made per process: its links die at a restart, which nobody minds here.
      process-key-allowed: true
