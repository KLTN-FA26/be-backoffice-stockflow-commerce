# =============================================================================
# Vietnamese messages. This file MUST be UTF-8; I18nConfig sets the encoding explicitly because
# Java properties files default to ISO-8859-1, which renders every diacritic as mojibake - and it
# looks correct in the IDE, so the fault is invisible until the app is opened.
#
# Tone: address the user directly, say what to do next where there is something to do. "Xin thu
# lai" (please try again) is useful; "Loi he thong" (system error) is not.
# =============================================================================

