inbox.einvoice.rejected.title=E-invoice %s was rejected
inbox.einvoice.rejected.body=E-invoice %s of order %s was rejected by the provider or the tax authority (error code %s). Reopen it, correct it and issue it again by %s.
inbox.einvoice.stuck.title=E-invoice %s has no result yet
inbox.einvoice.stuck.body=E-invoice %s of order %s was sent to the provider at %s and has no result yet. The system keeps asking; check the connection to the provider - the invoice is due by %s.
inbox.einvoice.return-unadjusted.title=Return %s needs an adjustment e-invoice drawn up by hand
inbox.einvoice.return-unadjusted.body=The refund of return %s of order %s was approved, but %d refunded piece(s) on %d order line(s) are on no issued e-invoice that could be adjusted: the delivery's invoice is not issued yet, it is being replaced, or a piece of the carton is not worth whole dong. Once the invoice is issued, draw the decrease adjustment up from it, naming the return.
inbox.einvoice.return-refused.title=No adjustment e-invoice was drawn up for return %s
inbox.einvoice.return-refused.body=The refund of return %s of order %s was approved, but its decrease adjustment could not be drawn up (%s). Remove the cause, then draw the adjustment up from the invoice, naming the return.
inbox.einvoice.unknown.title=E-invoice %s must be sent again
inbox.einvoice.unknown.body=E-invoice %s of order %s was sent to the provider at %s, and the provider no longer knows that submission. It is not sent again automatically: open it and send it as a new submission, by %s.
inbox.einvoice.delivery-failed.title=E-invoice %s invoices a delivery that failed
inbox.einvoice.delivery-failed.body=The delivery invoiced by e-invoice %s of order %s was corrected to a failure after the invoice was issued (sent to the provider at %s). The system could not reduce it in full itself because it is already being adjusted or replaced: bring it to nothing by hand with a decrease adjustment for what is left of it.
inbox.einvoice.delivery-failed-awaiting.title=E-invoice %s is at the provider for a delivery that failed
inbox.einvoice.delivery-failed-awaiting.body=The delivery invoiced by e-invoice %s of order %s was corrected to a failure while the invoice was at the provider (sent at %s). Nothing to do now: once the provider answers, the system reduces it in full if it was issued, or voids it if it was refused. Do not issue it again by hand.
inbox.einvoice.signature-invalid.title=E-invoice %s is issued with a seller's signature that does not hold
inbox.einvoice.signature-invalid.body=E-invoice %s of order %s was issued by the provider (sent at %s), but the seller's digital signature on its XML does not check: the content changed, the signature is not its certificate's, or there is none. It has not been sent to the customer. Check it on the provider's portal and issue a replacement.
inbox.einvoice.account.quota-low.title=The e-invoice plan at %s is running out
inbox.einvoice.account.quota-low.body=The e-invoice plan at %s has %d invoice(s) left, under the warning level of %d. Buy more on the provider's portal before invoices are refused.
inbox.einvoice.account.quota-exhausted.title=The e-invoice plan at %s is used up
inbox.einvoice.account.quota-exhausted.body=%s refuses e-invoices because the plan's invoices are used up (code %s). Buy more on the provider's portal, then reopen the refused invoices and issue them again.
inbox.einvoice.account.billing-unpaid.title=The e-invoice plan at %s is not paid
inbox.einvoice.account.billing-unpaid.body=%s refuses e-invoices because the plan is not paid (code %s). Pay it on the provider's portal, then reopen the refused invoices and issue them again.
inbox.einvoice.account.account-not-ready.title=The e-invoice account at %s is not ready
inbox.einvoice.account.account-not-ready.body=%s refuses e-invoices because the account's registration is not complete, not approved by the tax authority, or not the one configured (code %s). Finish it on the provider's portal, then reopen the refused invoices and issue them again.
inbox.einvoice.buyer-incomplete.title=The customer of order %s needs details for its e-invoice
inbox.einvoice.buyer-incomplete.body=E-invoice %s of order %s cannot be issued: the customer's profile lacks %s. Record it on the customer, then the accountant refreshes the buyer on the invoice.
inbox.einvoice.buyer-incomplete.missing.NAME=the company name
inbox.einvoice.buyer-incomplete.missing.TAX_CODE=the tax code
inbox.einvoice.buyer-incomplete.missing.ADDRESS=the invoicing address
inbox.einvoice.buyer-incomplete.missing.EMAIL=the e-mail that receives invoices
inbox.einvoice.delivery-reversal.title=Draft adjustment %s reduces an invoice whose delivery failed
inbox.einvoice.delivery-reversal.body=A delivery of order %2$s was corrected to a failure after its e-invoice was issued. The system drew up the draft adjustment %1$s, which reduces that invoice in full; no agreement with the buyer is needed. Check it and issue it by %4$s. When the goods are delivered again, a new invoice is drawn up for them.
inbox.einvoice.issued.title=The e-invoice of order %s has been issued
inbox.einvoice.error-notice.title=An error was found on an e-invoice of order %s
inbox.einvoice.error-notice.body=An e-invoice of order %s carries your company's name or address wrongly. It stays valid; the tax authority has been notified of the right details. You can read the notice with the invoice under Invoices.
inbox.einvoice.issued.body=The e-invoice for the delivered goods of order %s has been issued. You can read it and download its PDF and XML under Invoices.
inbox.einvoice.due.title=E-invoice %s must be issued by %s
inbox.einvoice.due.body=The draft e-invoice %s of order %s is dated %s and must be signed and sent for the tax authority's code by %s. Check the buyer's details and issue it.
inbox.einvoice.overdue.title=E-invoice %s is overdue: it had to be issued by %s
inbox.einvoice.overdue.body=E-invoice %s of order %s, dated %s, is still not issued and its deadline (%s) has passed. Issue it now, or, if it is waiting for the provider, check it again; you are reminded every day until it is issued.
inbox.einvoice.draft-failed.title=No e-invoice was drawn up for a delivery of order %s
inbox.einvoice.draft-failed.body=A shipment of order %s was delivered, but its draft e-invoice could not be drawn up (%s). Every delivery is invoiced: remove the cause, then draw the invoice up from the shipment.
inbox.einvoice.draft-failed.fee-rest.title=No e-invoice was drawn up for the rest of the delivery fee of order %s
inbox.einvoice.draft-failed.fee-rest.body=The undelivered rest of order %s was closed, and the part of its delivery fee no delivery's invoice carries could not be drawn up (%s). Remove the cause, then draw the invoice up from the order.
inbox.sales.follow-up.contract-unsigned.title=Contract %s is not signed after %d days
inbox.sales.follow-up.contract-unsigned.body=Contract %s of order %s was sent on %s and the customer has not signed it. Ask the customer, or cancel the contract with a reason.
inbox.sales.follow-up.order-unpaid.title=Order %s is not paid %d days after signing
inbox.sales.follow-up.order-unpaid.body=Order %s (contract %s) was signed on %s and the installment due on signing is not paid. Remind the customer; past too long, cancel the order (PAYMENT_NOT_RECEIVED).

