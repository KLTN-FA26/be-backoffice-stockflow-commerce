# =============================================================================
# StockFlowCommerce - modular monolith
#
# One application, one database, fourteen modules. Everything that was a service registry,
# a gateway route table or a Kafka topic in the previous architecture is gone; what is left is
# a datasource, a Flyway path and the settings that make in-process events durable.
# =============================================================================

spring:
  servlet:
    multipart:
      # Category policy still enforces 10 MiB product / 50 MiB design limits.
      max-file-size: 50MB
      max-request-size: 51MB
  application:
    name: stockflow-monolith

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
      # JavaMail otherwise derives the Message-ID and the EHLO name from this machine's canonical host
      # name, a reverse DNS lookup that took ~10 s per e-mail on a developer laptop. mail.from covers
      # the Message-ID (the sender header is still set per message); MAIL_SMTP_LOCALHOST names the
      # host in EHLO when the deployment's DNS is slow. Blank keeps JavaMail's own lookup.
      mail.from: ${MAIL_FROM:noreply@stockflow.local}
      mail.smtp.localhost: ${MAIL_SMTP_LOCALHOST:}

  # ---------------------------------------------------------------------------
  # ONE datasource. This single block is what replaced fourteen of them.
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockflow}
    username: ${DB_USER:stockflow}
    password: ${DB_PASSWORD:stockflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Sized for the machine, not the module count. The old deployment ran 14 pools of 10 and
      # opened 140 connections to serve a load one pool of 20 handles - which is why Postgres
      # needed a connection pooler in front of it. Rule of thumb: cores * 2 + effective spindles.
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 5
      connection-timeout: 3000        # fail fast; a request waiting 30s for a connection is dead anyway
      max-lifetime: 1800000           # 30 min, below any proxy or database idle timeout
      pool-name: stockflow-pool
      # MUST stay false while hibernate.connection.provider_disables_autocommit is true below.
      # With that flag set, Hibernate skips its own setAutoCommit(false) on the assumption the pool
      # already did it. If the pool has not, every statement commits on its own and @Transactional
      # rollback becomes a no-op - which would silently destroy the atomicity this whole
      # architecture is built on, with no error anywhere to point at it.
      auto-commit: false
      # Belt and braces with the server-side setting in docker-compose: a statement still running
      # after 10s is not going to finish usefully and is holding a connection every module shares.
      connection-init-sql: SET statement_timeout = 10000
      # MUST stay true while auto-commit is false. Without it Hikari runs the init SQL above and
      # neither commits nor rolls back, so every new connection enters the pool "idle in
      # transaction": Postgres kills it after idle_in_transaction_session_timeout (60s in
      # docker-compose) and the pool logs "Failed to validate connection ... has been closed" on
      # the next borrow. SET is transactional too, so the first rollback on such a connection
      # would also undo the statement_timeout it was opened to set.
      isolate-internal-queries: true
      # Every module shares this pool. That is the monolith's main operational risk: a runaway
      # report query can starve checkout. Mitigated by statement timeouts below, and revisited in
      # docs/adr/0005 if reporting ever needs its own read replica.

  jpa:
    open-in-view: false               # OFF. Leaving it on lets lazy loading happen inside view
                                      # rendering, which hides N+1 queries and holds a connection
                                      # for the whole request. Spring warns about it for a reason.
    hibernate:
      ddl-auto: validate              # NEVER "update". Flyway owns the schema; Hibernate's job is
                                      # to complain loudly when the entities and the tables differ.
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        # Fails the build the moment a query triggers a lazy collection outside a session, rather
        # than letting it become a LazyInitializationException in production.
        enable_lazy_load_no_trans: false
        query:
          fail_on_pagination_over_collection_fetch: true
        connection:
          # Saves a round trip per transaction: Hibernate does not call setAutoCommit(false) because
          # the pool hands over connections that already have it off. Paired with
          # spring.datasource.hikari.auto-commit: false above - the two must agree.
          provider_disables_autocommit: true
    show-sql: false                   # use the p6spy/actuator route in dev; never log SQL in prod

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Every module's migrations live in one path and run in one ordered sequence, because they
    # share one database. File names are timestamped (V20260901000200__...) rather than numbered
    # sequentially: with five people committing migrations in parallel, V3__ collides constantly
    # and a timestamp never does.
    baseline-on-migrate: false
    validate-on-migrate: true
    default-schema: public
    schemas: public                   # the module schemas are created by the first migration

  # ---------------------------------------------------------------------------
  # Modulith event publication registry - the outbox, provided by the framework.
  # ---------------------------------------------------------------------------
  modulith:
    events:
      jdbc:
        schema-initialization:
          # Flyway owns the schema; see V20260901000400. Auto-creation at startup is convenient in
          # development and wrong in production - the deployed schema would differ from what the
          # migration history says is there, and nothing would record the difference.
          #
          # No `schema:` key here on purpose: that property belongs to the JDBC registry, and this
          # application uses the JPA one, whose entity maps to an unqualified table name.
          enabled: false
      # Replays every publication that never completed. This is the guarantee that a crash between
      # "order committed" and "confirmation email sent" costs a delay, not a lost email.
      republish-outstanding-events-on-restart: true
      completion-mode: UPDATE         # keep completed rows for audit rather than deleting them
      externalization:
        enabled: false                # nothing leaves the process today

  # spring-modulith-observability's ModuleObservabilityBeanPostProcessor wraps every bean it
  # considers part of an application module - including the *shared* ones in `common` - in a CGLIB
  # proxy for cross-module tracing spans. It does this with its own hand-rolled
  # BeanPostProcessor.postProcessAfterInitialization, bypassing AbstractAutoProxyCreator entirely,
  # so it does not honour @Order, spring.aop.auto=false, or the AopInfrastructureBean marker the
  # way a normal Spring AOP proxy creator would.
  #
  # That proxy is fatal for CorrelationIdFilter, RequestLoggingFilter, UnsecuredDataScopeFilter and
  # IdempotencyFilter: GenericFilterBean.init() and OncePerRequestFilter.doFilter() are `final`, so
  # CGLIB cannot override them, and Tomcat calling filter.init() on the proxy runs the inherited
  # method body against the PROXY's own (Objenesis-constructed, never-initialised) fields rather
  # than the target's - "Cannot invoke Log.isDebugEnabled() because this.logger is null" - which
  # fails filter startup and takes the whole embedded Tomcat context down with it. Confirmed this
  # is not something this change introduced: it reproduces identically on an unmodified `develop`
  # checkout, so the application has never actually booted successfully with tracing on.
  #
  # Excluding only ModuleObservabilityAutoConfiguration (not management.tracing.enabled) keeps
  # ordinary Micrometer/OTel request tracing working; it removes only Modulith's own additional
  # module-boundary spans, which is the feature that is broken.
  autoconfigure:
    exclude:
      - org.springframework.modulith.observability.autoconfigure.ModuleObservabilityAutoConfiguration
      - org.springframework.modulith.observability.autoconfigure.SpringDataRestModuleObservabilityAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          # The identity module issues and signs the tokens, and this same application validates
          # them. Kept as a URI rather than an inline key so that moving identity out later is a
          # configuration change, not a code change.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/oauth2/jwks}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
    web:
      pageable:
        # Pages.of() enforces the same ceiling, but only where an author remembers to call it.
        # A controller that declares a Pageable parameter directly is resolved by Spring, and
        # Boot's default max-page-size is 2000 - one request could ask for 2000 rows with their
        # associations. A limit enforced in some endpoints and not others is the same as no limit,
        # so it is set here as well, where it applies to every Pageable Spring resolves.
        max-page-size: 200
        default-page-size: 20

  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 500
      thread-name-prefix: stockflow-async-
    scheduling:
      pool:
        size: 4                       # the reservation sweeper and the nightly jobs share this

  threads:
    virtual:
      enabled: true                   # Java 21 virtual threads: request handling is IO-bound, and
                                      # this removes the platform-thread ceiling under load

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful                  # let in-flight orders finish before the process exits
  error:
    include-message: never            # exception text can leak internals; GlobalExceptionHandler
    include-stacktrace: never         # produces the client-safe body instead

# -----------------------------------------------------------------------------
# Observability. One process, so a trace is a stack rather than a distributed puzzle - which was
# one of the concrete wins of collapsing the services.
# -----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,applicationmodules
        # "applicationmodules" is Modulith's: it serves the live module structure and dependencies
        # as JSON, so the architecture diagram in the report can be regenerated from the running
        # application rather than drawn by hand and left to rot.
  endpoint:
    health:
      show-details: when-authorized
      # when-authorized alone means ANY authenticated user - a CUSTOMER - sees every detail,
      # including the storage bucket and endpoint. Boot matches these against the caller's
      # authorities, so a permission works here: whoever holds platform-actuator:READ
      # (ActuatorPermission, granted in the role matrix) - never a role name.
      roles: platform-actuator:READ
      probes:
        # /actuator/health/liveness and /readiness, which is what Kubernetes probes.
        enabled: true
  health:
    # -------------------------------------------------------------------------
    # WHICH DEPENDENCY FAILURES SHOULD TAKE AN INSTANCE OUT OF SERVICE
    #
    # readiness = "can this instance serve traffic". Postgres: yes, nothing works without it.
    # Redis, object storage, Elasticsearch: NO. They degrade a feature; taking every instance out
    # of the load balancer because MinIO is down turns a degraded upload path into a total outage -
    # the classic way a health check causes the incident it was meant to detect.
    #
    # They still appear in /actuator/health, so a dashboard and an alert see them. The difference
    # is that a human decides what to do rather than the orchestrator deciding for everyone.
    # -------------------------------------------------------------------------
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
    group:
      readiness:
        include: readinessState, db
        show-details: when-authorized
      liveness:
        # Liveness answers "is this JVM wedged". A dependency being down is not a reason to RESTART
        # the process - the restart cannot fix Redis, and a crash loop makes recovery harder.
        include: livenessState
  info:
    # Populates /actuator/info from build-info.properties (see the spring-boot-maven-plugin
    # execution). env is deliberately OFF: it would print resolved configuration, which includes
    # anything that arrived from an environment variable.
    build:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    env:
      enabled: false
  metrics:
    tags:
      application: stockflow-monolith
    # The assistant's answer, model-call and tool timers publish histogram buckets, so p50 and p95 come out of Prometheus
    # for the evaluation report (docs/assistant-design.md §10.2, §11), not out of a guess.
    distribution:
      percentiles-histogram:
        "[assistant.answer]": true
        "[gen_ai.client.operation]": true
        "[assistant.tool]": true
  otlp:
    tracing:
      # Boot's OTLP exporter reads THIS property. It does not honour OTEL_EXPORTER_OTLP_ENDPOINT -
      # that variable is read only by opentelemetry-spring-boot-starter, which is not a dependency
      # here. Note it is the full endpoint including /v1/traces, not a base URL.
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

  group-configs:
    - group: all
      packages-to-scan: com.stockflow

    - group: inventory
      packages-to-scan: com.stockflow.inventory

    - group: order
      packages-to-scan: com.stockflow.order
    - group: procurement
      packages-to-scan: com.stockflow.procurement

    - group: warehouse
      packages-to-scan: com.stockflow.warehouse

# -----------------------------------------------------------------------------
# Application settings owned by this system rather than by a framework.
# -----------------------------------------------------------------------------
stockflow:
  api:
    # Shown in the generated OpenAPI document. Bump on a breaking API change.
    version: 1.0.0

  # ---------------------------------------------------------------------------
  # Cache. TTLs are NOT here - they live beside the cache name in CacheNames, so a name and its
  # expiry cannot drift apart. Only the key namespace is configurable.
  # ---------------------------------------------------------------------------
  cache:
    # Bump this when a cached type changes shape. Every key is prefixed with it, so a deployment
    # whose DTOs gained a field starts from a clean namespace instead of deserialising yesterday's
    # objects into the new class.
    version: v1

  # ---------------------------------------------------------------------------
  # Reporting (SCRUM-344): the sales rollups behind the dashboard.
  # ---------------------------------------------------------------------------
  reporting:
    # On the first start after deploy, roll up the orders placed before the listeners existed. Does nothing once the
    # history is in. POST /api/v1/reports/rebuild does the same by hand.
    backfill-on-startup: true

  # ---------------------------------------------------------------------------
  # HTTP idempotency. Applies to any unsafe request carrying an Idempotency-Key header.
  # ---------------------------------------------------------------------------
  idempotency:
    enabled: true
    purge-cron: "0 15 * * * *"      # hourly, off the hour so it does not collide with other jobs

  # ---------------------------------------------------------------------------
  # Audit trail (BRD 3.19.3).
  #
  # These durations DESTROY DATA when they elapse. Confirm both against the retention policy the
  # business actually signs before go-live - the defaults are a starting point, not a decision.
  # ---------------------------------------------------------------------------
  audit:
    routine-retention: P180D        # ordinary business actions: six months
    security-retention: P730D       # logins, grants, exports, deletes: two years
    purge-cron: "0 30 3 * * *"      # nightly, off-peak

  # ---------------------------------------------------------------------------
  # Outbound HTTP. Java's HttpClient has NO default read timeout; these are what stop a hung
  # dependency from consuming every thread in the application. See HttpClientProperties.
  # ---------------------------------------------------------------------------
  http:
    connect-timeout: PT3S
    read-timeout: PT10S

  procurement:
    buyer:
      company-name: ${PO_BUYER_COMPANY_NAME:}
      company-address: ${PO_BUYER_COMPANY_ADDRESS:}
      contact-name: ${PO_BUYER_CONTACT_NAME:}
      phone: ${PO_BUYER_PHONE:}
      email: ${PO_BUYER_EMAIL:}
      receiving-address: ${PO_RECEIVING_ADDRESS:}
    # Three-way match of supplier invoices (SCRUM-309, BR-INV-002): an invoice's unit price may stray this far, in
    # percent either way, from the purchase order's net price before the match calls it a variance. Quantities have no
    # tolerance: an invoice bills no more than was received and passed QC (kltn-docs 04 BR-02).
    invoice-match:
      price-tolerance-percent: ${INVOICE_PRICE_TOLERANCE_PERCENT:2}

  notification:
    # Exact HTTPS hosts owned by trusted suppliers; blank disables API delivery (email still works).
    supplier-api-allowed-hosts: ${SUPPLIER_API_ALLOWED_HOSTS:}
    po-retry-interval: PT1M
    # -------------------------------------------------------------------------
    # E-mail (SCRUM-352). Every message - supplier POs, staff notices, the portal invitation, customer order mail -
    # goes through one transport. resend: Resend's HTTP API (the dev and prod profiles' default); smtp: spring.mail
    # above (Mailpit locally); recording: kept in memory, never sent (the test profile). See EmailProperties.
    # -------------------------------------------------------------------------
    email:
      provider: ${EMAIL_PROVIDER:smtp}
      # "StockFlow <no-reply@your-domain>". With Resend the domain must be verified in its dashboard.
      from: ${RESEND_FROM:${MAIL_FROM:noreply@stockflow.local}}
      # Where a customer's reply goes (e.g. Sales' shared mailbox). Blank: customer mail says not to reply.
      reply-to: ${RESEND_REPLY_TO:}
      locale: vi
      sender-name: ${EMAIL_SENDER_NAME:StockFlow}
      customer:
        # Off sends no customer order mail (recorded as skipped) and leaves staff and supplier mail alone.
        enabled: ${CUSTOMER_EMAIL_ENABLED:true}
        max-attempts: 10
        first-retry-delay: PT1M
        max-retry-delay: PT6H
        # How often failed customer mail is looked at again (CustomerEmailRetry).
        retry-interval: PT1M
      resend:
        # Never commit a key. Required when provider is resend: without it the application does not start.
        api-key: ${RESEND_API_KEY:}
        base-url: https://api.resend.com
        # Signing secret of the Resend webhook (whsec_...). Blank: POST /api/v1/notifications/webhooks/resend
        # answers 503 and Resend retries until it is set.
        webhook-secret: ${RESEND_WEBHOOK_SECRET:}
        webhook-tolerance: PT5M
        # Resend allows a team 2 requests per second by default; each instance keeps to this.
        requests-per-second: ${RESEND_REQUESTS_PER_SECOND:2}
        max-concurrent-requests: 2
    # In-app inbox: read messages older than this are deleted by the nightly purge (unread ones are kept).
    inbox-retention-days: 90
    inbox-purge-cron: "0 45 3 * * *"
    # Language of system-generated inbox messages (the bundle i18n/messages_<locale>.properties).
    inbox-locale: vi
    # Stock alerts: who is told, by staff role. The scope (all warehouses, or the ones a person is assigned to) and the
    # exclusion of customers are applied by IdentityService.notificationRecipients.
    inventory-alert:
      stock-level-roles: INVENTORY_PLANNER,SYSTEM_ADMIN
      expiry-roles: WAREHOUSE_MANAGER,INVENTORY_PLANNER,SYSTEM_ADMIN
    # Open question Q3: also e-mail the same text to the people newly told in-app. Off until an SMTP server is configured.
    inventory-alert-email:
      enabled: false

  # ---------------------------------------------------------------------------
  # File storage. 's3' talks to MinIO locally and to S3 in a deployment - the same code path.
  # 'local' writes to the filesystem and is for development only; it cannot work with more than
  # one instance and its presigned URLs are not real URLs.
  # ---------------------------------------------------------------------------
  storage:
    provider: s3
    bucket: stockflow
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    region: ap-southeast-1
    # MinIO needs path-style addressing; real S3 uses virtual-host style. Wrong value produces a
    # DNS failure that looks nothing like a configuration problem.
    path-style: true
    # Static keys only for MinIO. Left blank against real S3 so the SDK's default provider chain
    # picks up the instance role - long-lived keys in a properties file are how credentials leak.
    access-key: ${MINIO_ACCESS_KEY:stockflow}
    secret-key: ${MINIO_SECRET_KEY:stockflow123}
    presigned-url-ttl: PT10M        # a signed URL is a credential with no revocation; keep it short

  catalog:
    availability:
      # At or under this many units the catalog shows "low stock" (docs 13 §4.2, an assumption
      # the docs leave open). 0 never warns.
      low-stock-threshold: ${CATALOG_LOW_STOCK_THRESHOLD:5}
      # SKUs one availability call may ask about: a page's worth, not the whole catalogue.
      max-skus-per-request: 50
    search:
      # Ranking weights (SCRUM-182): score = text-rank*w1 + title-similarity*w2 + exact-SKU*w3 + in-stock*w4.
      # Text rank and similarity are 0..1, so an exact SKU always wins and stock only breaks near ties.
      text-rank-weight: 1.0
      similarity-weight: 1.0
      exact-sku-weight: 10.0
      in-stock-weight: 0.25
      # Typo fallback when nothing matches exactly: minimum trigram similarity with the title.
      fallback-similarity: 0.2
      # Best matches that are ranked and pageable (stock is ranked in memory, over this many).
      ranking-window: 500

  product-media:
    # Public CloudFront/custom-domain origin. Blank keeps private upload working but public gallery returns 503.
    cloud-front-base-url: ${PRODUCT_MEDIA_CDN_BASE_URL:}

  web:
    request-log:
      enabled: true

  inventory:
    # How often the sweeper looks for holds that outlived their expiry. ISO-8601 duration.
    reservation-sweep-interval: PT1M
    # A lot that expires within this many days of the day it is received, or of today, is "near expiry"
    # (docs 03 BR-06; plan G5a-3 §6 #11): goods receipts warn, the expiry alerts use the same window.
    expiry-warning-days: 30
    # Most lines one planned cycle count may hold (SCRUM-146); a wider scope is refused so the count stays countable.
    cycle-count-max-lines: 500
    # Stock alerts (SCRUM-147). The drain evaluates the SKUs whose stock changed (a trigger on stock_item queues them).
    alert-drain-interval: PT30S
    alert-drain-initial-delay: PT30S
    # A condition that clears and returns inside this window reopens its alert row but is not announced again.
    alert-reopen-cooldown: PT6H
    # Nightly net under the drain (01:30) and the expiry sweep that moves expired stock to EXPIRED (02:00), business time.
    alert-reconcile-cron: "0 30 1 * * *"
    expiry-sweep-cron: "0 0 2 * * *"

  # The back-office AI assistant (ADR-0010, docs/assistant-design.md §11). Off by default; with no key it still starts
  # and answers 503 ASSISTANT_DISABLED. The key comes from the environment only, never from this file.
  assistant:
    enabled: ${ASSISTANT_ENABLED:false}
    # anthropic (ADR-0010), gemini, or openai: any server speaking OpenAI's chat-completions API, such as Ollama on
    # this machine (openai-compatible below). The key is the chosen provider's.
    provider: ${ASSISTANT_PROVIDER:anthropic}
    # ASSISTANT_API_KEY, or else the chosen provider's own variable below - never another vendor's: one vendor's key
    # sent to another is a credential disclosed to a third party. A key shaped like another vendor's is not used.
    api-key: ${ASSISTANT_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    # The openai provider's server and its optional key. Ollama: http://localhost:11434/v1, no key; give it a context of
    # 16k or more (OLLAMA_CONTEXT_LENGTH), since the instructions and tool definitions alone are several thousand tokens.
    openai-compatible:
      base-url: ${OPENAI_COMPATIBLE_BASE_URL:http://localhost:11434/v1}
      api-key: ${OPENAI_COMPATIBLE_API_KEY:}
      # The most an answer may take there (max_tokens is the smaller of this and max-output-tokens): a local model's
      # context holds the prompt and the answer together.
      max-output-tokens: ${OPENAI_COMPATIBLE_MAX_OUTPUT_TOKENS:4096}
    # CLOUD_ALLOWED, or LOCAL_ONLY: no model, embedding or document reader outside the company's network is ever built
    # (loopback, private addresses, single-label and .local/.internal names). The technical half of AQ-01.
    data-policy: ${ASSISTANT_DATA_POLICY:CLOUD_ALLOWED}
    # What the business approved the assistant's data to reach, beside the policy (design §5.5): provider ids
    # (anthropic, gemini, openai) and hosts outside the company's network, comma-separated; empty for any. A model,
    # embedding server or reader outside them is refused when the application starts, and the log says why.
    allowed-providers: ${ASSISTANT_ALLOWED_PROVIDERS:}
    allowed-hosts: ${ASSISTANT_ALLOWED_HOSTS:}
    # Customers go to the model provider as KH#1, KH#2 instead of their names; the panel shows the names (ADR-0014).
    pseudonymise-customers: ${ASSISTANT_PSEUDONYMISE_CUSTOMERS:true}
    model: ${ASSISTANT_MODEL:claude-opus-5-5}
    daily-message-limit: ${ASSISTANT_DAILY_LIMIT:50}
    # Model routing (docs/assistant-design.md §11). Unset, `model` alone answers, as before. Otherwise a question
    # starts on the first of `models` (cheapest first) whose quota is not spent. A model may name its vendor,
    # provider/model (openai/qwen3:8b, gemini/gemini-3.5-flash); a bare name is the assistant's own provider's, and so
    # is a name equal to `model`. A gateway's id that starts with a vendor (anthropic/claude-sonnet on OpenRouter) is
    # written openai/anthropic/claude-sonnet: alone it names Anthropic itself. Each
    # vendor's model gets that vendor's own key variable only, never ASSISTANT_API_KEY, and a model without one is left
    # out with a warning. A first call refused for a spent quota or an unreachable provider goes to the next model; once
    # a model has replied, the question stays on it. A question a model could not answer is asked once more on the next
    # model (escalate-on-failure). Moving on needs answer-lease to still hold two of the longest calls. A spent model is
    # skipped for quota-cooldown, an ISO-8601 duration; blank: until its vendor's quota day ends (midnight Pacific time
    # for Gemini, UTC otherwise).
    routing:
      models: ${ASSISTANT_MODELS:}
      escalate-on-failure: ${ASSISTANT_ESCALATE_ON_FAILURE:true}
      quota-cooldown: ${ASSISTANT_QUOTA_COOLDOWN:}
    # low | medium | high | xhigh | max. Low suits chat-style questions; raise it only if the golden set says so.
    effort: low
    max-tool-rounds: 6
    max-output-tokens: 16000
    retention-days: 90
    # One attempt; the SDK retries a failed call twice, each attempt with this timeout again.
    request-timeout: PT90S
    # How long a question holds its conversation. The loop starts no model call that could outlast it, so it must hold
    # at least two of the longest calls: request-timeout x 3 attempts x 2, checked at start-up.
    answer-lease: PT15M
    refusal-fallback: true
    # Idle conversations older than retention-days are deleted daily (business time).
    retention-cron: "0 30 3 * * *"
    # Searching the rules by meaning beside their words (design §6.4): the rules are in English, the questions in
    # Vietnamese. provider gemini serves a Gemini assistant only (the key is api-key below, or else the assistant's
    # own; never an Anthropic key). provider openai is the openai-compatible server above, such as Ollama with bge-m3
    # (model bge-m3, dimensions 1024): inside the company's network it serves any assistant, Claude included.
    # Otherwise the search stays keyword-only.
    embeddings:
      enabled: ${ASSISTANT_EMBEDDINGS_ENABLED:true}
      provider: ${ASSISTANT_EMBEDDINGS_PROVIDER:gemini}
      api-key: ${ASSISTANT_EMBEDDINGS_API_KEY:}
      model: ${ASSISTANT_EMBEDDINGS_MODEL:gemini-embedding-001}
      # 128-3072. A new model or length re-embeds every passage on the next start, in the background.
      dimensions: ${ASSISTANT_EMBEDDINGS_DIMENSIONS:768}
    # How the knowledge search ranks (design §6.4). Each value changes only on what RetrievalEval measures (§10.2).
    knowledge:
      # Robust deviations above the corpus's median similarity a passage must stand to count as near a question.
      standout: ${ASSISTANT_KNOWLEDGE_STANDOUT:3.0}
      fusion-depth: ${ASSISTANT_KNOWLEDGE_FUSION_DEPTH:10}
      # Embed the user's question too, beside the model's search terms; the tool then asks the model for it.
      multi-query: ${ASSISTANT_KNOWLEDGE_MULTI_QUERY:false}
      # text-embeddings-inference serving bge-reranker-v2-m3, inside the company's network only; blank for none.
      reranker:
        base-url: ${ASSISTANT_RERANKER_BASE_URL:}
        timeout: ${ASSISTANT_RERANKER_TIMEOUT:PT5S}
        depth: ${ASSISTANT_RERANKER_DEPTH:20}
      # The process flows (04c-all-flows.md). Off: the document names statuses the system does not have, and its
      # Vietnamese words crowd the English rules out of a keyword search (design §6.1). Off, their passages are removed.
      flows: ${ASSISTANT_KNOWLEDGE_FLOWS:false}
      # How many of a search's words a passage must hold to be found by its words (a rule it names, or a title close
      # to it, is found regardless). Chosen on RetrievalEval's numbers; see design §6.
      min-matched-words: ${ASSISTANT_KNOWLEDGE_MIN_MATCHED_WORDS:2}
    # POST /api/v1/assistant/mcp (design §7): the tools for another AI client, whose answers go to whichever model
    # provider that client uses. Off unless asked for until the business decides AQ-17; the local profile turns it on.
    mcp:
      enabled: ${ASSISTANT_MCP_ENABLED:false}
    # POST /api/v1/assistant/receipt-drafts (design §8.1): the photo of a delivery note goes whole to the model
    # provider, supplier prices and signatures included. Off unless asked for (AQ-01); the local profile turns it on.
    receipt-drafts:
      enabled: ${ASSISTANT_RECEIPT_DRAFTS_ENABLED:false}
      # Blank: the chat's model. Otherwise a model named as in routing.models, e.g. openai/qwen2.5vl:3b for a vision
      # model on the local server: a text model cannot see. Its vendor's own key only; the data policy applies.
      model: ${ASSISTANT_RECEIPT_DRAFTS_MODEL:}
    # The watch (design §9.1, ADR-0012): every few minutes it reads, AS EACH back-office USER (their roles, scope and
    # warehouses now), the lists below that are theirs to act on, and posts what is new to their inbox. Off unless asked
    # for; never with security off. post: lists whose news is posted (lowStock, heldOrders, overduePurchaseOrders); by
    # default the two nothing else tells anyone about, as inventory alerts already post low stock. roles: per list, the
    # roles it is posted to (a business decision, design §13); a list not named goes to whoever may read it. analyse:
    # lists whose news the assistant also answers a question about in a conversation of the user's (lowStock gives a
    # reorder proposal to confirm); each is a model call, so none by default. models: where those answers go, named as
    # in routing.models; blank for the questions' own. run-budget: no answer starts that could end later in a run.
    watch:
      enabled: ${ASSISTANT_WATCH_ENABLED:false}
      cron: ${ASSISTANT_WATCH_CRON:0 */15 7-19 * * MON-SAT}
      post: ${ASSISTANT_WATCH_POST:heldOrders,overduePurchaseOrders}
      roles:
        heldOrders: ${ASSISTANT_WATCH_HELD_ORDERS_ROLES:ORDER_COORDINATOR}
        overduePurchaseOrders: ${ASSISTANT_WATCH_OVERDUE_PO_ROLES:PROCUREMENT_STAFF,WAREHOUSE_MANAGER}
        lowStock: ${ASSISTANT_WATCH_LOW_STOCK_ROLES:}
      analyse: ${ASSISTANT_WATCH_ANALYSE:}
      daily-analyses: ${ASSISTANT_WATCH_DAILY_ANALYSES:3}
      analyses-per-run: ${ASSISTANT_WATCH_ANALYSES_PER_RUN:5}
      run-budget: ${ASSISTANT_WATCH_RUN_BUDGET:PT30M}
      rebaseline-after: ${ASSISTANT_WATCH_REBASELINE_AFTER:P4D}
      models: ${ASSISTANT_WATCH_MODELS:}

  payment:
    # The company's bank account a customer transfers to (SCRUM-193, kltn-docs 15 §4.1 step 1). Blank here on purpose and
    # in prod: GET /orders/me/{id}/transfer-instructions answers 503 TRANSFER_INSTRUCTIONS_UNAVAILABLE until all three
    # are set per deployment, so a customer is never shown a made-up account. local, dev and test carry a demo one.
    company-bank:
      bank-name: ${COMPANY_BANK_NAME:}
      account-number: ${COMPANY_BANK_ACCOUNT_NUMBER:}
      account-name: ${COMPANY_BANK_ACCOUNT_NAME:}

  customer:
    # Where the portal invitation e-mail sends the customer's contact (SCRUM-450); the token is
    # appended as a URL fragment, which browsers never send to a server. Blank switches invitations
    # off (503 PORTAL_INVITATION_UNAVAILABLE) rather than failing startup. Set it per deployment.
    portal-activation-url: ${PORTAL_ACTIVATION_URL:}

  identity:
    portal-invitation:
      # How long an invitation link works, and how soon Sales may replace an open one.
      lifetime: ${PORTAL_INVITATION_LIFETIME:PT72H}
      resend-cooldown: ${PORTAL_INVITATION_RESEND_COOLDOWN:PT1M}

  fulfillment:
    load-planning:
      # How much search one load-plan calculation gets (decision LP2-10), counted in work, not wall time, so the plan is
      # the same on a slow or a fast machine; the planner returns the best plan found so far when it runs out
      # (LoadPlanRequest.budget). On the benchmark (100, 300 and 500 cartons with
      # sets, LoadPlannerBenchmarkTest) 3 s already matched the 30 s reference on a laptop; 5 s keeps a margin for a
      # smaller server, where the same search runs slower. Read by the load-estimate service (PR EST) and the
      # load-plan service (SCRUM-287 PR D).
      solver-budget: PT5S
      # Real time cap of one calculation, apart from the budget (owner decision SOLVER-CAP, 02/11): a slow or busy
      # machine cannot hang a request; when it passes, the planner returns the best plan found so far, flagged
      # budgetExhausted (LoadPlanRequest.wallLimit).
      solver-wall-limit: PT12S

  security:
    # Turns on the resource-server filter chain AND RequiresPermissionAspect. Both are behind the
    # same switch on purpose: a state where the chain is on but the aspect is off means every
    # @RequiresPermission is silently unenforced, which is worse than either being off.
    # Default is ON. Switch it off per profile, never here.
    enabled: true
    # How long a sign-in lasts (ISO-8601, at most 24h). Each token has a server-side session that
    # logout, "sign out other devices", a password change and a role change end immediately, so this
    # only bounds how long an abandoned or stolen device keeps working. Changing it affects tokens
    # issued from then on; existing ones keep the lifetime they were signed with.
    token-ttl: PT8H
    jwt:
      # The RSA key tokens are signed with (JwtSigningKey). key-path: a PKCS#8 PEM file, generated and written there
      # (owner-only) on the first start if missing, read on every start after - so tokens survive a restart or a
      # deploy. private-key: the PEM content itself, for platforms that inject secrets as variables; wins over
      # key-path. Neither: a key generated per process, as local development and tests want. A configured key that
      # cannot be read or parsed stops the application at startup.
      key-path: ${JWT_PRIVATE_KEY_PATH:}
      private-key: ${JWT_PRIVATE_KEY:}
    cors:
      # Browser origins that may call the API (CorsProperties). Patterns: a port or a subdomain may
      # be '*', the host itself may not. A deployment overrides this with
      # STOCKFLOW_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS, comma-separated.
      allowed-origin-patterns: http://localhost:*,https://*.stockflow.vn

logging:
  level:
    com.stockflow: ${LOG_LEVEL:INFO}
    org.springframework.modulith: INFO
  # No `pattern:` here on purpose. logback-spring.xml defines the appenders directly, so
  # logging.pattern.console would be read by nothing - and a dead setting that disagrees with the
  # live one is worse than no setting at all.
