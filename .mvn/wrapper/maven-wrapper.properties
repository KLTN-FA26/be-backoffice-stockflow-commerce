# Pins the Maven version for everyone.
#
# distributionType=only-script is the modern wrapper: mvnw downloads and caches the distribution
# itself, so there is NO maven-wrapper.jar to commit. That matters - the old wrapper required a
# binary in the repository, which some organisations forbid and which nobody ever reviews.
#
# Regenerate with:  mvn wrapper:wrapper -Dmaven=3.9.9 -DdistributionType=only-script

wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
