# Testcontainers talks to Docker through docker-java, which defaults to Docker API 1.32. Docker
# Engine 29 (Docker Desktop, late 2026) refuses anything below 1.44 with a bare "Status 400", and
# every @Testcontainers test is then silently SKIPPED (disabledWithoutDocker) or fails to start its
# context. 1.44 is Docker Engine 25+, which every supported Docker Desktop and CI runner has.
api.version=1.44
