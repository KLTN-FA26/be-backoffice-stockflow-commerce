# Headers sent to the application. Spring runs with forward-headers-strategy=native: Tomcat applies
# X-Forwarded-For/-Proto/-Host/-Port, but only when the connection comes from a trusted proxy
# (server.tomcat.remoteip.internal-proxies, see deploy/README.md). Headers the application's forward
# handling does not understand but a client could send are cleared below. nginx passes client headers
# through by default; a header left unmentioned is a header the client controls.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
# OVERWRITE, never append ($proxy_add_x_forwarded_for). The rate limit keys on the client address
# Tomcat derives from this header; appending would leave a client-supplied value in it and give
# every forged request a fresh rate-limit bucket. $effective_client_ip
# (templates/stockflow.conf.template) is $remote_addr unless the request carries the exact BFF secret.
proxy_set_header X-Forwarded-For   $effective_client_ip;
proxy_set_header X-Real-IP         $effective_client_ip;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  443;

# Cleared: an empty value removes the header. Each of these is honoured by some forwarded-header
# handling (Spring's ForwardedHeaderFilter, if it is ever enabled) and would let a client rewrite the
# scheme, host or path of every link the application generates.
proxy_set_header Forwarded          "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Ssl    "";
# Ingress trust metadata from the back-office BFF, already consumed above. The application has no
# use for the shared secret, and must not log or echo it.
proxy_set_header X-Stockflow-Bff-Secret "";
proxy_set_header X-Stockflow-Client-IP  "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
